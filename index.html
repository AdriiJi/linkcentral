                render(); 
            }
            
            function initializeSortable(element) {
                if (sortableInstance) {
                    sortableInstance.destroy();
                }
                sortableInstance = new Sortable(element, {
                    group: 'shared-grid', 
                    animation: 250,
                    easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    handle: '.drag-handle',
                    disabled: isFiltering(),
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    dragClass: 'sortable-drag',
                    onStart: function(evt) {
                        draggedItemInfo = { id: evt.item.dataset.id, element: evt.item };
                        dropHandledByBackButton = false; 
                        if (!backToParentBtn.classList.contains('hidden')) {
                            backToParentBtn.addEventListener('dragover', handleDragOverBackButton);
                            backToParentBtn.addEventListener('dragleave', handleDragLeaveBackButton);
                            backToParentBtn.addEventListener('drop', handleDropOnBackButton);
                        }
                    },
                    onMove: function (evt) {
                        return true; 
                    },
                    onEnd: function (evt) {
                        if (!backToParentBtn.classList.contains('hidden')) { 
                            backToParentBtn.removeEventListener('dragover', handleDragOverBackButton);
                            backToParentBtn.removeEventListener('dragleave', handleDragLeaveBackButton);
                            backToParentBtn.removeEventListener('drop', handleDropOnBackButton);
                            backToParentBtn.classList.remove('drag-over-target');
                        }

                        if (dropHandledByBackButton) {
                            draggedItemInfo = null;
                            dropHandledByBackButton = false; 
                            return; 
                        }

                        const oldIndex = evt.oldDraggableIndex; 
                        const newIndex = evt.newDraggableIndex; 

                        const currentParentIdForSort = getCurrentParentId();
                        let itemsArrayToSort;
                        if (currentParentIdForSort) {
                            const parentResult = findItemRecursive(currentParentIdForSort);
                            if (!parentResult || !parentResult.item || !parentResult.item.items) {
                                render(); 
                                draggedItemInfo = null;
                                return;
                            }
                            itemsArrayToSort = parentResult.item.items;
                        } else {
                            itemsArrayToSort = data;
                        }

                        if (oldIndex === newIndex && evt.from === evt.to) {
                            draggedItemInfo = null; 
                            return;
                        }
                        
                        const newOrderIdsFromDom = Array.from(evt.to.children)
                                                 .map(child => child.dataset.id)
                                                 .filter(id => id); 

                        itemsArrayToSort.sort((a, b) => {
                            let posA = newOrderIdsFromDom.indexOf(a.id);
                            let posB = newOrderIdsFromDom.indexOf(b.id);

                            if (currentSearchTerm) {
                                if (posA === -1 && posB === -1) {
                                    return 0; 
                                }
                                if (posA === -1) return 1;
                                if (posB === -1) return -1;
                                return posA - posB;
                            } else {
                                if (posA === -1) posA = Infinity;
                                if (posB === -1) posB = Infinity;
                                return posA - posB;
                            }
                        });
                        
                        saveData();
                        render(); 
                        draggedItemInfo = null; 
                    },
                    onUnchoose: function(evt) {

            function timeAgo(ts) {
                const mins = Math.floor((Date.now() - ts) / 60000);
                if (mins < 1) return 'ahora';
                if (mins < 60) return `hace ${mins} min`;
                const hours = Math.floor(mins / 60);
                if (hours < 24) return `hace ${hours} h`;
                const days = Math.floor(hours / 24);
                if (days === 1) return 'ayer';
                if (days < 7) return `hace ${days} días`;
                return new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });

            // ---- Filtro por color en la cabecera ----
            function updateColorFilterBar() {
                const used = new Set();
                (function walk(items) {
                    items.forEach(i => {
                        if (i.color) used.add(String(i.color).toLowerCase());
                        if (i.type === 'group' && i.items) walk(i.items);
                    });
                })(data);
                if (activeColorFilter && !used.has(activeColorFilter)) activeColorFilter = '';
                colorFilterBarEl.innerHTML = '';
                if (used.size === 0) { colorFilterBarEl.classList.add('hidden'); return; }
                colorFilterBarEl.classList.remove('hidden');
                const order = c => { const i = COLOR_PALETTE.findIndex(p => p.value === c); return i === -1 ? 99 : i; };
                [...used].sort((a, b) => order(a) - order(b)).forEach(color => {
                    const dot = document.createElement('button');
                    dot.type = 'button';
                    dot.className = 'color-dot' + (color === activeColorFilter ? ' active' : '');

            // ---- Notas: texto enriquecido sencillo ----
            function escapeHTML(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function inlineMd(str) {
                let t = escapeHTML(str);
                t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
                t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
                t = t.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
                return t;
            }
            function renderNoteHTML(text) {
                let out = '';
                text.split('\n').forEach((line, i) => {
                    let m;
                    if ((m = line.match(/^\s*- \[([ xX])\] ?(.*)$/))) {
                        const checked = m[1].toLowerCase() === 'x';
                        out += `<label class="note-line note-check"><input type="checkbox" data-line="${i}"${checked ? ' checked' : ''}><span>${inlineMd(m[2])}</span></label>`;
                    } else if ((m = line.match(/^\s*[-*] (.*)$/))) {
                        out += `<div class="note-line note-li">${inlineMd(m[1])}</div>`;
                    } else if ((m = line.match(/^\s*(\d+)\. (.*)$/))) {
                        out += `<div class="note-line"><strong>${m[1]}.</strong> ${inlineMd(m[2])}</div>`;
                    } else if ((m = line.match(/^#{1,3} (.*)$/))) {
                        out += `<div class="note-line note-h">${inlineMd(m[1])}</div>`;
                    } else if (line.trim() === '') {
                        out += '<div class="note-gap"></div>';
                    } else {
                        out += `<div class="note-line">${inlineMd(line)}</div>`;
                    }
                });
                return out;
            }
            function checklistProgress(text) {
                const total = (text.match(/^\s*- \[[ xX]\]/gm) || []).length;
                const done = (text.match(/^\s*- \[[xX]\]/gm) || []).length;
                return { total, done };
            }
            function toggleChecklistLine(itemId, lineIndex) {
                if (noteState && noteState.id === itemId) flushNoteSave();
                const r = findItemRecursive(itemId);
                if (!r || !r.item.description) return;
                const lines = r.item.description.split('\n');
                if (typeof lines[lineIndex] === 'undefined') return;
                lines[lineIndex] = lines[lineIndex].replace(/^(\s*- \[)([ xX])(\])/, (m, a, b, c) => a + (b === ' ' ? 'x' : ' ') + c);
                r.item.description = lines.join('\n');
                r.item.updatedAt = Date.now();
                saveData();
                render();
                refreshNotePanel(itemId);
            }

            function updateNoteStats() {

            }
            function autoGrowNote() {
                if (!modalContentEl.classList.contains('note-mode')) return;
                modalItemDescription.style.height = 'auto';
                modalItemDescription.style.height = Math.min(modalItemDescription.scrollHeight + 2, window.innerHeight * 0.5) + 'px';
            }
            function applyNoteAction(action, ta = modalItemDescription) {
                ta.focus();
                const val = ta.value;
                const start = ta.selectionStart, end = ta.selectionEnd;
                if (action === 'check' || action === 'bullet' || action === 'heading') {
                    const prefix = { check: '- [ ] ', bullet: '- ', heading: '# ' }[action];
                    const lineStart = start === 0 ? 0 : val.lastIndexOf('\n', start - 1) + 1;
                    let lineEnd = val.indexOf('\n', end);
                    if (lineEnd === -1) lineEnd = val.length;
                    const lines = val.slice(lineStart, lineEnd).split('\n');
                    const allHave = lines.every(l => l.startsWith(prefix));
                    const newLines = lines.map(l => allHave ? l.slice(prefix.length) : prefix + l.replace(/^(- \[[ xX]\] |[-*] |#{1,3} )/, ''));
                    ta.setRangeText(newLines.join('\n'), lineStart, lineEnd, 'end');
                } else if (action === 'bold' || action === 'italic') {
                    const mark = action === 'bold' ? '**' : '*';
                    const sel = val.slice(start, end);
                    ta.setRangeText(mark + sel + mark, start, end, 'end');
                    if (!sel) ta.setSelectionRange(start + mark.length, start + mark.length);
                } else if (action === 'date') {
                    const stamp = new Date().toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    ta.setRangeText(stamp, start, end, 'end');
                }
                ta.dispatchEvent(new Event('input'));
            }
            noteToolbarEl.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });

            function noteEditorKeydown(e, onSubmit) {
                if (e.key !== 'Enter' || e.isComposing) return;
                if (e.ctrlKey || e.metaKey) { e.preventDefault(); onSubmit(); return; }
                if (e.shiftKey) return;
                const ta = e.target;
                if (ta.selectionStart !== ta.selectionEnd) return;
                const pos = ta.selectionStart, val = ta.value;
                const lineStart = pos === 0 ? 0 : val.lastIndexOf('\n', pos - 1) + 1;
                const m = val.slice(lineStart, pos).match(/^(\s*)(- \[[ xX]\] |[-*] |(\d+)\. )(.*)$/);
                if (!m) return;
                e.preventDefault();
                if (m[4].trim() === '') {
                    ta.setRangeText('', lineStart, pos, 'end');          // línea vacía: salir de la lista
                } else {
                    let marker = m[2];
                    if (/^- \[/.test(marker)) marker = '- [ ] ';
                    else if (m[3]) marker = (parseInt(m[3], 10) + 1) + '. ';
                    ta.setRangeText('\n' + m[1] + marker, pos, pos, 'end');
                }
                ta.dispatchEvent(new Event('input'));
            }

            function setNoteColor(value, save = true) {

            function saveNoteNow() {
                clearTimeout(noteSaveTimer);
                noteSaveTimer = null;
                if (!noteState) return;
                const description = notePanelText.value.trim();
                const name = notePanelTitle.value.trim() || deriveNoteName(description);
                if (!name) { setNoteStatus(''); return; }          // nota vacía: nada que guardar
                if (noteState.id) {
                    if (!findItemRecursive(noteState.id)) return;   // la nota ya no existe
                    editItem(noteState.id, name, undefined, description, undefined, noteState.color || '');
                } else {
                    const newId = generateId();
                    noteState.id = newId;
                    addItem('note', name, undefined, noteState.parentId, newId, undefined, null, description, noteState.color || '');
                }
                highlightActiveNote();
                setNoteStatus('Guardado ✓', true);
            }
            function scheduleNoteSave() {
                if (!noteState) return;
                setNoteStatus('Guardando…');
                clearTimeout(noteSaveTimer);
                noteSaveTimer = setTimeout(saveNoteNow, NOTE_SAVE_DELAY);

            function flushNoteSave() { if (noteSaveTimer) saveNoteNow(); }

            function openNotePanel(id = null, explicitParentId = null) {
                mainMenuDropdown.classList.remove('show');

                let item = null;
                if (id) {
                    const r = findItemRecursive(id);
                    if (!r) return;
                    item = r.item;
                }
                const parentId = explicitParentId !== null ? explicitParentId : getCurrentParentId();
                noteState = { id: id || null, parentId: parentId || null, color: '' };
                const desc = item ? (item.description || '') : '';
                notePanelText.value = desc;
                // Si el título es el automático (primera línea), se deja vacío para que siga al contenido

                itemDiv.appendChild(actionsContainer);

                const contentWrapper = document.createElement(item.type === 'link' ? 'a' : 'div');
                contentWrapper.className = 'item-content-wrapper';

                if (item.type === 'link') {
                    contentWrapper.href = item.url;
                    contentWrapper.target = '_blank';
                    contentWrapper.rel = 'noopener noreferrer';
                    contentWrapper.onclick = (e) => {
                        if (e.button === 1 || e.ctrlKey || e.metaKey) return; 
                    };
                } else if (item.type === 'note') {
                     // For notes, clicking acts as "viewing/editing"
                     contentWrapper.onclick = (e) => {
                        if (e.target.closest('.item-actions-container') || e.target.closest('.drag-handle')) return;
                        openModal('note', item.id); // Open modal to read/edit note
                    };
                } else { // Group
                    contentWrapper.onclick = (e) => {
                        if (e.target.closest('.item-actions-container') || e.target.closest('.drag-handle')) return;
                        currentViewStack.push(item.id); 
                        searchInputEl.value = ''; 
                        currentSearchTerm = '';
                        render();
                    };
                }
                
                const nameLineDiv = document.createElement('div');
                nameLineDiv.className = 'item-name-line';

                const itemIcon = document.createElement('span');
                itemIcon.className = 'item-icon';
                
                if (item.type === 'link') {
                    if (item.url && typeof item.url === 'string' && item.url.trim() !== '') {
                        try {
                            let fullUrl = item.url;
                            if (!fullUrl.startsWith('http://') && !fullUrl.startsWith('https://')) {
                                fullUrl = 'http://' + fullUrl;
                            }
                            const urlObject = new URL(fullUrl);
                            const faviconImg = document.createElement('img');
                            faviconImg.className = 'link-favicon';
                            faviconImg.alt = ''; 
                            faviconImg.src = `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(urlObject.origin)}&size=18`;
                            faviconImg.onerror = function() { 
                                this.remove(); 
                                const defaultIcon = itemIcon.querySelector('i');
                                if (!defaultIcon) itemIcon.innerHTML = '<i class="fas fa-link"></i>';
                            };
                            itemIcon.appendChild(faviconImg);
                        } catch (e) { itemIcon.innerHTML = '<i class="fas fa-link"></i>'; }
                    } else { itemIcon.innerHTML = '<i class="fas fa-link"></i>'; }
                } else if (item.type === 'note') {
                     itemIcon.innerHTML = '<i class="fas fa-sticky-note"></i>';
                } else { // Group
                    itemIcon.innerHTML = '<i class="fas fa-folder"></i>';
                }
                nameLineDiv.appendChild(itemIcon);

                const nameSpan = document.createElement('span');
                nameSpan.className = 'item-name';
                nameSpan.textContent = item.name;
                nameLineDiv.appendChild(nameSpan);
                
                contentWrapper.appendChild(nameLineDiv);

                // Búsqueda: mostrar en qué carpeta/subcarpeta está el resultado
                if (pathInfo && pathInfo.names.length > 0) {
                    const pathDiv = document.createElement('div');
                    pathDiv.className = 'item-path';
                    pathDiv.title = 'Ir a: ' + pathInfo.names.join(' / ');
                    pathDiv.innerHTML = '<i class="fas fa-folder-open"></i>';
                    const pathText = document.createElement('span');
                    pathText.textContent = pathInfo.names.join(' / ');
                    pathDiv.appendChild(pathText);
                    pathDiv.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        currentViewStack = [...currentViewStack, ...pathInfo.ids];
                        searchInputEl.value = '';
                        currentSearchTerm = '';
                        render();
                    };
                    contentWrapper.appendChild(pathDiv);
                }

                if (item.type === 'link' && item.description && item.description.trim() !== '') {
                    const descriptionDiv = document.createElement('div');
                    descriptionDiv.className = 'link-item-description';
                    descriptionDiv.textContent = item.description;
                    contentWrapper.appendChild(descriptionDiv);
                } else if (item.type === 'note' && item.description && item.description.trim() !== '') {
                    const preview = document.createElement('div');
                    const isLong = item.description.split('\n').length > 8 || item.description.length > 360;
                    preview.className = 'note-preview' + (isLong ? ' is-long' : '');
                    preview.innerHTML = renderNoteHTML(item.description);
                    preview.addEventListener('click', (e) => {
                        if (e.target.closest('.note-check')) {
                            e.stopPropagation();
                            if (e.target.tagName === 'INPUT') {
                                toggleChecklistLine(item.id, parseInt(e.target.dataset.line, 10));
                            }
                        } else if (e.target.closest('a')) {
                            e.stopPropagation();
                        }
                    });
                    contentWrapper.appendChild(preview);
                }

                if (item.type === 'note') {
                    const meta = document.createElement('div');
                    meta.className = 'note-meta';
                    const prog = checklistProgress(item.description || '');
                    const left = document.createElement('span');
                    left.className = 'note-progress';
                    if (prog.total > 0) {
                        left.innerHTML = `<span class="note-progress-bar"><i style="width:${Math.round(prog.done / prog.total * 100)}%"></i></span><span>${prog.done}/${prog.total}</span>`;
                    }
                    const right = document.createElement('span');
                    right.textContent = timeAgo(item.updatedAt || item.createdAt || Date.now());
                    meta.appendChild(left);
                    meta.appendChild(right);
                    contentWrapper.appendChild(meta);
                }
                
                itemDiv.appendChild(contentWrapper);
                return itemDiv;
            }
            
            // Quita mayúsculas y acentos para que "camion" encuentre "Camión"
            function normalizeText(str) {
                return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            }

            // Busca por nombre en el nivel actual y en TODAS las subcarpetas (recursivo)
            function collectSearchMatches(items, term, pathNames, pathIds, results, pathMap) {
                for (const item of items) {
                    const termOk = !term || normalizeText(item.name).includes(term) || (item.type === 'note' && normalizeText(item.description).includes(term));
                    const colorOk = !activeColorFilter || String(item.color || '').toLowerCase() === activeColorFilter;
                    if (termOk && colorOk) {
                        results.push(item);
                        pathMap.set(item.id, { names: [...pathNames], ids: [...pathIds] });
                    }
                    if (item.type === 'group' && item.items && item.items.length > 0) {
                        collectSearchMatches(item.items, term, [...pathNames, item.name], [...pathIds, item.id], results, pathMap);
                    }
                }
            }

            function render() {
                linkOrganizerEl.innerHTML = ''; 
                updateColorFilterBar();
                const currentParentId = getCurrentParentId();
                let itemsToDisplay;

                // ¿Hemos cambiado de carpeta? (para decidir qué animar y en qué dirección)
                const viewKey = currentViewStack.join('>');
                const viewChanged = viewKey !== lastViewKey;
                const viewDepth = currentViewStack.length;
                if (viewChanged && lastViewKey !== null && viewDepth > lastViewDepth) linkOrganizerEl.dataset.dir = 'in';
                else if (viewChanged && lastViewKey !== null && viewDepth < lastViewDepth) linkOrganizerEl.dataset.dir = 'out';
                else linkOrganizerEl.dataset.dir = 'none';

                breadcrumbsContainer.innerHTML = ''; 
                if (currentViewStack.length > 0) {
                    breadcrumbsContainer.classList.remove('hidden');
                    const rootLink = document.createElement('a');
                    rootLink.href = '#';
                    rootLink.innerHTML = '<i class="fas fa-home"></i>';
                    rootLink.title = "Inicio / Raíz";
                    rootLink.onclick = (e) => { 
                        e.preventDefault(); 
                        currentViewStack = []; 
                        searchInputEl.value = ''; currentSearchTerm = ''; 
                        render(); 
                    };
                    breadcrumbsContainer.appendChild(rootLink);
                    for (let i = 0; i < currentViewStack.length; i++) {
                        const groupId = currentViewStack[i];
                        const groupResult = findItemRecursive(groupId); 
                        if (groupResult && groupResult.item) {
                            const separator = document.createElement('span');
                            separator.className = 'breadcrumb-separator';
                            separator.textContent = '/';
                            breadcrumbsContainer.appendChild(separator);
                            const itemName = groupResult.item.name;
                            if (i < currentViewStack.length - 1) { 
                                const groupLink = document.createElement('a');
                                groupLink.href = '#';
                                groupLink.title = itemName; 
                                const groupLinkText = document.createElement('span');
                                groupLinkText.className = 'breadcrumb-item-text';
                                groupLinkText.textContent = itemName;
                                groupLink.appendChild(groupLinkText);
                                (function(index) { 
                                    groupLink.onclick = (e) => {
                                        e.preventDefault();
                                        currentViewStack = currentViewStack.slice(0, index + 1);
                                        searchInputEl.value = ''; currentSearchTerm = ''; 
                                        render();
                                    };
                                })(i);
                                breadcrumbsContainer.appendChild(groupLink);
                            } else { 
                                const currentGroupSpan = document.createElement('span');
                                currentGroupSpan.className = 'breadcrumb-current';
                                currentGroupSpan.title = itemName;
                                const currentGroupText = document.createElement('span');
                                currentGroupText.className = 'breadcrumb-item-text';
                                currentGroupText.textContent = itemName;
                                currentGroupSpan.appendChild(currentGroupText);
                                breadcrumbsContainer.appendChild(currentGroupSpan);
                            }
                        } else {
                            console.warn("Breadcrumb: No se pudo encontrar el grupo con ID:", groupId);
                            break; 
                        }
                    }
                } else {
                    breadcrumbsContainer.classList.add('hidden');
                }

                if (viewChanged) {
                    Array.from(breadcrumbsContainer.children).forEach((c, i) => c.style.setProperty('--c', Math.min(i, 10)));
                    breadcrumbsContainer.classList.add('crumbs-enter');
                } else {
                    breadcrumbsContainer.classList.remove('crumbs-enter');
                }

                if (currentParentId) {
                    const parentResult = findItemRecursive(currentParentId);
                    if (parentResult && parentResult.item.type === 'group') {
                        itemsToDisplay = parentResult.item.items || [];
                        backToParentBtn.classList.remove('hidden');
                    } else {
                        console.error("Render: No se pudo encontrar el grupo padre. Navegando a la raíz.");
                        currentViewStack = []; 
                        itemsToDisplay = data;
                        backToParentBtn.classList.add('hidden');
                        breadcrumbsContainer.classList.add('hidden'); 
                    }
                } else {
                    itemsToDisplay = data; 
                    backToParentBtn.classList.add('hidden');
                }

                let filteredItems = itemsToDisplay;
                const searchPaths = new Map();
                if (isFiltering()) {
                    filteredItems = [];
                    collectSearchMatches(itemsToDisplay, normalizeText(currentSearchTerm.trim()), [], [], filteredItems, searchPaths);
                }
                
                let sortedItems = [...filteredItems]; 
                const pinned = sortedItems.filter(item => item.isPinned);
                const unpinned = sortedItems.filter(item => !item.isPinned);

                const sortFunction = (a, b) => {
                    if (currentSortPreference === 'default') return 0;

                    switch (currentSortPreference) {
                        case 'name_asc':
                            return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
                        case 'name_desc':
                            return b.name.localeCompare(a.name, 'es', { sensitivity: 'base' });
                        case 'date_new':
                            return (b.createdAt || 0) - (a.createdAt || 0);
                        case 'date_old':
                            return (a.createdAt || 0) - (b.createdAt || 0);
                        default:
                            return 0; 
                    }
                };
                
                if (currentSortPreference !== 'default') {
                    pinned.sort(sortFunction);
                    unpinned.sort(sortFunction);
                }
                const itemsToRender = [...pinned, ...unpinned];


                if (itemsToRender.length === 0) {
                    const message = document.createElement('p');
                    message.className = 'no-items-message';
                    if (isFiltering()) {
                        message.textContent = 'No hay elementos que coincidan con tu búsqueda.';
                    } else if (itemsToDisplay.length > 0 && filteredItems.length === 0) { 
                        message.textContent = 'No hay elementos que coincidan con tu búsqueda.';
                    }
                    else {
                        message.textContent = 'No hay elementos aquí. ¡Añade algunos enlaces, notas o grupos!';
                    }
                    linkOrganizerEl.appendChild(message);
                } else {
                    let enterIndex = 0;
                    itemsToRender.forEach(item => {
                        const element = createDOMElement(item, searchPaths.get(item.id) || null);
                        if (element) {
                            // Anima al cambiar de carpeta y cuando aparece un elemento nuevo
                            if (viewChanged || !renderedIds.has(item.id)) {
                                element.classList.add('item-enter');
                                element.style.setProperty('--i', Math.min(enterIndex++, 14));
                            }
                            linkOrganizerEl.appendChild(element);
                        }
                    });
                }
                renderedIds = new Set(itemsToRender.map(i => i.id));
                lastViewKey = viewKey;
                lastViewDepth = viewDepth;


                initializeSortable(linkOrganizerEl); 
                updateRootVarRgbEquivalents(); 
            };
            
            backToParentBtn.onclick = () => {
                if (currentViewStack.length > 0) {
                    currentViewStack.pop(); 
                    searchInputEl.value = ''; 
                    currentSearchTerm = '';
                    render();
                }
            };
            
            // =====================================================
            //  SELECTOR DE GRUPO EN ÁRBOL
            // =====================================================
            const groupPickerEl = document.getElementById('groupPicker');
            const gp = { selected: '', current: '', excluded: [], expanded: new Set(), query: '', select: null, summaryEl: null, listEl: null, searchEl: null };

            function gpPathNames(id) {
                if (!id) return ['Inicio'];
                const det = findParentDetails(id, data);
                const ids = det ? [...det.path, id] : [id];
                return ['Inicio', ...ids.map(i => { const r = findItemRecursive(i); return r ? r.item.name : '?'; })];
            }

            function gpSelect(id) {
                gp.selected = id || '';
                if (gp.select) gp.select.value = gp.selected;
                gpRender();
            }

            function gpHighlight(name, q) {
                if (!q) return escapeHTML(name);
                const n = normalizeText(name), i = n.indexOf(q);
                if (i === -1 || n.length !== name.length) return escapeHTML(name);
                return escapeHTML(name.slice(0, i)) + '<mark>' + escapeHTML(name.slice(i, i + q.length)) + '</mark>' + escapeHTML(name.slice(i + q.length));
            }

            function gpRowHTML(opts) {
                const { id, name, depth, isRoot, hasKids, expanded, color, count, disabled } = opts;
                const row = document.createElement('div');
                row.className = 'gp-row depth-' + depth + (isRoot ? ' root' : '') + (hasKids && expanded ? ' expanded' : '')
                    + (gp.selected === id ? ' selected' : '') + (disabled ? ' disabled' : '');
                row.dataset.id = id;
                row.setAttribute('role', 'treeitem');
                row.setAttribute('aria-selected', gp.selected === id ? 'true' : 'false');
                if (disabled) row.setAttribute('aria-disabled', 'true');
                row.tabIndex = disabled ? -1 : 0;
                if (disabled) row.title = 'No puedes mover un grupo dentro de sí mismo';

                for (let d = 0; d < depth; d++) { const g = document.createElement('span'); g.className = 'gp-guide'; row.appendChild(g); }

                if (hasKids) {
                    const tg = document.createElement('button');
                    tg.type = 'button'; tg.tabIndex = -1; tg.className = 'gp-toggle';
                    tg.title = expanded ? 'Plegar' : 'Desplegar';
                    tg.innerHTML = '<i class="fas fa-chevron-right"></i>';
                    tg.onclick = (e) => { e.stopPropagation(); if (gp.expanded.has(id)) gp.expanded.delete(id); else gp.expanded.add(id); gpRender(); };
                    row.appendChild(tg);
                } else {
                    const sp = document.createElement('span'); sp.className = 'gp-toggle-spacer'; row.appendChild(sp);
                }

                const ic = document.createElement('i');
                ic.className = 'gp-icon fas ' + (isRoot ? 'fa-home' : (gp.selected === id || (hasKids && expanded) ? 'fa-folder-open' : 'fa-folder'));
                if (color) ic.style.color = color;
                row.appendChild(ic);

                const nm = document.createElement('span');
                nm.className = 'gp-name';
                nm.innerHTML = isRoot ? 'Inicio (raíz)' : gpHighlight(name, gp.query);
                row.appendChild(nm);

                if (!isRoot && typeof count === 'number' && count > 0) {
                    const b = document.createElement('span'); b.className = 'gp-badge'; b.textContent = count; b.title = count + ' elemento' + (count === 1 ? '' : 's') + ' dentro';
                    row.appendChild(b);
                }
                if (gp.current === id && !disabled) {
                    const t = document.createElement('span'); t.className = 'gp-tag'; t.textContent = 'actual'; row.appendChild(t);
                }
                if (gp.selected === id) {
                    const ck = document.createElement('i'); ck.className = 'fas fa-check gp-check'; row.appendChild(ck);
                }

                if (!disabled) {
                    row.onclick = () => gpSelect(id);
                    if (hasKids) row.ondblclick = () => { if (gp.expanded.has(id)) gp.expanded.delete(id); else gp.expanded.add(id); gpRender(); };
                }
                return row;
            }

            function gpRender() {
                if (!gp.listEl) return;
                const q = normalizeText(gp.query.trim());

                // Resumen del destino
                const changed = gp.selected !== gp.current;
                gp.summaryEl.className = 'gp-summary' + (changed ? ' changed' : '');
                gp.summaryEl.innerHTML = (changed ? '<i class="fas fa-arrow-right"></i><span>Se moverá a:</span>' : '<i class="fas fa-map-marker-alt"></i><span>Ubicación actual:</span>')
                    + '<span class="gp-path">' + gpPathNames(gp.selected).map(escapeHTML).join(' / ') + '</span>';

                // ¿qué ramas se muestran con el filtro?
                const subtreeMatches = (item) => item.type === 'group' && !gp.excluded.includes(item.id) &&
                    (normalizeText(item.name).includes(q) || (item.items || []).some(subtreeMatches));

                const frag = document.createDocumentFragment();
                let shown = 0;
                if (!q) frag.appendChild(gpRowHTML({ id: '', name: 'Inicio', depth: 0, isRoot: true, hasKids: false }));

                (function walk(items, depth) {
                    items.forEach(item => {
                        if (item.type !== 'group') return;
                        const disabled = gp.excluded.includes(item.id);
                        if (q && !disabled && !subtreeMatches(item)) return;
                        if (q && disabled) return;
                        const kids = disabled ? [] : (item.items || []).filter(i => i.type === 'group');
                        const expanded = q ? true : gp.expanded.has(item.id);
                        frag.appendChild(gpRowHTML({
                            id: item.id, name: item.name, depth, hasKids: kids.length > 0, expanded,
                            color: item.color, count: (item.items || []).length, disabled
                        }));
                        shown++;
                        if (kids.length > 0 && expanded) walk(kids, depth + 1);
                    });
                })(data, 0);

                gp.listEl.innerHTML = '';
                if (q && shown === 0) {
                    const e = document.createElement('div'); e.className = 'gp-empty'; e.textContent = 'Ningún grupo coincide con la búsqueda.';
                    gp.listEl.appendChild(e);
                } else if (!q && shown === 0) {
                    gp.listEl.appendChild(frag);
                    const e = document.createElement('div'); e.className = 'gp-empty'; e.textContent = 'Todavía no hay grupos. Crea uno desde el botón de carpeta.';
                    gp.listEl.appendChild(e);
                } else {
                    gp.listEl.appendChild(frag);
                }
            }

            function initGroupPicker(selectElement, currentParentId, excludedIds = []) {
                gp.select = selectElement;
                gp.current = currentParentId || '';
                gp.selected = gp.current;
                gp.excluded = excludedIds;
                gp.query = '';
                gp.expanded = new Set();
                if (gp.current) {
                    const det = findParentDetails(gp.current, data);
                    if (det) det.path.forEach(id => gp.expanded.add(id));
                }

                groupPickerEl.innerHTML = '';
                gp.summaryEl = document.createElement('div');
                groupPickerEl.appendChild(gp.summaryEl);

                let groupCount = 0;
                (function count(items) { items.forEach(i => { if (i.type === 'group') { groupCount++; if (i.items) count(i.items); } }); })(data);
                gp.searchEl = null;
                if (groupCount > 6) {
                    const wrap = document.createElement('div');
                    wrap.className = 'gp-search-wrap';
                    wrap.innerHTML = '<i class="fas fa-search"></i><input type="search" class="gp-search" placeholder="Buscar grupo..." autocomplete="off">';
                    gp.searchEl = wrap.querySelector('input');
                    gp.searchEl.addEventListener('input', () => { gp.query = gp.searchEl.value; gpRender(); });
                    groupPickerEl.appendChild(wrap);
                }

                gp.listEl = document.createElement('div');
                gp.listEl.className = 'gp-list';
                gp.listEl.setAttribute('role', 'tree');
                gp.listEl.addEventListener('keydown', (e) => {
                    const row = e.target.closest('.gp-row');
                    if (!row) return;
                    const rows = Array.from(gp.listEl.querySelectorAll('.gp-row:not(.disabled)'));
                    const i = rows.indexOf(row);
                    if (e.key === 'ArrowDown') { e.preventDefault(); if (rows[i + 1]) rows[i + 1].focus(); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); if (rows[i - 1]) rows[i - 1].focus(); }
                    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gpSelect(row.dataset.id); const again = gp.listEl.querySelector('.gp-row[data-id="' + row.dataset.id + '"]'); if (again) again.focus(); }
                    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && row.dataset.id) {
                        const open = e.key === 'ArrowRight';
                        if (open) gp.expanded.add(row.dataset.id); else gp.expanded.delete(row.dataset.id);
                        gpRender();
                        const again = gp.listEl.querySelector('.gp-row[data-id="' + row.dataset.id + '"]'); if (again) again.focus();
                    }
                });
                groupPickerEl.appendChild(gp.listEl);

                gpRender();
                // llevar la ubicación actual a la vista
                requestAnimationFrame(() => {
                    const sel = gp.listEl && gp.listEl.querySelector('.gp-row.selected');
                    if (sel) gp.listEl.scrollTop = Math.max(0, sel.offsetTop - 60);
                });
            }

            function populateGroupSelector(selectElement, currentParentIdOfItem, excludedIds = []) {
                selectElement.innerHTML = ''; 
                const rootOption = document.createElement('option');
                rootOption.value = ''; 
                rootOption.textContent = 'Inicio (Raíz)'; 
                if (currentParentIdOfItem === null || currentParentIdOfItem === '') {
                    rootOption.selected = true;
                }
                selectElement.appendChild(rootOption);
                const indentUnit = '\u00A0\u00A0\u00A0'; 
                function addGroupOptionsRecursive(groupsToScan, indentLevel) {
                    groupsToScan.forEach(item => {
                        if (item.type === 'group') {
                            const option = document.createElement('option');
                            option.value = item.id;
                            option.textContent = indentUnit.repeat(indentLevel) + item.name; 
                            if (indentLevel === 0) { option.style.fontWeight = 'bold'; } 
                            else { option.style.fontWeight = 'normal'; }
                            if (item.id === currentParentIdOfItem) { option.selected = true; }
                            if (excludedIds.includes(item.id)) { option.disabled = true; }
                            selectElement.appendChild(option);
                            if (item.items && item.items.length > 0 && !excludedIds.includes(item.id)) {
                                addGroupOptionsRecursive(item.items, indentLevel + 1);
                            }
                        }
                    });
                }
                addGroupOptionsRecursive(data, 0); 
                initGroupPicker(selectElement, currentParentIdOfItem, excludedIds);
            }

            function openModal(type, id = null, explicitParentId = null, forceModal = false) {
                if (type === 'note' && !forceModal) { openNotePanel(id, explicitParentId); return; }
                mainMenuDropdown.classList.remove('show'); 
                modalItemType.value = type;
                modalItemId.value = id || '';
                
                const actualParentId = explicitParentId !== null ? explicitParentId : getCurrentParentId();
                modalParentIdInput.value = actualParentId || '';

                modalUrlContainer.style.display = 'none';
                modalDescriptionContainer.style.display = 'none';
                modalMoveToGroupContainer.style.display = 'none'; 
                
                // Reset labels
                modalNameLabel.textContent = "Nombre:";
                modalDescriptionLabel.textContent = "Descripción:";

                if (id) { // Editing an existing item
                    const result = findItemRecursive(id);
                    if (!result) return;
                    
                    modalItemName.value = result.item.name;

                    if (type === 'link') {
                        modalTitle.textContent = "Editar Enlace";
                        modalItemUrl.value = result.item.url;
                        modalItemDescription.value = result.item.description || '';
                        modalUrlContainer.style.display = 'block';
                        modalDescriptionContainer.style.display = 'block';
                        
                        modalMoveToGroupContainer.style.display = 'block';
                        const linkDetails = findParentDetails(id, data); 
                        const currentParentOfLink = linkDetails ? linkDetails.parentId : null;
                        populateGroupSelector(modalItemGroupSelector, currentParentOfLink); 

                    } else if (type === 'note') {
                        modalTitle.textContent = "Editar Nota";
                        modalItemDescription.value = result.item.description || '';
                        modalDescriptionContainer.style.display = 'block';
                        modalDescriptionLabel.textContent = "Contenido de la nota:"; 
                        
                        modalMoveToGroupContainer.style.display = 'block';
                        const noteDetails = findParentDetails(id, data);
                        const currentParentOfNote = noteDetails ? noteDetails.parentId : null;
                        populateGroupSelector(modalItemGroupSelector, currentParentOfNote);

                    } else if (type === 'group') {
                        modalTitle.textContent = "Editar Grupo";
                        modalMoveToGroupContainer.style.display = 'block';

                        const groupDetails = findParentDetails(id, data);

            saveModalItemBtn.onclick = () => {
                const type = modalItemType.value;

                const description = modalItemDescription.value.trim();

                    const firstLine = description.split('\n').map(l => l.replace(/^\s*(- \[[ xX]\] ?|[-*] |#{1,3} |\d+\. )/, '').trim()).find(Boolean);
                    if (firstLine) name = firstLine.length > 40 ? firstLine.slice(0, 40).trimEnd() + '…' : firstLine;
                }

                const parentForNewItem = modalParentIdInput.value;

                     alert('La URL es obligatoria para un enlace.'); return;
                }

                    let newParentIdForItem = undefined;
                    if (modalMoveToGroupContainer.style.display === 'block') { 
                        newParentIdForItem = modalItemGroupSelector.value;

                }
                else { 
                    // Add item
                    addItem(type, name, url, parentForNewItem || null, null, undefined, null, ((type === 'link' || type === 'note') ? description : null), color);

                closeModal();
            };
            
            [modalItemName, modalItemUrl, modalItemDescription].forEach(inputElement => {
                if (inputElement) { 
                    inputElement.addEventListener('keydown', function(event) {

                    });

            });

            mainMenuToggleBtn.onclick = (e) => {
                e.stopPropagation();
                mainMenuDropdown.classList.toggle('show');

            };
            document.addEventListener('click', (e) => {
                if (!mainMenuToggleBtn.contains(e.target) && !mainMenuDropdown.contains(e.target) &&
                    customContextMenuEl && !customContextMenuEl.contains(e.target)) { 
                    mainMenuDropdown.classList.remove('show');
                    hideContextMenu();
                } else if (customContextMenuEl && !customContextMenuEl.contains(e.target) && customContextMenuEl.style.display === 'block') { 
                     hideContextMenu();

            let currentToggleThemeFn = () => { 
                document.documentElement.classList.toggle('light-mode');
                const isLight = document.documentElement.classList.contains('light-mode');

            const resetColorsBtn = document.getElementById('resetColorsBtn');

            const customizableColorVariables = [
                { varName: '--bg-primary', label: 'Fondo Principal', defaultDark: '#1e202b', defaultLight: '#f4f7f6' },
                { varName: '--bg-secondary', label: 'Fondo de Elementos', defaultDark: '#2b2e3d', defaultLight: '#ffffff' },
                { varName: '--bg-header', label: 'Fondo de Cabecera', defaultDark: '#161820', defaultLight: '#e9edf1' },
                { varName: '--text-primary', label: 'Texto Principal', defaultDark: '#e0e0e0', defaultLight: '#212529' },
                { varName: '--text-secondary', label: 'Texto Secundario', defaultDark: '#b0b0b0', defaultLight: '#495057' },
                { varName: '--accent-primary', label: 'Acento Primario', defaultDark: '#4a90e2', defaultLight: '#007bff' },

                { varName: '--danger', label: 'Peligro/Eliminar', defaultDark: '#e94b3c', defaultLight: '#dc3545' },
                { varName: '--border-color', label: 'Color de Borde', defaultDark: '#3a3f51', defaultLight: '#dee2e6' },
                { varName: '--pin-color', label: 'Color de Acento de Fijado', defaultDark: '#50e3c2', defaultLight: '#28a745' }, 
            ];

            function getThemeDefaultColor(varName) {
                const isLight = document.documentElement.classList.contains('light-mode');
                const colorDef = customizableColorVariables.find(c => c.varName === varName);
                if (!colorDef) return '#000000'; 
                return isLight ? colorDef.defaultLight : colorDef.defaultDark;
            }

            function applyCustomColorsToDOM(colors) {
                if (!colors) return;
                customizableColorVariables.forEach(config => {
                    if (colors[config.varName]) {
                        document.documentElement.style.setProperty(config.varName, colors[config.varName]);
                    } else {
                        document.documentElement.style.removeProperty(config.varName);
                    }
                });
                updateRootVarRgbEquivalents(); 
            }

            function loadAndApplyCustomColors() {
                const storedColors = localStorage.getItem(CUSTOM_COLORS_STORAGE_KEY);
                const parsedColors = storedColors ? JSON.parse(storedColors) : null;
                
                customizableColorVariables.forEach(config => {
                    document.documentElement.style.removeProperty(config.varName);
                });
                
                if (parsedColors) {
                    applyCustomColorsToDOM(parsedColors);
                }
                updateRootVarRgbEquivalents(); 
                return parsedColors;
            }

            function openColorCustomizationModal() {
                mainMenuDropdown.classList.remove('show'); 
                colorInputsContainer.innerHTML = ''; 
                const currentCustomColors = JSON.parse(localStorage.getItem(CUSTOM_COLORS_STORAGE_KEY)) || {};
                
                customizableColorVariables.forEach(config => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'color-input-wrapper';
                    const label = document.createElement('label');
                    label.textContent = config.label;
                    label.htmlFor = `color-picker-${config.varName}`;
                    const input = document.createElement('input');
                    input.type = 'color';
                    input.id = `color-picker-${config.varName}`;
                    input.dataset.varName = config.varName;
                    input.value = currentCustomColors[config.varName] || getThemeDefaultColor(config.varName);
                    
                    input.addEventListener('input', (event) => { 
                        document.documentElement.style.setProperty(config.varName, event.target.value);
                        if (config.varName === '--bg-secondary') { 
                            updateRootVarRgbEquivalents();
                        }
                    });
                    wrapper.appendChild(label);
                    wrapper.appendChild(input);
                    colorInputsContainer.appendChild(wrapper);
                });
                colorCustomizationModal.style.display = 'block';
            }

            function closeColorCustomizationModal() {
                colorCustomizationModal.style.display = 'none';
                loadAndApplyCustomColors(); 
            }

            saveColorsBtn.onclick = () => {
                const newColors = {};
                colorInputsContainer.querySelectorAll('input[type="color"]').forEach(input => {
                    newColors[input.dataset.varName] = input.value;
                });
                localStorage.setItem(CUSTOM_COLORS_STORAGE_KEY, JSON.stringify(newColors));
                applyCustomColorsToDOM(newColors); 
                colorCustomizationModal.style.display = 'none';
            };

            resetColorsBtn.onclick = () => {
                if (!confirm("¿Estás seguro de que quieres restablecer todos los colores a los predeterminados del tema? Esto eliminará tu configuración de colores personalizados.")) return;
                localStorage.removeItem(CUSTOM_COLORS_STORAGE_KEY);
                customizableColorVariables.forEach(config => {
                    document.documentElement.style.removeProperty(config.varName); 
                });
                updateRootVarRgbEquivalents(); 
                openColorCustomizationModal(); 
            };

            const originalToggleTheme = currentToggleThemeFn;
            currentToggleThemeFn = () => {
                originalToggleTheme(); 
                loadAndApplyCustomColors(); 
                if (colorCustomizationModal.style.display === 'block') { 
                    openColorCustomizationModal(); 
                }
                mainMenuDropdown.classList.remove('show');
            };

            const originalApplyInitialTheme = currentApplyInitialThemeFn;
            currentApplyInitialThemeFn = () => {
                originalApplyInitialTheme(); 
                loadAndApplyCustomColors(); 
            };

                event.preventDefault();
                hideContextMenu(); 
                contextMenuMouseX = event.clientX;
                contextMenuMouseY = event.clientY;
                const menuUl = customContextMenuEl.querySelector('ul');
                menuUl.innerHTML = ''; 
                let menuItems = [];
                const itemResult = (['link', 'group', 'note'].includes(targetType)) ? findItemRecursive(targetId) : null;
                const itemData = itemResult ? itemResult.item : null;


                if (targetType === 'link' && itemData) {
                    menuItems = [
                        { label: itemData.isPinned ? 'Desfijar Enlace' : 'Fijar Enlace', icon: 'fas fa-thumbtack', action: 'toggle-pin', itemId: targetId },
                        { type: 'separator' },
                        { label: 'Editar Enlace', icon: 'fas fa-pencil-alt', action: 'edit-link', itemId: targetId },
                        { label: 'Copiar URL del Enlace', icon: 'fas fa-copy', action: 'copy-link-url', itemId: targetId, url: itemData.url },
                        { type: 'separator' },
                        { label: 'Copiar Elemento', icon: 'fas fa-clone', action: 'copy-item', itemType: 'link', itemId: targetId },
                        { label: 'Eliminar Enlace', icon: 'fas fa-trash-alt', action: 'delete-link', itemId: targetId }
                    ];
                } else if (targetType === 'note' && itemData) {
                    menuItems = [
                        { label: itemData.isPinned ? 'Desfijar Nota' : 'Fijar Nota', icon: 'fas fa-thumbtack', action: 'toggle-pin', itemId: targetId },
                        { type: 'separator' },
                        { label: 'Ver/Editar Nota', icon: 'fas fa-pencil-alt', action: 'edit-note', itemId: targetId },
                        { label: 'Copiar Texto', icon: 'fas fa-copy', action: 'copy-note-text', itemId: targetId, description: itemData.description },
                        { type: 'separator' },
                        { label: 'Copiar Elemento', icon: 'fas fa-clone', action: 'copy-item', itemType: 'note', itemId: targetId },
                        { label: 'Eliminar Nota', icon: 'fas fa-trash-alt', action: 'delete-note', itemId: targetId }
                    ];
                } else if (targetType === 'group' && itemData) {
                     menuItems = [
                        { label: itemData.isPinned ? 'Desfijar Grupo' : 'Fijar Grupo', icon: 'fas fa-thumbtack', action: 'toggle-pin', itemId: targetId },
                        { type: 'separator' },
                        { label: 'Editar Grupo', icon: 'fas fa-pencil-alt', action: 'edit-group', itemId: targetId },
                        { label: 'Abrir Todos los Enlaces', icon: 'fas fa-external-link-square-alt', action: 'open-all-links', itemId: targetId, disabled: !(itemData.items && itemData.items.some(i => i.type === 'link')) },
                        { type: 'separator' },
                        { label: 'Copiar Grupo', icon: 'fas fa-clone', action: 'copy-item', itemType: 'group', itemId: targetId },
                        { label: 'Eliminar Grupo', icon: 'fas fa-trash-alt', action: 'delete-group', itemId: targetId }
                    ];
                } else if (targetType === 'link-organizer-area') {
                    const currentParentActive = getCurrentParentId(); 
                    if (currentParentActive) { 
                        menuItems.push({ label: 'Subir un Nivel', icon: 'fas fa-level-up-alt', action: 'go-up-level', disabled: false });
                    } else { 
                         menuItems.push({ label: 'Subir un Nivel', icon: 'fas fa-level-up-alt', action: 'go-up-level', disabled: true });
                    }

                    if (copiedItemData && ['link', 'group', 'note'].includes(copiedItemType)) {
                        if (menuItems.length > 0 && menuItems[menuItems.length -1].type !== 'separator') { 
                            menuItems.push({ type: 'separator' });
                        }
                        const pasteLabel = `Pegar ${copiedItemType === 'link' ? 'Enlace' : (copiedItemType === 'note' ? 'Nota' : 'Grupo')}`;
                        menuItems.push({ label: pasteLabel, icon: 'fas fa-paste', action: 'paste-item', disabled: false });
                    } else {
                         if (menuItems.length > 0 && menuItems[menuItems.length -1].type !== 'separator') { 
                            menuItems.push({ type: 'separator' });
                        }
                        menuItems.push({ label: `Pegar Elemento`, icon: 'fas fa-paste', action: 'paste-item', disabled: true });
                    }
                }
                
                if (targetType === 'group' && itemData) { 
                    if (copiedItemData && ['link', 'group', 'note'].includes(copiedItemType)) {
                        if (menuItems.length > 0 && menuItems[menuItems.length-1].type !== 'separator') {
                             menuItems.push({ type: 'separator' });
                        }
                        const pasteHereLabel = `Pegar ${copiedItemType === 'link' ? 'Enlace' : (copiedItemType === 'note' ? 'Nota' : 'Grupo')} Aquí`;
                        menuItems.push({ label: pasteHereLabel, icon: 'fas fa-paste', action: 'paste-item-into-group', disabled: false, targetGroupId: targetId });
                    } else {
                         if (menuItems.length > 0 && menuItems[menuItems.length-1].type !== 'separator') {
                             menuItems.push({ type: 'separator' });
                        }
                        menuItems.push({ label: `Pegar Elemento Aquí`, icon: 'fas fa-paste', action: 'paste-item-into-group', disabled: true, targetGroupId: targetId });
                    }
                }

                menuItems.forEach(item => {
                    const li = document.createElement('li');
                    if (item.type === 'separator') {
                        li.className = 'separator';
                    } else {
                        let content = '';
                        if (item.icon && typeof item.icon === 'string' && item.icon.trim() !== '') {
                            content += `<i class="${item.icon}"></i> `;
                        }
                        content += item.label;
                        li.innerHTML = content;
                        li.dataset.action = item.action;
                        if(item.itemId) li.dataset.itemId = item.itemId;
                        if(item.url) li.dataset.url = item.url;
                        if(item.description) li.dataset.description = item.description;
                        if(item.itemType) li.dataset.itemType = item.itemType; 
                        if(item.targetGroupId) li.dataset.targetGroupId = item.targetGroupId; 
                        if(item.disabled) li.classList.add('disabled');
                    }
                    menuUl.appendChild(li);
                });
                
                if (menuUl.children.length === 0) return; 
                const { clientX: mouseX, clientY: mouseY } = event;
                customContextMenuEl.style.top = `${mouseY}px`; customContextMenuEl.style.left = `${mouseX}px`;
                const menuWidth = customContextMenuEl.offsetWidth, menuHeight = customContextMenuEl.offsetHeight;
                const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
                const viewportHeight = window.innerHeight || document.documentElement.clientHeight;

                if (mouseX + menuWidth > viewportWidth) {
                    customContextMenuEl.style.left = `${Math.max(0, viewportWidth - menuWidth - 5)}px`;
                }
                if (mouseY + menuHeight > viewportHeight) {
                    customContextMenuEl.style.top = `${Math.max(0, viewportHeight - menuHeight - 5)}px`;
                }
                customContextMenuEl.style.display = 'block';
            }
            function hideContextMenu() { if (customContextMenuEl) customContextMenuEl.style.display = 'none'; }
            function assignNewIdsRecursive(itemsToProcess) { 
                return itemsToProcess.map(originalItem => {
                    const newItem = { ...originalItem, id: generateId(), createdAt: Date.now() }; 
                    if (originalItem.isPinned === undefined) newItem.isPinned = false; 
                    if (newItem.type === 'group' && newItem.items && newItem.items.length > 0) {
                        newItem.items = assignNewIdsRecursive(newItem.items);
                    }
                    return newItem;
                });
            }
            customContextMenuEl.addEventListener('click', (event) => {
                const targetLi = event.target.closest('li');
                if (!targetLi || !targetLi.dataset.action || targetLi.classList.contains('disabled')) return;
                const action = targetLi.dataset.action;
                const itemId = targetLi.dataset.itemId;
                hideContextMenu();

                if (action === 'toggle-pin') togglePinItem(itemId); 
                else if (action === 'edit-link') openModal('link', itemId);
                else if (action === 'edit-note') openModal('note', itemId);
                else if (action === 'copy-link-url') copyText(targetLi.dataset.url || '', 'URL copiada');
                else if (action === 'copy-note-text') copyText(targetLi.dataset.description || '', 'Texto copiado');
                else if (action === 'delete-link') if (confirm('¿Estás seguro de que quieres eliminar este enlace?')) deleteItem(itemId);
                else if (action === 'delete-note') if (confirm('¿Estás seguro de que quieres eliminar esta nota?')) deleteItem(itemId);
                else if (action === 'copy-item') {
                    const itemTypeToCopy = targetLi.dataset.itemType; 
                    if (['link', 'group', 'note'].includes(itemTypeToCopy)) {
                        const result = findItemRecursive(itemId);
                        if (result) { copiedItemData = JSON.parse(JSON.stringify(result.item)); copiedItemType = itemTypeToCopy; }
                    }
                } else if (action === 'paste-item' || action === 'paste-item-into-group') { 
                    if (!copiedItemData || !['link', 'group', 'note'].includes(copiedItemType)) return;
                    
                    const itemToPaste = JSON.parse(JSON.stringify(copiedItemData)); 
                    const [pastedItemWithNewIds] = assignNewIdsRecursive([itemToPaste]); 
                    
                    let actualPasteParentId;
                    if (action === 'paste-item-into-group') {
                        actualPasteParentId = targetLi.dataset.targetGroupId;
                    } else { 
                        actualPasteParentId = getCurrentParentId(); 
                    }
                    addItem(
                        pastedItemWithNewIds.type, pastedItemWithNewIds.name, pastedItemWithNewIds.url,
                        actualPasteParentId, pastedItemWithNewIds.id,
                        pastedItemWithNewIds.isCollapsed, pastedItemWithNewIds.items,
                        (pastedItemWithNewIds.type === 'link' || pastedItemWithNewIds.type === 'note') ? pastedItemWithNewIds.description : null,
                        pastedItemWithNewIds.color
                    );
                } else if (action === 'edit-group') openModal('group', itemId);
                else if (action === 'delete-group') if (confirm('¿Estás seguro de que quieres eliminar este grupo y todo su contenido?')) deleteItem(itemId);
                else if (action === 'go-up-level') { 
                    if (currentViewStack.length > 0) { 
                        backToParentBtn.click(); 
                    }
                } else if (action === 'open-all-links') openAllLinksInGroup(itemId);

                    const itemId = targetItemDiv.dataset.id;

                    showContextMenu(event, itemType, itemId, targetItemDiv);
                } else if (event.target === linkOrganizerEl || linkOrganizerEl.contains(event.target)) {
                     if (event.target === linkOrganizerEl || event.target.classList.contains('no-items-message')) {
                        showContextMenu(event, 'link-organizer-area', null, linkOrganizerEl);
                     }
                }
            });

            function exportAllData() {
                mainMenuDropdown.classList.remove('show'); hideContextMenu();
                const currentTheme = localStorage.getItem('linkCentralTheme') || 'dark';
                const customColors = JSON.parse(localStorage.getItem(CUSTOM_COLORS_STORAGE_KEY) || '{}');
                const sortPref = currentSortPreference; 
                const exportObject = {
                    version: "2.1.0-notes", 
                    linkData: data,
                    theme: currentTheme, 
                    customColors: customColors,
                    sortPreference: sortPref 
                };
                const dataStr = JSON.stringify(exportObject, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = 'copia_seguridad_linkcentral.json';
                let linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri); linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click(); linkElement.remove();
                alert('¡Datos exportados!');
            }
            function importAllData(event) {
                mainMenuDropdown.classList.remove('show'); hideContextMenu();
                const file = event.target.files[0]; if (!file) return;
                if (!confirm('Importar datos sobrescribirá TODOS los datos y configuraciones actuales de enlaces/grupos. ¿Estás seguro?')) {
                    event.target.value = null; return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!imported || typeof imported.linkData === 'undefined') { 
                            alert('Error: Formato de archivo no válido o faltan linkData.'); return;
                        }
                        data = imported.linkData || [];
                        ensureItemProperties(data); 
                        saveData();
                        
                        const themeToApply = imported.theme === 'light' ? 'light' : 'dark';
                        localStorage.setItem('linkCentralTheme', themeToApply);
                        if (imported.customColors && Object.keys(imported.customColors).length > 0) {
                            localStorage.setItem(CUSTOM_COLORS_STORAGE_KEY, JSON.stringify(imported.customColors));
                        } else { localStorage.removeItem(CUSTOM_COLORS_STORAGE_KEY); }
                        
                        if (imported.sortPreference) {
                            currentSortPreference = imported.sortPreference;
                            localStorage.setItem(SORT_PREF_KEY, currentSortPreference);
                            sortOptionsEl.value = currentSortPreference;
                        } else { 
                             currentSortPreference = 'default'; 
                             localStorage.setItem(SORT_PREF_KEY, currentSortPreference);
                             sortOptionsEl.value = currentSortPreference;
                        }

                        currentViewStack = []; 
                        searchInputEl.value = ''; currentSearchTerm = ''; 
                        currentApplyInitialThemeFn(); 
                        render(); 
                        alert('¡Datos importados correctamente!');
                    } catch (error) {
                        console.error("Error al importar datos:", error);
                        alert('Error al importar datos: ' + error.message);
                    } finally { event.target.value = null; } 
                };
                reader.onerror = function() { alert('Error al leer el archivo.'); event.target.value = null; };
                reader.readAsText(file);
            }
            
            document.getElementById('showAddLinkModalBtn').onclick = () => openModal('link', null, getCurrentParentId()); 
            document.getElementById('showAddNoteModalBtn').onclick = () => openModal('note', null, getCurrentParentId());
            document.getElementById('showAddGroupModalBtn').onclick = () => openModal('group', null, getCurrentParentId()); 
            if (exportDataBtn) exportDataBtn.onclick = exportAllData;
            if (importFileEl) importFileEl.onchange = importAllData;

                currentSearchTerm = e.target.value;

                if (!e.target.value) {

                }
            });

            sortOptionsEl.addEventListener('change', (e) => {
                currentSortPreference = e.target.value;
                localStorage.setItem(SORT_PREF_KEY, currentSortPreference);
                render();
            });
            
            [itemModal, colorCustomizationModal].forEach(modalInstance => {
                if (modalInstance) {
                    modalInstance.addEventListener('click', (event) => {
                        let dismissSelector = '[data-dismiss="modal"]';
                        if (event.target === modalInstance || (dismissSelector && event.target.closest(dismissSelector))) {
                            if (modalInstance === itemModal) closeModal();
                            else if (modalInstance === colorCustomizationModal) closeColorCustomizationModal();
                        }
                    });
                }
            });
            document.addEventListener('keydown', (event) => { 
                if (event.key === 'Escape') {
                    if (customContextMenuEl.style.display === 'block') hideContextMenu();
                    else if (mainMenuDropdown.classList.contains('show')) mainMenuDropdown.classList.remove('show');
                    else if (itemModal.style.display === 'block') closeModal();
                    else if (noteState) closeNotePanel();
                    else if (colorCustomizationModal && colorCustomizationModal.style.display === 'block') closeColorCustomizationModal();
                    else if (currentSearchTerm && document.activeElement !== searchInputEl) { 
                        searchInputEl.value = '';
                        currentSearchTerm = '';
                        render();
                        searchInputEl.blur(); 
                    }
                    else if (currentViewStack.length > 0 && !backToParentBtn.classList.contains('hidden') && sortableInstance && !sortableInstance.el.querySelector('.sortable-drag')) { 
                        backToParentBtn.click();
                    }
                }
            });

            // Efecto onda al pulsar una tarjeta
            linkOrganizerEl.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;
                const wrapper = e.target.closest('.item-content-wrapper');
                const card = wrapper && wrapper.closest('.item');
                if (!card) return;
                const rect = card.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 2;
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                card.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            });

            buildColorSwatches();
            currentApplyInitialThemeFn(); 
            loadData(); 
        });
    </script>
</body>
</html>
