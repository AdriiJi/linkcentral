<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkCentral</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SortableJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-primary: #1e202b; /* Fondo oscuro principal */
            --bg-secondary: #2b2e3d;
            --bg-header: #161820;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent-primary: #4a90e2;
            --accent-secondary: #50e3c2;
            --danger: #e94b3c;
            --border-color: #3a3f51;
            --shadow-color: rgba(0,0,0,0.2);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --sortable-ghost-bg: rgba(74, 144, 226, 0.2);
            --sortable-chosen-bg: #35394a;
            --item-min-width: 220px; 
            --item-padding: 15px; 
            --accent-primary-transparent: rgba(74, 144, 226, 0.3);
            --pin-color: var(--accent-secondary);
        }

        html.light-mode {
            --bg-primary: #f4f7f6; 
            --bg-secondary: #ffffff; 
            --bg-header: #e9edf1;
            --text-primary: #212529;
            --text-secondary: #495057;
            --accent-primary: #007bff;
            --accent-secondary: #28a745;
            --danger: #dc3545;
            --border-color: #dee2e6;
            --shadow-color: rgba(0,0,0,0.1);
            --sortable-ghost-bg: rgba(0, 123, 255, 0.15);
            --sortable-chosen-bg: #e9ecef;
            --accent-primary-transparent: rgba(0, 123, 255, 0.2);
            --pin-color: var(--accent-secondary);
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            max-width: 1200px; 
            margin: 0 auto;
            padding: 0 15px;
        }

        .app-header {
            background-color: var(--bg-header);
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 2px 5px var(--shadow-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .app-header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .app-header-left { 
            display: flex;
            align-items: center;
            flex-shrink: 0; 
        }

        #backToParentBtn { 
            background: none;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2em;
            padding: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, border-color 0.2s, background-color 0.2s, transform 0.2s;
            margin-right: 15px;
        }
        #backToParentBtn:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }
        #backToParentBtn.hidden { 
            display: none !important;
        }
        
        #backToParentBtn.drag-over-target {
            border-color: var(--accent-secondary) !important; 
            background-color: var(--sortable-ghost-bg) !important;
            transform: scale(1.1); 
            box-shadow: 0 0 8px var(--accent-secondary);
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.8em;
            color: var(--text-primary);
            font-weight: 600;
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
        }
        
        .app-header-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 15px;
            min-height: 38px;
        }

        .app-header-center {
            flex-grow: 1; 
            display: flex;
            align-items: center; 
            min-width: 0; 
            overflow: hidden; 
        }

        .header-search-sort-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        #searchInput {
            padding: 7px 12px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9em;
            width: 180px;
            transition: width 0.3s ease-in-out, border-color 0.2s, box-shadow 0.2s;
        }
        #searchInput:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-primary-transparent);
            width: 240px;
        }
        html.light-mode #searchInput {
            background-color: var(--bg-secondary);
        }

        #sortOptions {
            padding: 7px 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9em;
            cursor: pointer;
            height: 34px;
        }
        #sortOptions:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        html.light-mode #sortOptions {
            background-color: var(--bg-secondary);
        }

        .breadcrumbs-container {
            font-size: 0.8em; 
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            white-space: nowrap; 
            max-width: 100%; 
        }
        .breadcrumbs-container.hidden {
            display: none !important;
        }

        .breadcrumbs-container a,
        .breadcrumbs-container span.breadcrumb-item-text {
            color: var(--text-secondary);
            text-decoration: none;
            margin-right: 5px; 
            display: inline-block; 
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle; 
        }
         .breadcrumbs-container a > i.fas.fa-home { 
            font-size: 1.1em; 
            margin-right: 5px;
            vertical-align: middle;
        }

        .breadcrumbs-container a:hover,
        .breadcrumbs-container a:hover span.breadcrumb-item-text {
            color: var(--accent-primary);
            text-decoration: underline;
        }
         .breadcrumbs-container a:hover > i.fas.fa-home {
            color: var(--accent-primary);
        }

        .breadcrumbs-container .breadcrumb-separator {
            margin-right: 5px;
            user-select: none;
            vertical-align: middle;
        }

        .breadcrumbs-container .breadcrumb-current span.breadcrumb-item-text {
            font-weight: normal; 
            color: var(--text-primary); 
            max-width: 120px;
        }

        .header-menu-container {
            position: relative;
            display: flex;
            align-items: center;
            flex-shrink: 0; 
        }
        
        .header-action-button {
            background: none;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2em;
            padding: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, border-color 0.2s;
            margin-right: 10px;
        }
        .header-action-button:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }
        .header-menu-container > .header-action-button:last-of-type {
            margin-right: 0;
        }

        .main-menu-dropdown {
            opacity: 0; 
            visibility: hidden; 
            max-height: 0; 
            position: absolute;
            top: calc(100% + 5px); 
            right: 0;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            box-shadow: 0 4px 10px var(--shadow-color);
            z-index: 1005; 
            min-width: 200px;
            overflow: hidden; 
            transform: translateY(-10px); 
            transition: opacity 0.25s ease-out, 
                        max-height 0.25s ease-out, 
                        visibility 0s linear 0.25s,
                        transform 0.25s ease-out; 
        }
        .main-menu-dropdown.show {
            opacity: 1;
            visibility: visible;
            max-height: 500px; 
            transform: translateY(0);
            transition: opacity 0.25s ease-in, 
                        max-height 0.25s ease-in, 
                        visibility 0s linear 0s,
                        transform 0.25s ease-in;
        }
        .main-menu-dropdown button, .main-menu-dropdown .import-label-button {
            display: flex; 
            align-items: center; 
            width: calc(100% - 20px); 
            padding: 10px;
            background: none;
            color: var(--text-primary);
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }
        .main-menu-dropdown button i, .main-menu-dropdown .import-label-button i {
            margin-right: 10px; 
            width: 16px; 
            text-align: center;
        }
        .main-menu-dropdown button:hover, .main-menu-dropdown .import-label-button:hover {
            background-color: var(--accent-primary);
            color: white;
        }
        html.light-mode .main-menu-dropdown button, html.light-mode .main-menu-dropdown .import-label-button {
            color: var(--text-primary);
        }
        html.light-mode .main-menu-dropdown button:hover, html.light-mode .main-menu-dropdown .import-label-button:hover {
            background-color: var(--accent-primary);
            color: white;
        }
        #importFile { display: none; }

        #link-organizer {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 28px;
            align-items: start;
            padding: 20px 0; 
            min-height: 200px;
        }
        #link-organizer.notes-open {
            grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--item-min-width)), 1fr));
            gap: 20px;
            min-width: 0;
        }
        .notes-rail {
            position: sticky;
            top: 120px;
            display: none;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            overscroll-behavior: contain;
            border-left: 1px solid var(--border-color);
            padding-left: 22px;
        }
        .notes-rail.is-open { display: flex; }
        .notes-rail-header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0 8px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: .78em;
            font-weight: 600;
            letter-spacing: .09em;
            text-transform: uppercase;
        }
        .notes-rail-header i { color: var(--accent-primary); }
        .notes-rail-count {
            margin-left: auto;
            min-width: 20px;
            padding: 0 7px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-secondary);
            font-size: .95em;
            line-height: 18px;
            text-align: center;
            letter-spacing: 0;
        }
        .notes-rail-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color .2s, color .2s;
        }
        .notes-rail-close:hover { background: var(--bg-secondary); color: var(--danger); }
        .notes-rail-actions {
            display: flex;
            gap: 8px;
        }
        .notes-rail-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: .85em;
            line-height: 1.2;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color .2s, color .2s, border-color .2s, transform .2s;
        }
        .notes-rail-action:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: var(--bg-primary);
            transform: translateY(-1px);
        }
        .notes-rail-action.primary {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
        }
        .notes-rail-action.primary:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
            color: #fff;
        }
        .notes-rail-empty {
            margin: 0;
            padding: 18px 6px;
            text-align: center;
            font-size: .9em;
            font-style: italic;
            color: var(--text-secondary);
        }
        #showAddNoteModalBtn.is-active {
            background: var(--accent-primary-transparent);
            color: var(--accent-primary);
        }
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .notes-list .item { min-height: 120px; }
        @media (max-width: 900px) {
            #link-organizer.notes-open { grid-template-columns: minmax(0, 1fr); }
            .notes-rail {
                position: static;
                top: auto;
                max-height: none;
                overflow: visible;
                border-left: 0;
                border-top: 1px solid var(--border-color);
                padding-left: 0;
                padding-top: 18px;
            }
            .notes-rail-header { position: static; background: transparent; }
            .notes-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--item-min-width)), 1fr));
                gap: 20px;
            }
        }
        .no-items-message {
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            padding: 40px 20px;
            grid-column: 1 / -1; 
        }

        .item {
            background-color: var(--bg-secondary);
            border-radius: 8px; 
            box-shadow: 0 2px 5px var(--shadow-color);
            border: 1px solid var(--border-color);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            position: relative; 
            min-height: 150px; 
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out, border-color 0.2s ease-out, background-color 0.2s ease-out;
        }
        .item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px var(--shadow-color);
        }
        .item.pinned {
            border-left: 4px solid var(--pin-color);
        }
        .item.pinned .action-pin i {
           color: var(--pin-color) !important;
        }
        /* Style specific for notes to differentiate slightly if desired */
        .item.note-item {
            /* Optional: slight tint or style for notes */
        }
        
        .drag-handle {
            position: absolute;
            top: 8px;
            left: 8px;
            color: var(--text-secondary);
            cursor: grab;
            font-size: 1em; 
            padding: 5px;
            z-index: 1;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .item:hover .drag-handle {
            opacity: 1;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        .item-content-wrapper {
            padding: var(--item-padding);
            padding-top: 40px; 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            cursor: pointer; 
        }
        .link-item .item-content-wrapper {
            text-decoration: none; 
        }

        .item-icon {
            margin-right: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px; 
            height: 20px;
            font-size: 1.1em; 
        }
        .item-icon > .fas, .item-icon > .far {
             color: var(--accent-primary);
        }
        .note-item .item-icon > .fas {
            color: var(--text-secondary); /* Different color for notes icons maybe? */
        }

        .link-favicon {
            width: 18px; 
            height: 18px;
            display: block;
            object-fit: contain;
        }

        .item-path {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: -2px 0 8px 0;
            font-size: 0.8em;
            color: var(--text-secondary);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            cursor: pointer;
            width: fit-content;
            max-width: 100%;
        }
        .item-path:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }
        .item-path i { font-size: 0.9em; opacity: 0.8; flex-shrink: 0; }
        .item-path span { overflow: hidden; text-overflow: ellipsis; }

        .item-name-line { 
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-name {
            font-weight: 600; 
            font-size: 1.1em;
            color: var(--text-primary); 
            overflow: hidden; 
            text-overflow: ellipsis; 
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
        }

        .link-item .item-name { 
             color: var(--text-primary);
        }
        .link-item:hover .item-name {
            color: var(--accent-secondary);
        }
        .external-link-icon { 
            margin-left: 8px;
            font-size: 0.8em;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .link-item-description {
            font-size: 0.9em;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            margin-top: auto; 
            max-height: calc(1.4em * 3);          /* 3 líneas; "Ver más" lo despliega con animación */
            overflow: hidden;
            transition: max-height .4s var(--ease-out);
        }
        /* Notes description styling */
        .note-item-description {
            font-size: 0.9em;
            color: var(--text-primary); /* Darker text for notes for readability */
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            margin-top: 10px;
            /* Notes also clamped, clicking opens full view */
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 4; 
            -webkit-box-orient: vertical;
        }
        html.light-mode .link-item-description {
            color: var(--text-secondary);
        }

        .item-actions-container {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            flex-wrap: wrap; 
            justify-content: flex-end;
            gap: 3px;
            background-color: rgba(var(--bg-secondary-rgb, 43, 46, 61), 0.5); 
            backdrop-filter: blur(2px);
            padding: 3px;
            border-radius: 5px;
            z-index: 1;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .item:hover .item-actions-container {
            opacity: 1;
        }
        html.light-mode .item-actions-container {
             background-color: rgba(var(--bg-secondary-rgb, 255, 255, 255), 0.5);
        }

        .item-actions-container button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 5px 7px;
            cursor: pointer;
            font-size: 0.9em; 
            border-radius: 3px;
            line-height: 1; 
        }
        .item-actions-container button:hover {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        html.light-mode .item-actions-container button:hover {
            background-color: rgba(0,0,0,0.05);
        }
        .item-actions-container .action-delete:hover {
            color: var(--danger);
            background-color: rgba(233, 75, 60, 0.1);
        }
        .item-actions-container .action-add:hover,
        .item-actions-container .action-open-all:hover {
            color: var(--accent-secondary);
        }
         .item-actions-container .action-pin:hover {
            color: var(--pin-color);
        }


        .sortable-ghost {
            opacity: 0.7;
            background-color: var(--sortable-ghost-bg) !important;
            border: 2px dashed var(--accent-primary);
            transition: opacity 0.15s ease-out; 
        }

        .sortable-chosen, .sortable-drag {
            opacity: 0.9;
            background-color: var(--sortable-chosen-bg) !important;
            box-shadow: 0 6px 12px var(--shadow-color) !important;
            transform: scale(1.03);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1010; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6);
        }
        .modal-content {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            margin: 10% auto;
            padding: 25px;
            border: 1px solid var(--border-color);
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 5px 15px var(--shadow-color);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 1.5em;
        }
        .close-button {
            color: var(--text-secondary);
            float: right;
            font-size: 28px;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
        }
        .close-button:hover,
        .close-button:focus {
            color: var(--text-primary);
        }
        .modal-body label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .modal-body input[type="text"],
        .modal-body input[type="url"],
        .modal-body textarea,
        .modal-body select,
        .modal-body input[type="number"],
        .modal-body input[type="range"] { 
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
        }
        .modal-body textarea {
            min-height: 100px; /* Taller for notes */
            resize: vertical;
        }
        .modal-body input[type="range"] {
            padding: 0; 
            vertical-align: middle;
        }
        .slider-value-display {
            display: inline-block;
            min-width: 35px;
            text-align: right;
            margin-left: 10px;
            vertical-align: middle;
        }
         .modal-body input[type="color"] {
            padding: 0;
            height: 30px;
            width: 50px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-primary);
            vertical-align: middle;
            margin-bottom: 10px;
        }

        html.light-mode .modal-body input[type="text"],
        html.light-mode .modal-body input[type="url"],
        html.light-mode .modal-body textarea,
        html.light-mode .modal-body select,
        html.light-mode .modal-body input[type="number"],
        html.light-mode .modal-body input[type="range"], 
        html.light-mode .modal-body input[type="color"] {
             background-color: #fff;
        }

        .modal-footer {
            text-align: right;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }
        .modal-footer button {
            background-color: var(--accent-primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .modal-footer button.cancel-btn {
            background-color: var(--text-secondary);
        }
         .modal-footer button:hover {
            opacity: 0.85;
        }
        #colorInputsContainer .color-input-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        #colorInputsContainer .color-input-wrapper label {
            flex-basis: 180px;
            margin-right: 10px;
            font-weight: normal;
        }


        #customContextMenu { display: none; position: absolute; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 5px; box-shadow: 0 2px 10px var(--shadow-color); z-index: 1050; padding: 5px 0; min-width: 200px; }
        #customContextMenu ul { list-style: none; margin: 0; padding: 0; }
        #customContextMenu li { padding: 8px 15px; cursor: pointer; color: var(--text-primary); font-size: 0.9em; display: flex; align-items: center; }
        #customContextMenu li i { margin-right: 10px; width: 16px; text-align: center; }
        #customContextMenu li:hover { background-color: var(--accent-primary); color: white; }
        #customContextMenu li.separator { height: 1px; background-color: var(--border-color); margin: 5px 0; padding: 0; }
        #customContextMenu li.disabled { color: var(--text-secondary); cursor: default; pointer-events: none; }
        #customContextMenu li.disabled:hover { background-color: transparent; }

        /* =====================================================
           ANIMACIONES DINÁMICAS
           ===================================================== */
        :root {
            --ease-out: cubic-bezier(.22, 1, .36, 1);
            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes itemIn      { from { opacity: 0; transform: translateY(18px) scale(.94); } to { opacity: 1; transform: none; } }
        @keyframes itemInRight { from { opacity: 0; transform: translateX(32px) scale(.96); } to { opacity: 1; transform: none; } }
        @keyframes itemInLeft  { from { opacity: 0; transform: translateX(-32px) scale(.96); } to { opacity: 1; transform: none; } }
        @keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalPop    { from { opacity: 0; transform: translateY(34px) scale(.9); } to { opacity: 1; transform: none; } }
        @keyframes menuPop     { from { opacity: 0; transform: scale(.85) translateY(-6px); } to { opacity: 1; transform: none; } }
        @keyframes popIn       { from { opacity: 0; transform: scale(.3) rotate(-90deg); } to { opacity: 1; transform: none; } }
        @keyframes headerIn    { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
        @keyframes crumbIn     { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
        @keyframes menuItemIn  { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
        @keyframes rippleOut   { from { transform: scale(0); opacity: .9; } to { transform: scale(1); opacity: 0; } }
        @keyframes ghostPulse  { 50% { border-color: var(--accent-secondary); } }

        /* Cabecera */
        .app-header { animation: headerIn .6s var(--ease-out) backwards; }

        .header-action-button {
            transition: color .2s, border-color .2s, background-color .2s, box-shadow .25s,
                        transform .3s var(--ease-spring);
        }
        .header-action-button:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateY(-2px) scale(1.1);
            box-shadow: 0 4px 12px var(--accent-primary-transparent);
        }
        .header-action-button:active { transform: scale(.9); }
        .header-action-button i { transition: transform .35s var(--ease-spring); }
        .header-action-button:hover i { transform: rotate(-12deg) scale(1.12); }

        #backToParentBtn:not(.hidden) { animation: popIn .4s var(--ease-spring); }
        #backToParentBtn:hover { transform: translateX(-2px); }
        #backToParentBtn i { transition: transform .25s var(--ease-out); }
        #backToParentBtn:hover i { transform: translateX(-3px); }

        .breadcrumbs-container.crumbs-enter > * {
            animation: crumbIn .4s var(--ease-out) backwards;
            animation-delay: calc(var(--c, 0) * 45ms);
        }

        #searchInput { transition: width .4s var(--ease-out), border-color .2s, box-shadow .25s; }
        #sortOptions { transition: border-color .2s, box-shadow .25s, transform .2s var(--ease-spring); }
        #sortOptions:hover { transform: translateY(-1px); }
        #sortOptions:focus { box-shadow: 0 0 0 2px var(--accent-primary-transparent); }

        /* Menú desplegable */
        .main-menu-dropdown { transform: translateY(-10px) scale(.95); transform-origin: top right; }
        .main-menu-dropdown.show {
            transform: none;
            transition: opacity .25s var(--ease-out), max-height .3s var(--ease-out),
                        visibility 0s linear 0s, transform .4s var(--ease-spring);
        }
        .main-menu-dropdown.show > button,
        .main-menu-dropdown.show > label {
            animation: menuItemIn .35s var(--ease-out) backwards;
            animation-delay: calc(var(--n, 0) * 60ms + 80ms);
        }
        .main-menu-dropdown.show > :nth-child(2) { --n: 1; }
        .main-menu-dropdown.show > :nth-child(3) { --n: 2; }
        .main-menu-dropdown button i, .main-menu-dropdown .import-label-button i { transition: transform .3s var(--ease-spring); }
        .main-menu-dropdown button:hover i, .main-menu-dropdown .import-label-button:hover i { transform: scale(1.25) rotate(-8deg); }

        /* Tarjetas */
        .item {
            transition: transform .35s var(--ease-spring), box-shadow .3s var(--ease-out),
                        border-color .25s, background-color .25s;
        }
        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 26px var(--shadow-color), 0 0 0 1px var(--accent-primary-transparent);
        }
        .item:has(.item-content-wrapper:active) { transform: translateY(-1px) scale(.98); }

        .item::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .45s var(--ease-out);
            pointer-events: none;
            z-index: 2;
        }
        .item:hover::before { transform: scaleX(1); }

        .item-enter { animation: itemIn .55s var(--ease-out) calc(var(--i, 0) * 45ms) backwards; }
        #link-organizer[data-dir="in"]  .item-enter { animation-name: itemInRight; }
        #link-organizer[data-dir="out"] .item-enter { animation-name: itemInLeft; }

        .item-icon > * { transition: transform .4s var(--ease-spring); }
        .item:hover .item-icon > * { transform: scale(1.25) rotate(-8deg); }
        .group-item:hover .item-icon .fa-folder::before { content: "\f07c"; }

        .item-name { transition: transform .3s var(--ease-out), color .2s; }
        .item:hover .item-name { transform: translateX(3px); }

        .item-actions-container { transition: opacity .25s, transform .3s var(--ease-out); }
        .item-actions-container button {
            transition: background-color .2s, color .2s, transform .25s var(--ease-spring);
        }
        .item-actions-container button:hover { transform: translateY(-2px) scale(1.2); }
        .item-actions-container button:active { transform: scale(.85); }
        .action-pin i { transition: transform .35s var(--ease-spring), color .2s; }
        .item.pinned .action-pin i { transform: rotate(35deg); }

        .item-path { transition: color .2s, transform .2s var(--ease-out); }
        .item-path:hover { transform: translateX(2px); }

        .no-items-message { animation: itemIn .6s var(--ease-out) backwards; }

        /* Efecto onda al pulsar */
        .ripple {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, var(--accent-primary-transparent) 0%, transparent 70%);
            transform: scale(0);
            animation: rippleOut .7s var(--ease-out) forwards;
        }

        /* Arrastrar y soltar */
        .sortable-ghost { animation: ghostPulse 1.2s ease-in-out infinite; }
        .sortable-chosen, .sortable-drag { transition: transform .2s var(--ease-spring), box-shadow .2s; }

        /* Ventanas modales */
        .modal { animation: fadeIn .25s ease-out; backdrop-filter: blur(3px); }
        .modal-content { animation: modalPop .45s var(--ease-spring); }
        .close-button { transition: transform .3s var(--ease-spring), color .2s; }
        .close-button:hover, .close-button:focus { transform: rotate(90deg) scale(1.2); }
        .modal-footer button {
            transition: transform .25s var(--ease-spring), opacity .2s, box-shadow .25s;
        }
        .modal-footer button:hover { transform: translateY(-2px); box-shadow: 0 6px 14px var(--shadow-color); opacity: 1; }
        .modal-footer button:active { transform: scale(.95); }
        .modal-body input[type="text"], .modal-body input[type="url"], .modal-body textarea,
        .modal-body select, .modal-body input[type="number"] {
            transition: border-color .2s, box-shadow .25s, transform .25s var(--ease-out);
        }
        .modal-body input[type="text"]:focus, .modal-body input[type="url"]:focus,
        .modal-body textarea:focus, .modal-body select:focus, .modal-body input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-transparent);
        }

        /* Menú contextual (clic derecho) */
        #customContextMenu { animation: menuPop .2s var(--ease-out); transform-origin: top left; }
        #customContextMenu li { transition: background-color .15s, padding-left .25s var(--ease-out); }
        #customContextMenu li:not(.separator):not(.disabled):hover { padding-left: 21px; }

        /* Respeta a quien prefiere menos movimiento */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }

        /* =====================================================
           COLORES + NOTAS MEJORADAS
           ===================================================== */

        /* --- Tarjetas con color --- */
        .item.has-color {
            background-image: linear-gradient(145deg, var(--item-color-soft), transparent 65%);
            border-top-color: var(--item-color-border);
            border-right-color: var(--item-color-border);
            border-bottom-color: var(--item-color-border);
        }
        .item.has-color:not(.pinned) { border-left-color: var(--item-color-border); }
        .item.has-color::before { background: var(--item-color); transform: scaleX(1); transition: transform .45s var(--ease-out), height .2s; }
        .item.has-color:hover::before { height: 5px; }
        .item.has-color .item-icon > .fas,
        .item.has-color .item-icon > .far { color: var(--item-color); }
        .item.has-color:hover {
            box-shadow: 0 12px 26px var(--shadow-color), 0 0 0 1px var(--item-color-border), 0 8px 30px var(--item-color-soft);
        }

        /* --- Selector de color (modal) --- */
        .modal-content { border-top: 3px solid var(--modal-accent, var(--border-color)); transition: max-width .3s var(--ease-out); }
        .modal-content.note-mode { max-width: 720px; width: 90%; }
        .color-swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .color-swatches .swatch {
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            padding: 0; margin: 0;
            cursor: pointer;
            position: relative;
            display: inline-flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
            transition: transform .25s var(--ease-spring), box-shadow .2s;
        }
        .color-swatches .swatch:hover { transform: scale(1.2); }
        .color-swatches .swatch.selected {
            transform: scale(1.15);
            border-color: var(--bg-secondary);
            box-shadow: 0 0 0 2px var(--text-primary);
        }
        .color-swatches .swatch-none { background: var(--bg-primary); }
        .color-swatches .swatch-none::after {
            content: ''; position: absolute; width: 70%; height: 2px;
            background: var(--danger); transform: rotate(-45deg);
        }
        .color-swatches .swatch-custom {
            background: conic-gradient(#ef4444, #eab308, #22c55e, #3b82f6, #ec4899, #ef4444);
            color: #fff; font-size: .65em; overflow: hidden;
        }
        .modal-body .color-swatches input[type="color"] {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            margin: 0; padding: 0; border: 0;
        }

        /* --- Filtro por color (cabecera) --- */
        .header-search-sort-container { flex-wrap: wrap; justify-content: flex-end; }
        .color-filter-bar { display: flex; align-items: center; gap: 6px; }
        .color-filter-bar.hidden { display: none; }
        .color-dot {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 2px solid transparent;
            padding: 0; cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
            transition: transform .25s var(--ease-spring), box-shadow .2s, border-color .2s;
        }
        .color-dot:hover { transform: scale(1.3); }
        .color-dot.active {
            transform: scale(1.25);
            border-color: var(--bg-header);
            box-shadow: 0 0 0 2px var(--text-primary);
        }

        /* --- Editor de notas --- */
        .note-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .note-toolbar button {
            background: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: .85em;
            transition: color .2s, border-color .2s, transform .25s var(--ease-spring);
        }
        .note-toolbar button:hover { color: var(--accent-primary); border-color: var(--accent-primary); transform: translateY(-2px); }
        .note-toolbar button:active { transform: scale(.92); }
        /* Al abrir una nota, ningún botón de la barra (incluido "Tareas") debe quedar marcado */
        .note-toolbar button:focus:not(:focus-visible) { outline: none; }
        .note-toolbar button i { margin-right: 4px; }
        .note-toolbar button:not(:first-child):not(:nth-child(2)) i { margin-right: 0; }
        .note-mode #modalItemDescription { min-height: 240px; max-height: 50vh; line-height: 1.55; resize: vertical; }
        .note-stats { font-size: .78em; color: var(--text-secondary); margin: -8px 0 14px; text-align: right; }

        /* --- Vista previa de la nota en la tarjeta --- */
        .note-preview {
            margin-top: 10px;
            font-size: .92em;
            line-height: 1.45;
            color: var(--text-secondary);
            word-break: break-word;
            max-height: 11.5em;
            overflow: hidden;
        }
        .note-preview.is-long {
            -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent);
            mask-image: linear-gradient(to bottom, #000 72%, transparent);
        }
        .note-preview .note-gap { height: .5em; }
        .note-preview .note-h { font-weight: 700; color: var(--text-primary); }
        .note-preview .note-li { position: relative; padding-left: 1.1em; }
        .note-preview .note-li::before { content: '•'; position: absolute; left: .25em; color: var(--item-color, var(--accent-primary)); }
        .note-preview strong { color: var(--text-primary); }
        .note-preview code { background: rgba(127,127,127,.2); padding: 0 4px; border-radius: 3px; font-family: Consolas, monospace; font-size: .95em; }
        .note-preview a { color: var(--accent-primary); text-decoration: underline; }
        .note-preview a:hover { color: var(--accent-secondary); }

        .note-preview .note-check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; padding: 1px 0; }
        .note-preview .note-check input {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; margin: 2px 0 0; flex-shrink: 0;
            border: 2px solid var(--text-secondary);
            border-radius: 4px;
            cursor: pointer; position: relative;
            transition: background-color .2s, border-color .2s, transform .25s var(--ease-spring);
        }
        .note-preview .note-check input:hover { border-color: var(--item-color, var(--accent-primary)); transform: scale(1.2); }
        .note-preview .note-check input:checked {
            background: var(--item-color, var(--accent-secondary));
            border-color: var(--item-color, var(--accent-secondary));
        }
        .note-preview .note-check input:checked::after {
            content: ''; position: absolute; left: 3px; top: 0;
            width: 4px; height: 8px;
            border: solid #fff; border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .note-preview .note-check input:checked + span { text-decoration: line-through; opacity: .55; }

        .note-meta {
            margin-top: auto;
            padding-top: 10px;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-size: .75em;
            color: var(--text-secondary);
            opacity: .85;
        }
        .note-progress { display: flex; align-items: center; gap: 6px; }
        .note-progress-bar { width: 46px; height: 4px; border-radius: 3px; background: var(--border-color); overflow: hidden; }
        .note-progress-bar i { display: block; height: 100%; background: var(--item-color, var(--accent-secondary)); transition: width .4s var(--ease-out); }

        /* --- Aviso emergente --- */
        .toast {
            position: fixed; left: 50%; bottom: 28px;
            transform: translate(-50%, 20px);
            background: var(--bg-secondary); color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 18px; border-radius: 22px;
            box-shadow: 0 6px 18px var(--shadow-color);
            font-size: .9em; z-index: 2000;
            opacity: 0; pointer-events: none;
            transition: opacity .25s, transform .4s var(--ease-spring);
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* =====================================================
           SELECTOR DE GRUPO EN ÁRBOL
           ===================================================== */
        .group-picker {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            margin-bottom: 15px;
            overflow: hidden;
        }
        html.light-mode .group-picker { background: #fff; }

        .gp-summary {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px;
            font-size: .85em;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            transition: background-color .3s, color .3s;
        }
        .gp-summary i { flex-shrink: 0; }
        .gp-summary .gp-path { color: var(--text-primary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gp-summary.changed { background: var(--accent-primary-transparent); color: var(--text-primary); }
        .gp-summary.changed i { color: var(--accent-secondary); animation: gpNudge .5s var(--ease-spring); }
        @keyframes gpNudge { from { transform: translateX(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

        .gp-search-wrap { position: relative; padding: 8px 10px 0; }
        .gp-search-wrap i { position: absolute; left: 20px; top: 50%; margin-top: -2px; transform: translateY(-50%); color: var(--text-secondary); font-size: .8em; pointer-events: none; }
        .modal-body .gp-search-wrap input.gp-search {
            width: 100%; box-sizing: border-box;
            margin: 0; padding: 7px 10px 7px 30px;
            border-radius: 16px; font-size: .88em;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: border-color .2s, box-shadow .25s;
        }
        .modal-body .gp-search-wrap input.gp-search:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-transparent);
        }

        .gp-list { max-height: 250px; overflow-y: auto; padding: 6px; scrollbar-width: thin; position: relative; scroll-behavior: smooth; }
        .gp-empty { padding: 18px; text-align: center; color: var(--text-secondary); font-size: .88em; font-style: italic; }

        .gp-row {
            display: flex; align-items: center;
            min-height: 34px;
            padding-right: 8px;
            border-radius: 7px;
            border-left: 3px solid transparent;
            cursor: pointer;
            color: var(--text-primary);
            font-size: .92em;
            outline: none;
            transition: background-color .15s, border-color .15s, transform .2s var(--ease-out);
        }
        .gp-row:hover:not(.disabled) { background: rgba(127,127,127,.14); transform: translateX(2px); }
        .gp-row:focus-visible { box-shadow: 0 0 0 2px var(--accent-primary); }
        .gp-row.selected {
            background: var(--accent-primary-transparent);
            border-left-color: var(--accent-primary);
        }
        .gp-row.disabled { opacity: .4; cursor: not-allowed; }

        .gp-guide { width: 18px; align-self: stretch; flex-shrink: 0; position: relative; }
        .gp-guide::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; border-left: 1px dashed var(--border-color); }

        .gp-toggle {
            width: 22px; height: 22px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            background: none; border: none; padding: 0; margin: 0;
            color: var(--text-secondary); cursor: pointer; border-radius: 5px;
            font-size: .7em;
        }
        .gp-toggle:hover { background: rgba(127,127,127,.25); color: var(--text-primary); }
        .gp-toggle i { transition: transform .25s var(--ease-spring); }
        .gp-row.expanded > .gp-toggle i { transform: rotate(90deg); }
        .gp-toggle-spacer { width: 22px; flex-shrink: 0; }

        .gp-icon { width: 22px; text-align: center; margin-right: 6px; color: var(--accent-primary); flex-shrink: 0; transition: transform .3s var(--ease-spring); }
        .gp-row:hover:not(.disabled) .gp-icon { transform: scale(1.18) rotate(-6deg); }
        .gp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gp-row.root .gp-name, .gp-row.depth-0 .gp-name { font-weight: 600; }
        .gp-name mark { background: var(--accent-secondary); color: #000; border-radius: 3px; padding: 0 2px; }

        .gp-badge {
            flex-shrink: 0; margin-left: 8px;
            min-width: 18px; padding: 0 6px;
            border-radius: 9px;
            background: rgba(127,127,127,.2);
            color: var(--text-secondary);
            font-size: .75em; line-height: 18px; text-align: center;
        }
        .gp-tag {
            flex-shrink: 0; margin-left: 8px;
            padding: 0 7px; border-radius: 9px;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: .7em; line-height: 17px;
        }
        .gp-check { flex-shrink: 0; margin-left: 8px; color: var(--accent-secondary); animation: popIn .35s var(--ease-spring); }


        /* =====================================================
           PANEL LATERAL DE NOTAS (autoguardado)
           ===================================================== */
        :root { --note-panel-w: 420px; }
        body { transition: background-color .3s, color .3s, padding-right .35s var(--ease-out), padding-bottom .35s var(--ease-out); }
        body.note-panel-open { padding-right: var(--note-panel-w); }

        .note-panel {
            position: fixed; z-index: 1008;
            top: 0; right: 0; bottom: 0;
            width: var(--note-panel-w); max-width: 100vw;
            display: flex; flex-direction: column;
            background: var(--bg-secondary); color: var(--text-primary);
            border-left: 1px solid var(--border-color);
            border-top: 3px solid var(--panel-accent, var(--border-color));
            box-shadow: -8px 0 28px var(--shadow-color);
            transform: translateX(100%); visibility: hidden;
            transition: transform .35s var(--ease-out), visibility 0s linear .35s;
        }
        .note-panel.open { transform: none; visibility: visible; transition: transform .35s var(--ease-out), visibility 0s; }
        .note-panel-grip { display: none; width: 40px; height: 4px; border-radius: 2px; background: var(--border-color); margin: 8px auto 0; }

        .note-panel-header { display: flex; align-items: center; gap: 6px; padding: 12px 12px 8px 16px; border-bottom: 1px solid var(--border-color); }
        .note-panel-header input[type="text"] {
            flex: 1; min-width: 0;
            background: transparent; border: 0; border-bottom: 2px solid transparent;
            color: var(--text-primary); font-family: inherit; font-size: 1.1em; font-weight: 600;
            padding: 4px 0; outline: none; transition: border-color .2s;
        }
        .note-panel-header input[type="text"]:focus { border-bottom-color: var(--panel-accent, var(--accent-primary)); }
        .note-panel-header input[type="text"]::placeholder { font-weight: 400; color: var(--text-secondary); opacity: .8; }
        .note-panel-actions { display: flex; gap: 2px; flex-shrink: 0; }
        .note-panel-actions button {
            width: 32px; height: 32px; padding: 0;
            background: transparent; border: 0; border-radius: 6px;
            color: var(--text-secondary); cursor: pointer; font-size: .95em;
            transition: background-color .2s, color .2s, transform .25s var(--ease-spring);
        }
        .note-panel-actions button:hover { background: var(--bg-primary); color: var(--accent-primary); transform: translateY(-1px); }
        .note-panel-actions button.danger:hover { color: var(--danger); }

        .note-panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; }
        .note-panel-body .note-toolbar { margin: 0; }
        .note-panel-body textarea {
            flex: 1; min-height: 140px; width: 100%; box-sizing: border-box; resize: none;
            background: var(--bg-primary); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: 6px;
            padding: 12px; font-family: inherit; font-size: .95em; line-height: 1.55;
            outline: none; transition: border-color .2s, box-shadow .25s;
        }
        .note-panel-body textarea:focus { border-color: var(--panel-accent, var(--accent-primary)); box-shadow: 0 0 0 3px var(--accent-primary-transparent); }
        .note-panel .color-swatches { margin: 0; gap: 8px; }
        .note-panel .color-swatches .swatch { width: 22px; height: 22px; }
        .note-panel .color-swatches input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; margin: 0; padding: 0; border: 0; }

        .note-panel-footer {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            padding: 8px 16px; border-top: 1px solid var(--border-color);
            font-size: .78em; color: var(--text-secondary);
        }
        .note-save-status { white-space: nowrap; transition: color .3s; }
        .note-save-status.saved { color: var(--accent-secondary); }

        .item.note-active { box-shadow: 0 0 0 2px var(--item-color, var(--accent-primary)), 0 6px 18px var(--shadow-color); }

        @media (max-width: 760px) {
            .note-panel {
                top: auto; left: 0; right: 0; width: auto;
                height: 72vh; height: 72dvh;
                border-left: 0; border-radius: 16px 16px 0 0;
                box-shadow: 0 -8px 28px var(--shadow-color);
                transform: translateY(100%);
            }
            .note-panel-grip { display: block; }
            body.note-panel-open { padding-right: 0; padding-bottom: 72vh; padding-bottom: 72dvh; }
            .note-panel input[type="text"], .note-panel textarea { font-size: 16px; }
            .note-panel-footer .note-hint { display: none; }
        }
        /* =====================================================
           NOTAS: TACHADO, VISTA CON CASILLAS Y EDITOR MEJORADO
           ===================================================== */
        .note-toolbar { align-items: center; gap: 4px; }
        .note-toolbar button { min-width: 32px; height: 30px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; }
        .note-toolbar button i { margin-right: 0; }
        .note-toolbar button .tb-label { margin-left: 6px; }
        .tb-sep { width: 1px; height: 18px; background: var(--border-color); margin: 0 3px; flex-shrink: 0; }

        /* Selector Editar / Vista */
        .note-mode-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .note-mode-switch {
            display: inline-flex; padding: 2px; border-radius: 18px;
            background: var(--bg-primary); border: 1px solid var(--border-color);
        }
        .note-mode-switch button {
            border: 0; background: transparent; color: var(--text-secondary);
            padding: 4px 13px; border-radius: 16px; cursor: pointer;
            font-family: inherit; font-size: .82em;
            transition: background-color .25s, color .25s, transform .2s var(--ease-spring);
        }
        .note-mode-switch button i { margin-right: 6px; }
        .note-mode-switch button:hover { color: var(--text-primary); }
        .note-mode-switch button:active { transform: scale(.94); }
        .note-mode-switch button.active { background: var(--accent-primary); color: #fff; }

        /* Progreso de tareas */
        .note-task-info { display: flex; align-items: center; gap: 8px; font-size: .8em; color: var(--text-secondary); }
        .note-task-info[hidden] { display: none; }
        .note-task-bar { width: 64px; height: 5px; border-radius: 3px; background: var(--border-color); overflow: hidden; }
        .note-task-bar i { display: block; height: 100%; width: 0; background: var(--panel-accent, var(--accent-secondary)); transition: width .4s var(--ease-out); }
        .note-task-info button {
            width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px;
            background: transparent; color: var(--text-secondary); cursor: pointer;
            transition: background-color .2s, color .2s, transform .25s var(--ease-spring);
        }
        .note-task-info button[hidden] { display: none; }
        .note-task-info button:hover { background: var(--bg-primary); color: var(--danger); transform: scale(1.12); }

        /* Qué se ve en cada modo */
        .note-panel.mode-view #notePanelText,
        .note-panel.mode-view #notePanelToolbar { display: none; }
        .note-panel.mode-edit .note-view { display: none; }

        /* Vista de la nota (texto con formato y casillas clicables) */
        .note-view {
            flex: 1; min-height: 140px; overflow-y: auto;
            padding: 12px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color); border-radius: 6px;
            font-size: .95em; line-height: 1.6;
            word-break: break-word; cursor: text; scrollbar-width: thin;
            transition: border-color .2s;
        }
        .note-view:hover { border-color: var(--panel-accent, var(--accent-primary)); }
        .note-view-empty { margin: 0; padding: 26px 8px; text-align: center; font-style: italic; color: var(--text-secondary); }
        .note-view-empty i { margin-right: 6px; }

        .note-view .note-line { margin: 2px 0; padding-left: calc(var(--lvl, 0) * 1.5em); }
        .note-view .note-gap { height: .6em; }
        .note-view .note-h { font-weight: 700; font-size: 1.1em; margin-top: .5em; }
        .note-view .note-li { position: relative; padding-left: calc(1.1em + var(--lvl, 0) * 1.5em); }
        .note-view .note-li::before { content: '•'; position: absolute; left: calc(.25em + var(--lvl, 0) * 1.5em); color: var(--panel-accent, var(--accent-primary)); }
        .note-view strong { color: var(--text-primary); }
        .note-view code, .note-preview code { background: rgba(127,127,127,.2); padding: 0 4px; border-radius: 3px; font-family: Consolas, monospace; font-size: .95em; }
        .note-view a { color: var(--accent-primary); text-decoration: underline; cursor: pointer; }

        .note-view .note-check {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 2px 0 2px calc(var(--lvl, 0) * 1.5em);
        }
        .note-view .note-check input {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; margin: 2px 0 0; flex-shrink: 0;
            border: 2px solid var(--text-secondary); border-radius: 5px;
            cursor: pointer; position: relative;
            transition: background-color .2s, border-color .2s, transform .25s var(--ease-spring);
        }
        .note-view .note-check input:hover { border-color: var(--panel-accent, var(--accent-primary)); transform: scale(1.15); }
        .note-view .note-check input:checked { background: var(--panel-accent, var(--accent-secondary)); border-color: var(--panel-accent, var(--accent-secondary)); }
        .note-view .note-check input:checked::after {
            content: ''; position: absolute; left: 4px; top: 0;
            width: 5px; height: 9px;
            border: solid #fff; border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .note-view .note-check .nc-text {
            flex: 1; min-width: 0;
            text-decoration: line-through; text-decoration-color: transparent;
            transition: color .3s, opacity .3s, text-decoration-color .3s;
        }
        .note-view .note-check.is-done .nc-text { text-decoration-color: currentColor; opacity: .55; }

        /* Formato en línea (también en las tarjetas) */
        .note-view del, .note-preview del { text-decoration: line-through; opacity: .65; }
        .note-hl { background: rgba(250, 204, 21, .35); color: inherit; border-radius: 3px; padding: 0 2px; }
        .note-view .note-quote, .note-preview .note-quote {
            border-left: 3px solid var(--panel-accent, var(--item-color, var(--accent-primary)));
            padding-left: 10px; margin: 3px 0 3px 2px;
            color: var(--text-secondary); font-style: italic;
        }
        .note-view .note-hr, .note-preview .note-hr { border: 0; border-top: 1px solid var(--border-color); margin: .7em 0; }
        .note-preview .note-line { padding-left: calc(var(--lvl, 0) * 1.2em); }
        .note-preview .note-li { padding-left: calc(1.1em + var(--lvl, 0) * 1.2em); }

        /* =====================================================
           NOTAS AGRUPADAS POR GRUPO + ANIMACIONES
           ===================================================== */
        @keyframes railIn    { from { opacity: 0; transform: translateX(44px); } to { opacity: 1; transform: none; } }
        @keyframes groupIn   { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
        @keyframes noteIn    { from { opacity: 0; transform: translateX(36px) rotate(2.5deg) scale(.94); } to { opacity: 1; transform: none; } }
        @keyframes noteFlash {
            0%   { transform: scale(1.05); box-shadow: 0 0 0 0 var(--item-color, var(--accent-primary)); }
            55%  { box-shadow: 0 0 0 10px transparent; }
            100% { transform: none; box-shadow: 0 0 0 0 transparent; }
        }
        @keyframes dropPulse { 50% { border-color: var(--accent-primary); background: var(--accent-primary-transparent); } }

        .notes-rail.is-open { animation: railIn .5s var(--ease-out); }

        .notes-rail-btn {
            display: flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; padding: 0;
            border: 0; border-radius: 50%;
            background: transparent; color: var(--text-secondary);
            cursor: pointer;
            transition: background-color .2s, color .2s, transform .3s var(--ease-spring);
        }
        .notes-rail-btn i { color: inherit; }
        .notes-rail-btn:hover { background: var(--bg-secondary); color: var(--accent-primary); transform: scale(1.15); }
        .notes-rail-btn.primary { background: var(--accent-primary); color: #fff; }
        .notes-rail-btn.primary:hover { background: var(--accent-secondary); color: #fff; transform: rotate(90deg) scale(1.12); }
        .notes-rail-btn[aria-pressed="true"] { background: var(--accent-primary-transparent); color: var(--accent-primary); }

        .notes-list { gap: 10px; }

        /* Sección de un grupo */
        .notes-group {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-secondary);
            overflow: hidden;
            transition: border-color .25s, box-shadow .25s;
        }
        .notes-group.group-enter { animation: groupIn .55s var(--ease-out) calc(var(--g, 0) * 60ms) backwards; }
        .notes-group.is-current { border-color: var(--accent-primary); }
        .notes-group-header {
            display: flex; align-items: center; gap: 7px;
            padding: 9px 10px;
            border-left: 3px solid var(--group-color, transparent);
            cursor: pointer; user-select: none; outline: none;
            transition: background-color .2s;
        }
        .notes-group-header:hover { background: rgba(127,127,127,.13); }
        .notes-group-header:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-primary); }
        .notes-group-chevron { flex-shrink: 0; width: 10px; font-size: .7em; color: var(--text-secondary); transition: transform .35s var(--ease-spring); }
        .notes-group:not(.is-collapsed) .notes-group-chevron { transform: rotate(90deg); }
        .notes-group-icon { flex-shrink: 0; color: var(--group-color, var(--accent-primary)); transition: transform .35s var(--ease-spring); }
        .notes-group-header:hover .notes-group-icon { transform: scale(1.2) rotate(-7deg); }
        .notes-group-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .88em; color: var(--text-primary); }
        .notes-group-parent { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .72em; color: var(--text-secondary); }
        .notes-group-here {
            flex-shrink: 0; padding: 0 7px; border-radius: 8px;
            background: var(--accent-primary-transparent); color: var(--accent-primary);
            font-size: .62em; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 17px;
        }
        .notes-group-count {
            flex-shrink: 0; margin-left: auto;
            min-width: 18px; padding: 0 6px; border-radius: 9px;
            background: rgba(127,127,127,.2); color: var(--text-secondary);
            font-size: .75em; line-height: 18px; text-align: center;
        }
        .notes-group-add {
            flex-shrink: 0; width: 22px; height: 22px; padding: 0;
            border: 0; border-radius: 50%;
            background: transparent; color: var(--text-secondary);
            cursor: pointer; font-size: .8em; opacity: .6;
            transition: background-color .2s, color .2s, opacity .2s, transform .3s var(--ease-spring);
        }
        .notes-group-header:hover .notes-group-add, .notes-group-add:focus-visible { opacity: 1; }
        .notes-group-add:hover { background: var(--accent-primary); color: #fff; opacity: 1; transform: rotate(90deg) scale(1.15); }

        /* Plegado animado */
        .notes-group-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .4s var(--ease-out); }
        .notes-group.is-collapsed .notes-group-body { grid-template-rows: 0fr; }
        .notes-group-list {
            min-height: 0; overflow: hidden;
            display: flex; flex-direction: column; gap: 12px;
            padding: 6px 12px 14px;
            transition: padding .4s var(--ease-out), opacity .3s;
        }
        .notes-group.is-collapsed .notes-group-list { padding-top: 0; padding-bottom: 0; opacity: 0; }

        .notes-group-empty {
            padding: 12px; text-align: center;
            border: 1px dashed var(--border-color); border-radius: 8px;
            font-size: .78em; font-style: italic; color: var(--text-secondary);
        }
        .notes-group-list.sortable-drag-over .notes-group-empty { animation: dropPulse 1s ease-in-out infinite; }

        /* Notas dentro de los grupos */
        .notes-list .item { min-height: 0; }
        .notes-list .note-preview { max-height: 8.5em; }
        #link-organizer #notes-list .item-enter { animation: noteIn .65s var(--ease-spring) calc(var(--i, 0) * 70ms) backwards; }
        #link-organizer #notes-list .item:hover { transform: translateY(-3px) rotate(-.5deg); }
        #link-organizer #notes-list .item.note-flash { animation: noteFlash .95s var(--ease-out); }

        /* Ubicación de la nota (panel) */
        .note-location {
            display: inline-flex; align-items: center; gap: 8px;
            align-self: flex-start; max-width: 100%;
            padding: 5px 12px; border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary); color: var(--text-secondary);
            font-family: inherit; font-size: .82em; cursor: pointer;
            transition: border-color .2s, color .2s, transform .25s var(--ease-spring);
        }
        .note-location:hover { border-color: var(--accent-primary); color: var(--accent-primary); transform: translateY(-1px); }
        .note-location span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-location i { flex-shrink: 0; }
        .note-location-caret { font-size: .7em; }

        @media (max-width: 900px) {
            .notes-list { display: flex; flex-direction: column; gap: 10px; }
            .notes-group-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--item-min-width)), 1fr)); gap: 14px; }
        }

        /* =====================================================
           ARRASTRAR UN ELEMENTO DENTRO DE UN GRUPO
           ===================================================== */
        @keyframes dropHint     { 50% { outline-color: var(--accent-primary); } }
        @keyframes dropLabelIn  { from { opacity: 0; transform: translateY(8px) scale(.9); } to { opacity: 1; transform: none; } }
        @keyframes dropBarIn    { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes dropFlash {
            0%   { transform: scale(1.07); box-shadow: 0 0 0 0 var(--accent-primary); }
            55%  { box-shadow: 0 0 0 14px transparent; }
            100% { transform: none; box-shadow: 0 0 0 0 transparent; }
        }

        /* Mientras arrastras: todos los grupos se marcan como destinos posibles */
        .is-dragging-item #link-organizer .group-item:not(.dnd-source):not(.drop-into) {
            outline: 2px dashed rgba(127,127,127,.6);
            outline-offset: -5px;
            animation: dropHint 1.5s ease-in-out infinite;
        }
        /* Y el grupo sobre el que estás se ilumina con un mensaje claro */
        #link-organizer .group-item.drop-into {
            outline: 3px solid var(--accent-primary);
            outline-offset: -3px;
            background-color: var(--accent-primary-transparent);
            transform: scale(1.05) !important;
            box-shadow: 0 0 0 5px var(--accent-primary-transparent), 0 16px 32px var(--shadow-color);
            animation: none;
            z-index: 5;
        }
        .group-item.drop-into::after {
            content: attr(data-drop-label);
            position: absolute; left: 10px; right: 10px; bottom: 10px;
            padding: 7px 10px; border-radius: 8px;
            background: var(--accent-primary); color: #fff;
            font-size: .82em; font-weight: 600; text-align: center;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            pointer-events: none; z-index: 3;
            animation: dropLabelIn .3s var(--ease-spring);
        }
        .group-item.drop-into .item-icon > * { transform: scale(1.4) rotate(-8deg); }

        /* Migas de pan: soltar aquí para subir uno o varios niveles */
        .is-dragging-item #breadcrumbs-container [data-drop-parent] {
            outline: 1px dashed var(--accent-primary); outline-offset: 3px; border-radius: 6px;
        }
        #breadcrumbs-container [data-drop-parent].drop-into {
            background: var(--accent-primary); color: #fff !important;
            outline-style: solid; transform: scale(1.15);
            box-shadow: 0 4px 14px var(--accent-primary-transparent);
        }

        /* Mensaje flotante mientras se arrastra */
        .is-dragging-item::after {
            content: 'Suelta sobre un grupo para meterlo dentro, o entre tarjetas para ordenar';
            position: fixed; left: 50%; bottom: 24px;
            transform: translate(-50%, 0);
            max-width: 92vw; padding: 9px 18px; border-radius: 22px;
            background: var(--bg-secondary); color: var(--text-secondary);
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 18px var(--shadow-color);
            font-size: .85em; text-align: center;
            pointer-events: none; z-index: 1500;
            animation: dropBarIn .35s var(--ease-out);
        }

        /* La tarjeta "entra" en el grupo al soltarla; el grupo hace un destello */
        .item.drop-absorb {
            transform: scale(.25) !important; opacity: 0 !important;
            transition: transform .26s ease-in, opacity .26s ease-in !important;
        }
        .item.drop-flash { animation: dropFlash .95s var(--ease-out); }

        /* Aviso con botón "Deshacer" */
        .toast { display: flex; align-items: center; }
        .toast.has-action { pointer-events: auto; }
        .toast-action {
            margin-left: 14px; padding: 2px 4px; border: 0; background: transparent;
            color: var(--accent-secondary); font: inherit; font-weight: 700;
            text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
            transition: transform .2s var(--ease-spring);
        }
        .toast-action:hover { transform: scale(1.1); }

        /* ----- Arrastre propio: copia flotante, línea de inserción, sin reordenar en vivo ----- */
        .dnd-ghost {
            position: fixed; left: 0; top: 0; z-index: 3000;
            display: flex; align-items: center; gap: 9px;
            max-width: 240px; padding: 9px 15px; margin: 0;
            border-radius: 12px; border: 2px solid var(--ghost-color, var(--accent-primary));
            background: var(--bg-secondary); color: var(--text-primary);
            font-size: .92em; font-weight: 600; white-space: nowrap;
            pointer-events: none; will-change: transform;
            box-shadow: 0 14px 30px rgba(0,0,0,.45);
        }
        .dnd-ghost i { flex-shrink: 0; color: var(--ghost-color, var(--accent-primary)); }
        .dnd-ghost span { overflow: hidden; text-overflow: ellipsis; }
        .item.dnd-source {
            opacity: .35; transform: none !important; animation: none !important;
            outline: 2px dashed var(--accent-primary); outline-offset: -4px;
        }
        .dnd-indicator {
            position: fixed; z-index: 2500; width: 5px; border-radius: 3px;
            background: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-transparent), 0 0 16px var(--accent-primary);
            pointer-events: none; opacity: 0;
            transition: left .1s var(--ease-out), top .1s var(--ease-out), height .1s, opacity .15s;
        }
        .dnd-indicator.show { opacity: 1; }
        body.is-dragging-item, body.is-dragging-item * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
        .is-dragging-item #link-organizer .item:not(.drop-into):hover { transform: none !important; }
        .drag-handle { touch-action: none; }
        .item a, .item img { -webkit-user-drag: none; }
        #backToParentBtn.drop-into {
            background: var(--accent-primary); color: #fff; border-color: var(--accent-primary);
            transform: scale(1.18); box-shadow: 0 6px 18px var(--accent-primary-transparent);
        }
        .is-dragging-item #backToParentBtn:not(.hidden) { outline: 1px dashed var(--accent-primary); outline-offset: 3px; }

        /* ----- Descripción de los enlaces: "Ver más / Ver menos" sin abrir el editor ----- */
        .link-item.desc-more:not(.desc-open) .link-item-description {
            -webkit-mask-image: linear-gradient(to bottom, #000 58%, transparent);
            mask-image: linear-gradient(to bottom, #000 58%, transparent);
        }
        .desc-toggle {
            display: none; align-self: flex-start;
            margin: 6px 0 0 -9px; padding: 2px 9px; border-radius: 12px;
            font-size: .78em; font-weight: 600; line-height: 1.5;
            color: var(--item-color, var(--accent-primary));
            cursor: pointer; user-select: none; outline: none;
