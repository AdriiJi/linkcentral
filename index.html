            });
            function noteEditorKeydown(e, onSubmit) {
                if (e.isComposing) return;
                const ta = e.target;
                const mod = e.ctrlKey || e.metaKey;

                // Atajos de formato
                if (mod && !e.altKey) {
                    const k = (e.key || '').toLowerCase();
                    const map = e.shiftKey ? { x: 'strike', h: 'highlight' } : { b: 'bold', i: 'italic' };
                    if (map[k]) { e.preventDefault(); applyNoteAction(map[k], ta); return; }
                }

                // Tab / Mayús+Tab: sangría en listas y selecciones de varias líneas
                if (e.key === 'Tab' && !mod && !e.altKey) {
                    const val = ta.value, s0 = ta.selectionStart, e0 = ta.selectionEnd;
                    const ls = s0 === 0 ? 0 : val.lastIndexOf('\n', s0 - 1) + 1;
                    let le = val.indexOf('\n', s0); if (le === -1) le = val.length;
                    const multi = s0 !== e0 && val.slice(s0, e0).includes('\n');
                    const inList = /^\s*(- \[[ xX]\] ?|[-*] |\d+\. )/.test(val.slice(ls, le));
                    if (multi || inList) { e.preventDefault(); applyNoteAction(e.shiftKey ? 'outdent' : 'indent', ta); }
                    return;
                }

                if (e.key !== 'Enter') return;
                if (mod) { e.preventDefault(); onSubmit(); return; }
                if (e.shiftKey) return;
                if (ta.selectionStart !== ta.selectionEnd) return;
                const pos = ta.selectionStart, val = ta.value;
                const lineStart = pos === 0 ? 0 : val.lastIndexOf('\n', pos - 1) + 1;
                const m = val.slice(lineStart, pos).match(/^(\s*)(- \[[ xX]\] |[-*] |(\d+)\. |> )(.*)$/);
                if (!m) return;
                e.preventDefault();
                if (m[4].trim() === '') {
                    replaceText(ta, lineStart, pos, '');                 // línea vacía: salir de la lista
                } else {
                    let marker = m[2];
                    if (/^- \[/.test(marker)) marker = '- [ ] ';
                    else if (m[3]) marker = (parseInt(m[3], 10) + 1) + '. ';
                    replaceText(ta, pos, pos, '\n' + m[1] + marker);
                }
            }

            modalItemDescription.addEventListener('keydown', (e) => {
                if (modalItemType.value === 'note') noteEditorKeydown(e, () => saveModalItemBtn.click());
            });

            // =====================================================
            //  PANEL LATERAL DE NOTAS (autoguardado)
            // =====================================================
            const notePanelEl = document.getElementById('notePanel');
            const notePanelTitle = document.getElementById('notePanelTitle');
            const notePanelText = document.getElementById('notePanelText');
            const notePanelToolbar = document.getElementById('notePanelToolbar');
            const notePanelColors = document.getElementById('notePanelColors');
            const notePanelStats = document.getElementById('notePanelStats');
            const notePanelStatus = document.getElementById('notePanelStatus');
            const notePanelView = document.getElementById('notePanelView');
            const noteModeSwitch = document.getElementById('noteModeSwitch');
            const noteTaskInfo = document.getElementById('noteTaskInfo');
            const noteTaskBar = document.querySelector('#noteTaskInfo .note-task-bar i');
            const noteTaskText = document.getElementById('noteTaskText');
            const noteClearDone = document.getElementById('noteClearDone');
            const noteLocationBtn = document.getElementById('noteLocationBtn');
            const noteLocationText = document.getElementById('noteLocationText');
            const NOTE_SAVE_DELAY = 500;
            let noteState = null;          // { id, parentId, color } mientras el panel está abierto
            let noteSaveTimer = null;
            let noteStatusTimer = null;
            let noteMode = 'edit';        // 'edit' | 'view'

            function deriveNoteName(description) {
                const firstLine = (description || '').split('\n')
                    .map(l => l.replace(/!\[([^\]]*)\]\(img:[\w-]+\)/g, '$1').replace(/^\s*(- \[[ xX]\] ?|[-*] |#{1,3} |\d+\. |> ?)/, '').replace(/(\*\*|~~|==|`)/g, '').trim())
                    .find(l => l && !/^[-*_=]{3,}$/.test(l));
                if (!firstLine) return /\]\(img:/.test(description || '') ? 'Nota con imágenes' : '';
                return firstLine.length > 40 ? firstLine.slice(0, 40).trimEnd() + '…' : firstLine;
            }

            function setNoteStatus(msg, saved = false) {
                notePanelStatus.textContent = msg;
                notePanelStatus.classList.toggle('saved', saved);
                clearTimeout(noteStatusTimer);
                if (saved) noteStatusTimer = setTimeout(() => notePanelStatus.classList.remove('saved'), 1500);
            }

            function updateNotePanelStats() {
                const t = notePanelText.value;
                const words = t.trim() ? t.trim().split(/\s+/).length : 0;
                notePanelStats.textContent = `${words} palabras · ${t.length} caracteres`;
                updateNoteImgStrip();
                const prog = checklistProgress(t);
                noteTaskInfo.hidden = prog.total === 0;
                if (prog.total > 0) {
                    noteTaskBar.style.width = Math.round(prog.done / prog.total * 100) + '%';
                    noteTaskText.textContent = `${prog.done}/${prog.total}`;
                    noteClearDone.hidden = prog.done === 0;
                }
            }

            function buildNoteSwatches() {
                notePanelColors.innerHTML = '';
                const addSwatch = (value, title) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'swatch' + (value ? '' : ' swatch-none');
                    b.dataset.value = value;
                    b.title = title;
                    if (value) b.style.background = value;
                    b.onclick = () => setNoteColor(value);
                    notePanelColors.appendChild(b);
                };
                addSwatch('', 'Sin color');
                COLOR_PALETTE.forEach(c => addSwatch(c.value, c.name));
                const custom = document.createElement('label');
                custom.className = 'swatch swatch-custom';
                custom.title = 'Color personalizado';
                custom.innerHTML = '<i class="fas fa-plus"></i><input type="color" value="#4a90e2">';
                custom.querySelector('input').addEventListener('input', e => setNoteColor(e.target.value));
                notePanelColors.appendChild(custom);
            }

            function setNoteColor(value, save = true) {
                value = (value || '').toLowerCase();
                if (noteState) noteState.color = value;
                let matched = false;
                notePanelColors.querySelectorAll('.swatch:not(.swatch-custom)').forEach(sw => {
                    const on = (sw.dataset.value || '') === value;
                    sw.classList.toggle('selected', on);
                    if (on) matched = true;
                });
                const custom = notePanelColors.querySelector('.swatch-custom');
                const isCustom = !!value && !matched;
                custom.classList.toggle('selected', isCustom);
                custom.style.background = isCustom ? value : '';
                if (isCustom) custom.querySelector('input').value = value;
                if (value) notePanelEl.style.setProperty('--panel-accent', value);
                else notePanelEl.style.removeProperty('--panel-accent');
                if (save) scheduleNoteSave();
            }

            function highlightActiveNote() {
                document.querySelectorAll('.item.note-active').forEach(el => el.classList.remove('note-active'));
                if (noteState && noteState.id) {
                    document.querySelectorAll('.item').forEach(el => {
                        if (el.dataset.id === noteState.id) el.classList.add('note-active');
                    });
                }
            }

            function saveNoteNow() {
                clearTimeout(noteSaveTimer);
                noteSaveTimer = null;
                if (!noteState) return;
                const description = notePanelText.value.trim();
                const name = notePanelTitle.value.trim() || deriveNoteName(description);
                if (!name) { setNoteStatus(''); return; }          // nota vacía: nada que guardar
                if (noteState.id) {
                    if (!findItemRecursive(noteState.id)) return;   // la nota ya no existe
                    editItem(noteState.id, name, undefined, description, undefined, noteState.color || '');
                } else {
                    const newId = generateId();
                    noteState.id = newId;
                    addItem('note', name, undefined, noteState.parentId, newId, undefined, null, description, noteState.color || '');
                }
                highlightActiveNote();
                setNoteStatus('Guardado ✓', true);
            }
            function scheduleNoteSave() {
                if (!noteState) return;
                setNoteStatus('Guardando…');
                clearTimeout(noteSaveTimer);
                noteSaveTimer = setTimeout(saveNoteNow, NOTE_SAVE_DELAY);
            }
            function flushNoteSave() { if (noteSaveTimer) saveNoteNow(); }

            function openNotePanel(id = null, explicitParentId = null) {
                mainMenuDropdown.classList.remove('show');
                resetNoteToolbarState();
                flushNoteSave();
                let item = null;
                if (id) {
                    const r = findItemRecursive(id);
                    if (!r) return;
                    item = r.item;
                }
                const parentId = explicitParentId !== null ? explicitParentId : getCurrentParentId();
                noteState = { id: id || null, parentId: parentId || null, color: '' };
                const desc = item ? (item.description || '') : '';
                notePanelText.value = desc;
                // Si el título es el automático (primera línea), se deja vacío para que siga al contenido
                notePanelTitle.value = (item && item.name !== deriveNoteName(desc)) ? item.name : '';
                setNoteColor(item && item.color ? item.color : '', false);
                setNoteStatus('');
                updateNotePanelStats();
                updateNoteLocation();
                notePanelEl.classList.add('open');
                notePanelEl.setAttribute('aria-hidden', 'false');
                document.body.classList.add('note-panel-open');
                highlightActiveNote();
                // Notas con contenido: se abren en Vista (casillas clicables); las nuevas, en Editar
                setNoteMode((item && desc.trim()) ? getPreferredNoteMode() : 'edit', false, false);
                if (noteMode === 'edit' && (!item || window.matchMedia('(hover: hover)').matches)) {
                    notePanelText.focus();
                    const end = notePanelText.value.length;
                    notePanelText.setSelectionRange(end, end);
                }
            }

            // Muestra en qué grupo está (o estará) la nota; al pulsarla se abre el selector de grupos
            function updateNoteLocation() {
                if (!noteState) return;
                let parentId = noteState.parentId;
                if (noteState.id) {
                    const det = findParentDetails(noteState.id, data);
                    parentId = det ? det.parentId : null;
                }
                noteLocationText.textContent = gpPathNames(parentId || '').join(' / ');
            }

            function closeNotePanel() {
                flushNoteSave();
                noteState = null;
                notePanelEl.classList.remove('open');
                notePanelEl.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('note-panel-open');
                if (notePanelEl.contains(document.activeElement)) document.activeElement.blur();
                highlightActiveNote();
            }

            // Si la nota abierta desaparece (borrada desde la tarjeta o el menú), se cierra el panel
            function closeNotePanelIfGone() {
                if (noteState && noteState.id && !findItemRecursive(noteState.id)) {
                    clearTimeout(noteSaveTimer);
                    noteSaveTimer = null;
                    closeNotePanel();
                }
            }
            // Si se marca una casilla desde la tarjeta, el texto del panel se actualiza
            function refreshNotePanel(itemId) {
                if (!noteState || noteState.id !== itemId) return;
                const r = findItemRecursive(itemId);
                if (!r) return;
                notePanelText.value = r.item.description || '';
                updateNotePanelStats();
                if (noteMode === 'view') renderNoteView();
            }

            notePanelTitle.addEventListener('input', scheduleNoteSave);
            notePanelTitle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); notePanelText.focus(); }
            });
            notePanelText.addEventListener('input', () => { updateNotePanelStats(); scheduleNoteSave(); });
            notePanelText.addEventListener('keydown', (e) => noteEditorKeydown(e, closeNotePanel));
            notePanelToolbar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
            notePanelToolbar.addEventListener('click', e => {
                const btn = e.target.closest('button[data-note-action]');
                if (btn) applyNoteAction(btn.dataset.noteAction, notePanelText);
            });
            document.getElementById('notePanelClose').onclick = closeNotePanel;
            document.getElementById('notePanelCopy').onclick = () => copyText(notePanelText.value, 'Nota copiada');
            document.getElementById('notePanelDelete').onclick = () => {
                if (!noteState) return;
                if (!noteState.id) { closeNotePanel(); return; }
                if (confirm('¿Estás seguro de que quieres eliminar esta nota?')) deleteItem(noteState.id);
            };
            document.getElementById('notePanelMove').onclick = () => {
                if (!noteState) return;
                flushNoteSave();
                if (!noteState.id) { showToast('Escribe algo antes de moverla'); return; }
                const id = noteState.id;
                closeNotePanel();
                openModal('note', id, null, true);   // el selector de grupos sigue viviendo en la ventana
            };

            // ---- Modo Editar / Vista del panel ----
            function getPreferredNoteMode() {
                try { return localStorage.getItem('linkcentral_note_mode') === 'edit' ? 'edit' : 'view'; } catch (e) { return 'view'; }
            }
            function renderNoteView() {
                const text = notePanelText.value;
                notePanelView.innerHTML = text.trim()
                    ? renderNoteHTML(text)
                    : '<p class="note-view-empty"><i class="fas fa-pen"></i>Nota vacía. Haz clic aquí para escribir.</p>';
                hydrateImages(notePanelView);                       // las imágenes de la nota se cargan desde IndexedDB
            }
            function setNoteMode(mode, focusEditor = true, remember = false) {
                noteMode = mode === 'view' ? 'view' : 'edit';
                notePanelEl.classList.toggle('mode-view', noteMode === 'view');
                notePanelEl.classList.toggle('mode-edit', noteMode === 'edit');
                noteModeSwitch.querySelectorAll('button').forEach(b => {
                    const on = b.dataset.mode === noteMode;
                    b.classList.toggle('active', on);
                    b.setAttribute('aria-pressed', String(on));
                });
                if (remember) { try { localStorage.setItem('linkcentral_note_mode', noteMode); } catch (e) {} }
                if (noteMode === 'view') {
                    if (document.activeElement === notePanelText) notePanelText.blur();
                    renderNoteView();
                } else if (focusEditor) {
                    notePanelText.focus();
                    const end = notePanelText.value.length;
                    notePanelText.setSelectionRange(end, end);
                }
            }
            noteModeSwitch.addEventListener('click', (e) => {
                const b = e.target.closest('button[data-mode]');
                if (b) setNoteMode(b.dataset.mode, true, true);
            });
            // En la Vista: las casillas se marcan (y se tachan) con un clic; clic en el texto = editar
            notePanelView.addEventListener('click', (e) => {
                const box = e.target.closest('input[type="checkbox"]');
                if (box) {
                    const next = toggleChecklistInText(notePanelText.value, parseInt(box.dataset.line, 10));
                    if (next === null) return;
                    notePanelText.value = next;
                    const row = box.closest('.note-check');
                    if (row) row.classList.toggle('is-done', box.checked);
                    updateNotePanelStats();
                    scheduleNoteSave();
                    return;
                }
                if (e.target.closest('a') || e.target.closest('img[data-img-id]')) return;
                if (window.getSelection && window.getSelection().toString()) return;   // está seleccionando texto
                setNoteMode('edit', true, false);
            });
            noteClearDone.onclick = () => {
                applyNoteAction('clean', notePanelText);
                if (noteMode === 'view') renderNoteView();
            };

            noteLocationBtn.onclick = () => document.getElementById('notePanelMove').click();
            buildNoteSwatches();
            window.addEventListener('beforeunload', flushNoteSave);
            document.addEventListener('visibilitychange', () => { if (document.hidden) flushNoteSave(); });

            // =====================================================
            //  IMÁGENES  (se guardan en IndexedDB, reducidas: nunca llenan el localStorage)
            // =====================================================
            const IMG_DB_NAME = 'linkcentral_images', IMG_STORE = 'images', IMG_MAX_SIDE = 1600;
            let imgDbPromise = null;
            const imgMemory = new Map();       // respaldo si el navegador no permite IndexedDB
            const imgUrlCache = new Map();     // id -> object URL
            const imgMeta = new Map();         // id -> { type, name }
            const imgInput = document.getElementById('imageFileInput');
            const noteImgInput = document.getElementById('noteImageInput');
            const noteImgStripEl = document.getElementById('noteImgStrip');
            const lightboxEl = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImg');
            const lbCaption = document.getElementById('lbCaption');
            const lbCounter = document.getElementById('lbCounter');
            const lbDownload = document.getElementById('lbDownload');
            const lb = { list: [], index: 0, open: false };

            function openImgDb() {
                if (imgDbPromise) return imgDbPromise;
                imgDbPromise = new Promise((resolve) => {
                    if (!('indexedDB' in window)) { resolve(null); return; }
                    try {
                        const req = indexedDB.open(IMG_DB_NAME, 1);
                        req.onupgradeneeded = () => { req.result.createObjectStore(IMG_STORE, { keyPath: 'id' }); };
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => resolve(null);
                        req.onblocked = () => resolve(null);
                    } catch (e) { resolve(null); }
                });
                return imgDbPromise;
            }
            function imgTx(db, mode, fn) {
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction(IMG_STORE, mode);
                        let result;
                        const req = fn(tx.objectStore(IMG_STORE));
                        if (req) req.onsuccess = () => { result = req.result; };
                        tx.oncomplete = () => resolve(result === undefined ? true : result);
                        tx.onerror = tx.onabort = () => resolve(null);
                    } catch (e) { resolve(null); }
                });
            }
            async function imgPut(rec) {
                const db = await openImgDb();
                if (!db) { imgMemory.set(rec.id, rec); return true; }
                return (await imgTx(db, 'readwrite', st => st.put(rec))) !== null;
            }
            async function imgGet(id) {
                if (imgMemory.has(id)) return imgMemory.get(id);
                const db = await openImgDb();
                if (!db) return null;
                const r = await imgTx(db, 'readonly', st => st.get(id));
                return (r && r !== true) ? r : null;
            }
            async function imgDelete(id) {
                imgMemory.delete(id);
                if (imgUrlCache.has(id)) { try { URL.revokeObjectURL(imgUrlCache.get(id)); } catch (e) {} imgUrlCache.delete(id); }
                const db = await openImgDb();
                if (db) await imgTx(db, 'readwrite', st => st.delete(id));
            }
            async function imgAllKeys() {
                const db = await openImgDb();
                if (!db) return [...imgMemory.keys()];
                const r = await imgTx(db, 'readonly', st => st.getAllKeys());
                return Array.isArray(r) ? r : [];
            }

            async function getImageURL(id) {
                if (imgUrlCache.has(id)) return imgUrlCache.get(id);
                const rec = await imgGet(id);
                if (!rec || !rec.blob) return null;
                const url = URL.createObjectURL(rec.blob);
                imgUrlCache.set(id, url);
                imgMeta.set(id, { type: rec.type || rec.blob.type || 'image/jpeg', name: rec.name || 'imagen' });
                return url;
            }
            // Rellena el src de las <img data-img-id> (las imágenes viven en IndexedDB, no en el HTML)
            function hydrateImages(root = document) {
                root.querySelectorAll('img[data-img-id]:not([data-hydrated])').forEach(img => {
                    img.dataset.hydrated = '1';
                    getImageURL(img.dataset.imgId).then(url => {
                        if (!url) { img.classList.add('img-missing'); img.title = 'Imagen no encontrada'; return; }
                        img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
                        img.src = url;
                        if (img.complete && img.naturalWidth) img.classList.add('loaded');
                    });
                });
            }

            // Reduce la imagen (máx. 1600 px) y la comprime. Devuelve null si el formato no es compatible.
            async function processImageFile(file) {
                if (!file || !/^image\//.test(file.type)) return null;
                let bmp;
                try { bmp = await createImageBitmap(file); } catch (e) { return null; }
                const w = bmp.width, h = bmp.height;
                if (file.type === 'image/gif') {                                  // los GIF animados se guardan tal cual
                    if (bmp.close) bmp.close();
                    return file.size <= 6 * 1024 * 1024 ? { blob: file, type: file.type, w, h } : null;
                }
                const scale = Math.min(1, IMG_MAX_SIDE / Math.max(w, h));
                if (scale === 1 && file.size <= 350 * 1024 && /^image\/(png|jpeg|webp)$/.test(file.type)) {
                    if (bmp.close) bmp.close();
                    return { blob: file, type: file.type, w, h };                  // ya es pequeña: sin tocarla
                }
                const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
                const canvas = document.createElement('canvas');
                canvas.width = cw; canvas.height = ch;
                canvas.getContext('2d').drawImage(bmp, 0, 0, cw, ch);
                if (bmp.close) bmp.close();
                const keepAlpha = file.type === 'image/png' || file.type === 'image/webp';
                const blob = await new Promise(r => canvas.toBlob(r, keepAlpha ? 'image/webp' : 'image/jpeg', 0.86));
                return blob ? { blob, type: blob.type, w: cw, h: ch } : null;
            }
            function baseNameFromFile(name) {
                const n = String(name || '').replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
                return (!n || /^image$/i.test(n)) ? 'Imagen' : n.slice(0, 80);
            }
            async function storeImageFile(file) {
                const proc = await processImageFile(file);
                if (!proc) return null;
                const id = generateId();
                const ok = await imgPut({ id, blob: proc.blob, type: proc.type, name: file.name || 'imagen', w: proc.w, h: proc.h, size: proc.blob.size, createdAt: Date.now() });
                return ok ? { id, w: proc.w, h: proc.h, name: baseNameFromFile(file.name) } : null;
            }
            const isImageFile = (f) => !!f && /^image\//.test(f.type);

            // ---- Imágenes sueltas: tarjetas en la cuadrícula ----
            async function addImagesToView(files, parentId = getCurrentParentId()) {
                const list = Array.from(files || []).filter(isImageFile);
                if (!list.length) { showToast('Solo se pueden añadir imágenes'); return 0; }
                showToast(list.length === 1 ? 'Procesando imagen…' : 'Procesando ' + list.length + ' imágenes…');
                let arr = data;
                if (parentId) {
                    const pr = findItemRecursive(parentId);
                    if (pr && pr.item.type === 'group') { if (!pr.item.items) pr.item.items = []; arr = pr.item.items; }
                }
                let ok = 0, lastId = null;
                for (const f of list) {
                    const st = await storeImageFile(f);
                    if (!st) continue;
                    const item = { id: generateId(), type: 'image', name: st.name, imageId: st.id, w: st.w, h: st.h, description: '', createdAt: Date.now(), isPinned: false };
                    arr.push(item); lastId = item.id; ok++;
                }
                if (!ok) { showToast('No se pudo añadir la imagen (formato no compatible)'); return 0; }
                saveData();
                flashGroupId = lastId;
                render();
                showToast(ok === 1 ? 'Imagen añadida' : ok + ' imágenes añadidas');
                return ok;
            }
            async function downloadImageById(imageId, baseName) {
                const url = await getImageURL(imageId);
                if (!url) { showToast('Imagen no encontrada'); return; }
                const meta = imgMeta.get(imageId) || { type: 'image/jpeg' };
                const ext = (meta.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
                const a = document.createElement('a');
                a.href = url; a.download = (baseName || 'imagen') + '.' + ext;
                document.body.appendChild(a); a.click(); a.remove();
            }

            // ---- Visor a pantalla completa ----
            async function showLightboxAt(i) {
                if (!lb.list.length) return;
                lb.index = (i + lb.list.length) % lb.list.length;
                const entry = lb.list[lb.index];
                lbImg.classList.remove('loaded');
                lbCaption.textContent = entry.caption || '';
                lbCounter.textContent = lb.list.length > 1 ? (lb.index + 1) + ' / ' + lb.list.length : '';
                lightboxEl.classList.toggle('lb-single', lb.list.length < 2);
                const url = await getImageURL(entry.imageId);
                if (!lb.open || lb.list[lb.index] !== entry) return;           // se cerró o se cambió mientras cargaba
                if (!url) {
                    lbImg.removeAttribute('src');
                    lbCaption.textContent = (entry.caption ? entry.caption + ' · ' : '') + 'imagen no encontrada';
                    lbDownload.removeAttribute('href');
                    return;
                }
                lbImg.onload = () => lbImg.classList.add('loaded');
                lbImg.src = url;
                lbImg.alt = entry.caption || '';
                const meta = imgMeta.get(entry.imageId) || { type: 'image/jpeg' };
                const ext = (meta.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
                lbDownload.href = url;
                lbDownload.download = ((entry.caption || 'imagen').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) || 'imagen') + '.' + ext;
            }
            function openLightbox(list, index = 0) {
                if (!list || !list.length) return;
                lb.list = list; lb.open = true;
                lightboxEl.classList.add('open');
                lightboxEl.setAttribute('aria-hidden', 'false');
                document.body.classList.add('lb-open');
                showLightboxAt(index);
            }
            function closeLightbox() {
                if (!lb.open) return;
                lb.open = false;
                lightboxEl.classList.remove('open');
                lightboxEl.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('lb-open');
            }
            document.getElementById('lbClose').onclick = closeLightbox;
            document.getElementById('lbPrev').onclick = () => showLightboxAt(lb.index - 1);
            document.getElementById('lbNext').onclick = () => showLightboxAt(lb.index + 1);
            // Un clic en cualquier zona oscura (no en la foto, el pie ni los botones) cierra el visor
            lightboxEl.addEventListener('click', (e) => { if (e.target.closest('.lb-btn, #lbImg, .lb-caption')) return; closeLightbox(); });
            document.addEventListener('keydown', (e) => {
                if (!lb.open) return;
                if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLightbox(); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); showLightboxAt(lb.index + 1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); showLightboxAt(lb.index - 1); }
            }, true);
            // Clic en una imagen de una nota (vista, tarjeta o miniatura): se abre el visor con todas las imágenes de esa nota
            document.addEventListener('click', (e) => {
                const img = e.target.closest && e.target.closest('img[data-img-id]');
                if (!img) return;
                const box = img.closest('.note-view, .note-preview, .note-img-strip');
                if (!box) return;
                e.preventDefault(); e.stopPropagation();
                const imgs = Array.from(box.querySelectorAll('img[data-img-id]'));
                openLightbox(imgs.map(i => ({ imageId: i.dataset.imgId, caption: i.alt || '' })), Math.max(0, imgs.indexOf(img)));
            }, true);
            function lightboxListFromGrid() {
                const cards = Array.from(mainItemsEl.querySelectorAll('.image-item'));
                return cards.map(c => {
                    const r = findItemRecursive(c.dataset.id);
                    const it = r ? r.item : null;
                    return { imageId: c.dataset.imageId, caption: it ? (it.description ? it.name + ' — ' + it.description : it.name) : '', cardId: c.dataset.id };
                });
            }

            // ---- Imágenes dentro de las notas: ![nombre](img:ID) ----
            function parseNoteImages(text) {
                const out = [], re = /!\[([^\]]*)\]\(img:([\w-]+)\)/g;
                let m;
                while ((m = re.exec(text || ''))) out.push({ alt: m[1], id: m[2], index: m.index, token: m[0] });
                return out;
            }
            async function insertImagesIntoNote(ta, files) {
                const list = Array.from(files || []).filter(isImageFile);
                if (!list.length) { showToast('Solo se pueden insertar imágenes'); return; }
                showToast(list.length === 1 ? 'Procesando imagen…' : 'Procesando ' + list.length + ' imágenes…');
                const tokens = [];
                for (const f of list) {
                    const st = await storeImageFile(f);
                    if (st) tokens.push('![' + st.name.replace(/[\[\]]/g, '') + '](img:' + st.id + ')');
                }

                const len = ta.value.length;

            let noteImgTarget = null;

            // Miniaturas de las imágenes de la nota (solo se reconstruyen cuando cambian)

            function removeNoteImageToken(token) {
                const ta = notePanelText, val = ta.value, idx = val.indexOf(token);
                if (idx < 0) return;
                let s0 = idx, e0 = idx + token.length;
                const lineStart = idx === 0 ? 0 : val.lastIndexOf('\n', idx - 1) + 1;
                let lineEnd = val.indexOf('\n', e0); if (lineEnd === -1) lineEnd = val.length;
                if (val.slice(lineStart, lineEnd).trim() === token) {          // la imagen ocupa toda la línea: se quita la línea
                    s0 = lineStart; e0 = Math.min(val.length, lineEnd + 1);
                    if (lineEnd === val.length && s0 > 0) s0 -= 1;

            // Pegar o soltar imágenes dentro del editor de notas
            const hasFileDrag = (e) => !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'));
            function attachImageInsertHandlers(ta, onlyNotes) {

            // ---- Copias de seguridad e imágenes huérfanas ----
            function collectReferencedImageIds() {
                const ids = new Set();
                (function walk(items) {
                    items.forEach(it => {
                        if (it.type === 'image' && it.imageId) ids.add(it.imageId);
                        if (it.type === 'note' && it.description) parseNoteImages(it.description).forEach(im => ids.add(im.id));
                        if (it.type === 'group' && it.items) walk(it.items);
                    });

                return ids;
            }
            const blobToDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
            function dataURLToBlob(url) {
                const m = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(url || '');
                if (!m) return null;
                const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
                const arr = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                return new Blob([arr], { type: m[1] || 'application/octet-stream' });
            }
            async function restoreImportedImages(images) {
                let n = 0;
                for (const [id, im] of Object.entries(images || {})) {
                    try {
                        const blob = dataURLToBlob(im.dataUrl);
                        if (!blob) continue;
                        await imgPut({ id, blob, type: im.type || blob.type, name: im.name || 'imagen', w: im.w, h: im.h, size: blob.size, createdAt: Date.now() });
                        n++;
                    } catch (err) { /* se omite esa imagen */ }
                }
                return n;
            }
            // Borra las imágenes que ya no usa ninguna tarjeta ni nota (con 24 h de margen por si se deshace algo)
            async function gcOrphanImages() {
                if (!data.length) return;
                const referenced = collectReferencedImageIds();
                const keys = await imgAllKeys();
                for (const id of keys) {
                    if (referenced.has(id)) continue;
                    const rec = await imgGet(id);
                    if (rec && rec.createdAt && Date.now() - rec.createdAt < 24 * 3600 * 1000) continue;
                    await imgDelete(id);
                }

            // Alto de 3 líneas de descripción

                    const collapsed = descCollapsedPx(d);
                    const prev = d.style.maxHeight;
                    d.style.transition = 'none';
                    d.style.maxHeight = 'none';
                    const full = d.scrollHeight;                       // alto real del texto, sin recortar
                    d.style.maxHeight = prev;
                    d.offsetHeight;                                    // fuerza el cálculo antes de reactivar la animación
                    d.style.transition = '';
                    const more = full > collapsed + 2;
                    card.classList.toggle('desc-more', more);
                    if (!more) { card.classList.remove('desc-open'); d.style.maxHeight = ''; return; }
                    d.style.maxHeight = (card.classList.contains('desc-open') ? full : collapsed) + 'px';
                });

            // Quita mayúsculas y acentos para que "camion" encuentre "Camión"
            function normalizeText(str) {
                return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            }

            // Busca por nombre en el nivel actual y en TODAS las subcarpetas (recursivo)
            function collectSearchMatches(items, term, pathNames, pathIds, results, pathMap) {
                for (const item of items) {
                    const termOk = !term || normalizeText(item.name).includes(term) || (item.type === 'note' && normalizeText(item.description).includes(term));
                    const colorOk = !activeColorFilter || String(item.color || '').toLowerCase() === activeColorFilter;
                    if (termOk && colorOk) {
                        results.push(item);
                        pathMap.set(item.id, { names: [...pathNames], ids: [...pathIds] });
                    }
                    if (item.type === 'group' && item.items && item.items.length > 0) {
                        collectSearchMatches(item.items, term, [...pathNames, item.name], [...pathIds, item.id], results, pathMap);
                    }
                }
            }

            // Todos los grupos existentes, en orden, con su ruta
            function collectNoteGroups(items, pathNames, depth, out) {
                items.forEach(item => {
                    if (item.type !== 'group') return;
                    const names = [...pathNames, item.name];
                    out.push({ group: item, id: item.id, pathNames: names, depth });
                    collectNoteGroups(item.items || [], names, depth + 1, out);
                });
            }

            // Fijadas primero y después el orden elegido en "Ordenar"
            function sortForView(list) {
                const cmp = (a, b) => {
                    switch (currentSortPreference) {
                        case 'name_asc':  return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
                        case 'name_desc': return b.name.localeCompare(a.name, 'es', { sensitivity: 'base' });
                        case 'date_new':  return (b.createdAt || 0) - (a.createdAt || 0);
                        case 'date_old':  return (a.createdAt || 0) - (b.createdAt || 0);
                        default: return 0;
                    }
                };
                const pinned = list.filter(i => i.isPinned), rest = list.filter(i => !i.isPinned);
                if (currentSortPreference !== 'default') { pinned.sort(cmp); rest.sort(cmp); }
                return [...pinned, ...rest];
            }

            // Mover / reordenar una nota arrastrándola entre grupos
            function handleNotesSortEnd(evt) {
                const noteId = evt.item.dataset.id;
                const targetParentId = evt.to.dataset.parentId || '';
                const fromParentId = evt.from.dataset.parentId || '';
                const res = findItemRecursive(noteId);
                if (!res || res.item.type !== 'note') { render(); return; }

                res.parentArray.splice(res.index, 1);
                let targetArray = data;
                if (targetParentId) {
                    const pr = findItemRecursive(targetParentId);
                    if (pr && pr.item.type === 'group') {
                        if (!pr.item.items) pr.item.items = [];
                        targetArray = pr.item.items;
                    }
                }
                targetArray.push(res.item);

                // Las notas de ese grupo quedan en el orden en que se ven
                const orderedIds = Array.from(evt.to.querySelectorAll(':scope > .item')).map(el => el.dataset.id);
                const byId = new Map();
                targetArray.forEach(it => { if (it.type === 'note') byId.set(it.id, it); });
                const ordered = orderedIds.map(id => byId.get(id)).filter(Boolean);
                let cursor = 0;
                for (let i = 0; i < targetArray.length; i++) {
                    if (targetArray[i].type === 'note') targetArray[i] = ordered[cursor++] || targetArray[i];
                }

                if (fromParentId !== targetParentId) {
                    flashNote(noteId);
                    const tr = targetParentId ? findItemRecursive(targetParentId) : null;
                    showToast('Nota movida a «' + (tr ? tr.item.name : 'Inicio') + '»');
                }
                saveData();
                setTimeout(() => render(), 0);
            }

            // Riel de notas: todas las notas, organizadas en los grupos que ya existen
            function renderNotesRail() {
                notesSortables.forEach(sb => { try { sb.destroy(); } catch (e) {} });
                notesSortables = [];
                notesListEl.innerHTML = '';

                const q = normalizeText(currentSearchTerm.trim());
                const matchNote = n => !q || normalizeText(n.name).includes(q) || normalizeText(n.description).includes(q);

                const sections = [{ id: '', group: null, pathNames: [], notes: data.filter(i => i.type === 'note') }];
                const groups = [];
                collectNoteGroups(data, [], 0, groups);
                groups.forEach(g => sections.push({ id: g.id, group: g.group, pathNames: g.pathNames, notes: (g.group.items || []).filter(i => i.type === 'note') }));
                sections.forEach(sec => { sec.notes = sortForView(sec.notes.filter(matchNote)); });

                const total = sections.reduce((n, sec) => n + sec.notes.length, 0);
                notesRailCountEl.textContent = total ? String(total) : '';

                const visible = sections.filter(sec => sec.notes.length > 0 || (showEmptyNoteGroups && !q));
                if (visible.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'notes-rail-empty';
                    empty.textContent = q
                        ? 'No hay notas que coincidan con tu búsqueda.'
                        : 'Todavía no hay notas. Pulsa + para crear la primera' + (groups.length ? ', o el icono de carpetas para ver todos tus grupos.' : '.');
                    notesListEl.appendChild(empty);
                    renderedNoteIds = new Set();
                    return;
                }

                const currentId = getCurrentParentId() || '';
                const seenNoteIds = new Set();
                let gIndex = 0;
                visible.forEach(sec => {
                    const collapsed = notesCollapsed.has(sec.id);
                    const section = document.createElement('section');
                    section.className = 'notes-group' + (collapsed ? ' is-collapsed' : '') + (sec.id === currentId ? ' is-current' : '');
                    section.dataset.groupId = sec.id;
                    if (animateNotesRail) {
                        section.classList.add('group-enter');
                        section.style.setProperty('--g', Math.min(gIndex, 10));
                    }
                    gIndex++;
                    if (sec.group && sec.group.color) section.style.setProperty('--group-color', sec.group.color);

                    // Cabecera: nombre del grupo, dónde está, nº de notas y "+"
                    const header = document.createElement('div');
                    header.className = 'notes-group-header';
                    header.tabIndex = 0;
                    header.setAttribute('role', 'button');
                    header.setAttribute('aria-expanded', String(!collapsed));
                    header.innerHTML = '<i class="fas fa-chevron-right notes-group-chevron"></i><i class="fas ' + (sec.group ? 'fa-folder' : 'fa-home') + ' notes-group-icon"></i>';
                    const nameEl = document.createElement('span');
                    nameEl.className = 'notes-group-name';
                    nameEl.textContent = sec.group ? sec.group.name : 'Inicio';
                    header.appendChild(nameEl);
                    if (sec.pathNames.length > 1) {
                        const parentEl = document.createElement('span');
                        parentEl.className = 'notes-group-parent';
                        parentEl.textContent = 'en ' + sec.pathNames.slice(0, -1).join(' / ');
                        header.appendChild(parentEl);
                    }
                    if (sec.id === currentId) {
                        const here = document.createElement('span');
                        here.className = 'notes-group-here';
                        here.textContent = 'aquí';
                        header.appendChild(here);
                    }
                    const countEl = document.createElement('span');
                    countEl.className = 'notes-group-count';
                    countEl.textContent = sec.notes.length;
                    header.appendChild(countEl);
                    const addBtn = document.createElement('button');
                    addBtn.type = 'button';
                    addBtn.className = 'notes-group-add';
                    addBtn.title = 'Nueva nota en «' + (sec.group ? sec.group.name : 'Inicio') + '»';
                    addBtn.innerHTML = '<i class="fas fa-plus"></i>';
                    addBtn.onclick = (e) => { e.stopPropagation(); openNotePanel(null, sec.id); };
                    header.appendChild(addBtn);

                    const toggle = () => {
                        const nowCollapsed = !section.classList.contains('is-collapsed');
                        section.classList.toggle('is-collapsed', nowCollapsed);
                        header.setAttribute('aria-expanded', String(!nowCollapsed));
                        if (nowCollapsed) notesCollapsed.add(sec.id); else notesCollapsed.delete(sec.id);
                        saveNotesCollapsed();
                    };
                    header.addEventListener('click', (e) => { if (!e.target.closest('.notes-group-add')) toggle(); });
                    header.addEventListener('keydown', (e) => {
                        if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) { e.preventDefault(); toggle(); }
                    });

                    // Cuerpo: las notas del grupo (o una zona para soltar si está vacío)
                    const body = document.createElement('div');
                    body.className = 'notes-group-body';
                    const list = document.createElement('div');
                    list.className = 'notes-group-list';
                    list.dataset.parentId = sec.id;
                    let n = 0;
                    sec.notes.forEach(note => {
                        const el = createDOMElement(note, null);
                        if (!el) return;
                        if (animateNotesRail || !renderedNoteIds.has(note.id)) {
                            el.classList.add('item-enter');
                            el.style.setProperty('--i', Math.min(n, 8));
                        }
                        n++;
                        seenNoteIds.add(note.id);
                        list.appendChild(el);
                    });
                    if (sec.notes.length === 0) {
                        const ph = document.createElement('div');
                        ph.className = 'notes-group-empty';
                        ph.textContent = 'Sin notas · arrastra una aquí o pulsa +';
                        list.appendChild(ph);
                    }
                    body.appendChild(list);
                    section.appendChild(header);
                    section.appendChild(body);
                    notesListEl.appendChild(section);

                    if (typeof Sortable !== 'undefined') notesSortables.push(new Sortable(list, {
                        group: 'notes-shared',
                        animation: 220,
                        easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                        handle: '.drag-handle',
                        draggable: '.item',
                        ghostClass: 'sortable-ghost',
                        chosenClass: 'sortable-chosen',
                        dragClass: 'sortable-drag',
                        disabled: !!q,
                        onEnd: handleNotesSortEnd
                    }));
                });
                renderedNoteIds = seenNoteIds;
            }

            function render() {
                mainItemsEl.innerHTML = ''; 
                notesListEl.innerHTML = ''; 
                updateColorFilterBar();
                const currentParentId = getCurrentParentId();
                let itemsToDisplay;

                // ¿Hemos cambiado de carpeta? (para decidir qué animar y en qué dirección)
                const viewKey = currentViewStack.join('>');
                const viewChanged = viewKey !== lastViewKey;
                const viewDepth = currentViewStack.length;
                if (viewChanged && lastViewKey !== null && viewDepth > lastViewDepth) linkOrganizerEl.dataset.dir = 'in';
                else if (viewChanged && lastViewKey !== null && viewDepth < lastViewDepth) linkOrganizerEl.dataset.dir = 'out';
                else linkOrganizerEl.dataset.dir = 'none';

                breadcrumbsContainer.innerHTML = ''; 
                if (currentViewStack.length > 0) {
                    breadcrumbsContainer.classList.remove('hidden');
                    const rootLink = document.createElement('a');
                    rootLink.href = '#';
                    rootLink.innerHTML = '<i class="fas fa-home"></i>';
                    rootLink.title = "Inicio / Raíz";
                    rootLink.dataset.dropParent = '';
                    rootLink.onclick = (e) => { 
                        e.preventDefault(); 
                        currentViewStack = []; 
                        searchInputEl.value = ''; currentSearchTerm = ''; 
                        render(); 
                    };
                    breadcrumbsContainer.appendChild(rootLink);
                    for (let i = 0; i < currentViewStack.length; i++) {
                        const groupId = currentViewStack[i];
                        const groupResult = findItemRecursive(groupId); 
                        if (groupResult && groupResult.item) {
                            const separator = document.createElement('span');
                            separator.className = 'breadcrumb-separator';
                            separator.textContent = '/';
                            breadcrumbsContainer.appendChild(separator);
                            const itemName = groupResult.item.name;
                            if (i < currentViewStack.length - 1) { 
                                const groupLink = document.createElement('a');
                                groupLink.href = '#';
                                groupLink.title = itemName; 
                                groupLink.dataset.dropParent = groupId;
                                const groupLinkText = document.createElement('span');
                                groupLinkText.className = 'breadcrumb-item-text';
                                groupLinkText.textContent = itemName;
                                groupLink.appendChild(groupLinkText);
                                (function(index) { 
                                    groupLink.onclick = (e) => {
                                        e.preventDefault();
                                        currentViewStack = currentViewStack.slice(0, index + 1);
                                        searchInputEl.value = ''; currentSearchTerm = ''; 
                                        render();
                                    };
                                })(i);
                                breadcrumbsContainer.appendChild(groupLink);
                            } else { 
                                const currentGroupSpan = document.createElement('span');
                                currentGroupSpan.className = 'breadcrumb-current';
                                currentGroupSpan.title = itemName;
                                const currentGroupText = document.createElement('span');
                                currentGroupText.className = 'breadcrumb-item-text';
                                currentGroupText.textContent = itemName;
                                currentGroupSpan.appendChild(currentGroupText);
                                breadcrumbsContainer.appendChild(currentGroupSpan);
                            }
                        } else {
                            console.warn("Breadcrumb: No se pudo encontrar el grupo con ID:", groupId);
                            break; 
                        }
                    }
                } else {
                    breadcrumbsContainer.classList.add('hidden');
                }

                if (viewChanged) {
                    Array.from(breadcrumbsContainer.children).forEach((c, i) => c.style.setProperty('--c', Math.min(i, 10)));
                    breadcrumbsContainer.classList.add('crumbs-enter');
                } else {
                    breadcrumbsContainer.classList.remove('crumbs-enter');
                }

                if (currentParentId) {
                    const parentResult = findItemRecursive(currentParentId);
                    if (parentResult && parentResult.item.type === 'group') {
                        itemsToDisplay = parentResult.item.items || [];
                        backToParentBtn.classList.remove('hidden');
                    } else {
                        console.error("Render: No se pudo encontrar el grupo padre. Navegando a la raíz.");
                        currentViewStack = []; 
                        itemsToDisplay = data;
                        backToParentBtn.classList.add('hidden');
                        breadcrumbsContainer.classList.add('hidden'); 
                    }
                } else {
                    itemsToDisplay = data; 
                    backToParentBtn.classList.add('hidden');
                }

                let filteredItems = itemsToDisplay;
                const searchPaths = new Map();
                if (isFiltering()) {
                    filteredItems = [];
                    collectSearchMatches(itemsToDisplay, normalizeText(currentSearchTerm.trim()), [], [], filteredItems, searchPaths);
                }
                
                let sortedItems = [...filteredItems]; 
                const pinned = sortedItems.filter(item => item.isPinned);
                const unpinned = sortedItems.filter(item => !item.isPinned);

                const sortFunction = (a, b) => {
                    if (currentSortPreference === 'default') return 0;

                    switch (currentSortPreference) {
                        case 'name_asc':
                            return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
                        case 'name_desc':
                            return b.name.localeCompare(a.name, 'es', { sensitivity: 'base' });
                        case 'date_new':
                            return (b.createdAt || 0) - (a.createdAt || 0);
                        case 'date_old':
                            return (a.createdAt || 0) - (b.createdAt || 0);
                        default:
                            return 0; 
                    }
                };
                
                if (currentSortPreference !== 'default') {
                    pinned.sort(sortFunction);
                    unpinned.sort(sortFunction);
                }
                const itemsToRender = [...pinned, ...unpinned].filter(item => item.type !== 'note');
                const mainToRender = itemsToRender;

                linkOrganizerEl.classList.toggle('notes-open', notesRailOpen);
                notesRailEl.classList.toggle('is-open', notesRailOpen);
                notesRailEl.setAttribute('aria-hidden', String(!notesRailOpen));
                const notesToggleBtn = document.getElementById('showAddNoteModalBtn');
                if (notesToggleBtn) {
                    notesToggleBtn.classList.toggle('is-active', notesRailOpen);
                    notesToggleBtn.setAttribute('aria-expanded', String(notesRailOpen));
                }

                let enterIndex = 0;
                const renderItemsInto = (container, items) => {
                    items.forEach(item => {
                        const element = createDOMElement(item, searchPaths.get(item.id) || null);
                        if (!element) return;
                        // Anima al cambiar de carpeta y cuando aparece un elemento nuevo
                        if (viewChanged || !renderedIds.has(item.id)) {
                            element.classList.add('item-enter');
                            element.style.setProperty('--i', Math.min(enterIndex++, 14));
                        }
                        container.appendChild(element);
                    });
                };

                if (mainToRender.length === 0) {
                    const message = document.createElement('p');
                    message.className = 'no-items-message';
                    message.textContent = (isFiltering() || (itemsToDisplay.length > 0 && filteredItems.length === 0))
                        ? 'No hay enlaces ni grupos que coincidan con tu búsqueda.'
                        : 'No hay enlaces ni grupos aquí. ¡Añade algunos!';
                    mainItemsEl.appendChild(message);
                } else {
                    renderItemsInto(mainItemsEl, mainToRender);
                }

                if (notesRailOpen) {
                    renderNotesRail();
                } else {
                    notesSortables.forEach(sb => { try { sb.destroy(); } catch (e) {} });
                    notesSortables = [];
                    notesListEl.innerHTML = '';
                    renderedNoteIds = new Set();
                }
                animateNotesRail = false;
                flashNoteId = null;
                flashGroupId = null;
                requestAnimationFrame(updateDescriptionOverflow);
                hydrateImages(document);
                renderedIds = new Set(itemsToRender.map(i => i.id));
                lastViewKey = viewKey;
                lastViewDepth = viewDepth;


                updateRootVarRgbEquivalents(); 
            };
            
            backToParentBtn.onclick = () => {
                if (currentViewStack.length > 0) {
                    currentViewStack.pop(); 
                    searchInputEl.value = ''; 
                    currentSearchTerm = '';
                    render();
                }
            };
            
            // =====================================================
            //  SELECTOR DE GRUPO EN ÁRBOL
            // =====================================================
            const groupPickerEl = document.getElementById('groupPicker');
            const gp = { selected: '', current: '', excluded: [], expanded: new Set(), query: '', select: null, summaryEl: null, listEl: null, searchEl: null };

            function gpPathNames(id) {
                if (!id) return ['Inicio'];
                const det = findParentDetails(id, data);
                const ids = det ? [...det.path, id] : [id];
                return ['Inicio', ...ids.map(i => { const r = findItemRecursive(i); return r ? r.item.name : '?'; })];
            }

            function gpSelect(id) {
                gp.selected = id || '';
                if (gp.select) gp.select.value = gp.selected;
                gpRender();
            }

            function gpHighlight(name, q) {
                if (!q) return escapeHTML(name);
                const n = normalizeText(name), i = n.indexOf(q);
                if (i === -1 || n.length !== name.length) return escapeHTML(name);
                return escapeHTML(name.slice(0, i)) + '<mark>' + escapeHTML(name.slice(i, i + q.length)) + '</mark>' + escapeHTML(name.slice(i + q.length));
            }

            function gpRowHTML(opts) {
                const { id, name, depth, isRoot, hasKids, expanded, color, count, disabled } = opts;
                const row = document.createElement('div');
                row.className = 'gp-row depth-' + depth + (isRoot ? ' root' : '') + (hasKids && expanded ? ' expanded' : '')
                    + (gp.selected === id ? ' selected' : '') + (disabled ? ' disabled' : '');
                row.dataset.id = id;
                row.setAttribute('role', 'treeitem');
                row.setAttribute('aria-selected', gp.selected === id ? 'true' : 'false');
                if (disabled) row.setAttribute('aria-disabled', 'true');
                row.tabIndex = disabled ? -1 : 0;
                if (disabled) row.title = 'No puedes mover un grupo dentro de sí mismo';

                for (let d = 0; d < depth; d++) { const g = document.createElement('span'); g.className = 'gp-guide'; row.appendChild(g); }

                if (hasKids) {
                    const tg = document.createElement('button');
                    tg.type = 'button'; tg.tabIndex = -1; tg.className = 'gp-toggle';
                    tg.title = expanded ? 'Plegar' : 'Desplegar';
                    tg.innerHTML = '<i class="fas fa-chevron-right"></i>';
                    tg.onclick = (e) => { e.stopPropagation(); if (gp.expanded.has(id)) gp.expanded.delete(id); else gp.expanded.add(id); gpRender(); };
                    row.appendChild(tg);
                } else {
                    const sp = document.createElement('span'); sp.className = 'gp-toggle-spacer'; row.appendChild(sp);
                }

                const ic = document.createElement('i');
                ic.className = 'gp-icon fas ' + (isRoot ? 'fa-home' : (gp.selected === id || (hasKids && expanded) ? 'fa-folder-open' : 'fa-folder'));
                if (color) ic.style.color = color;
                row.appendChild(ic);

                const nm = document.createElement('span');
                nm.className = 'gp-name';
                nm.innerHTML = isRoot ? 'Inicio (raíz)' : gpHighlight(name, gp.query);
                row.appendChild(nm);

                if (!isRoot && typeof count === 'number' && count > 0) {
                    const b = document.createElement('span'); b.className = 'gp-badge'; b.textContent = count; b.title = count + ' elemento' + (count === 1 ? '' : 's') + ' dentro';
                    row.appendChild(b);
                }
                if (gp.current === id && !disabled) {
                    const t = document.createElement('span'); t.className = 'gp-tag'; t.textContent = 'actual'; row.appendChild(t);
                }
                if (gp.selected === id) {
                    const ck = document.createElement('i'); ck.className = 'fas fa-check gp-check'; row.appendChild(ck);
                }

                if (!disabled) {
                    row.onclick = () => gpSelect(id);
                    if (hasKids) row.ondblclick = () => { if (gp.expanded.has(id)) gp.expanded.delete(id); else gp.expanded.add(id); gpRender(); };
                }
                return row;
            }

            function gpRender() {
                if (!gp.listEl) return;
                const q = normalizeText(gp.query.trim());

                // Resumen del destino
                const changed = gp.selected !== gp.current;
                gp.summaryEl.className = 'gp-summary' + (changed ? ' changed' : '');
                gp.summaryEl.innerHTML = (changed ? '<i class="fas fa-arrow-right"></i><span>Se moverá a:</span>' : '<i class="fas fa-map-marker-alt"></i><span>Ubicación actual:</span>')
                    + '<span class="gp-path">' + gpPathNames(gp.selected).map(escapeHTML).join(' / ') + '</span>';

                // ¿qué ramas se muestran con el filtro?
                const subtreeMatches = (item) => item.type === 'group' && !gp.excluded.includes(item.id) &&
                    (normalizeText(item.name).includes(q) || (item.items || []).some(subtreeMatches));

                const frag = document.createDocumentFragment();
                let shown = 0;
                if (!q) frag.appendChild(gpRowHTML({ id: '', name: 'Inicio', depth: 0, isRoot: true, hasKids: false }));

                (function walk(items, depth) {
                    items.forEach(item => {
                        if (item.type !== 'group') return;
                        const disabled = gp.excluded.includes(item.id);
                        if (q && !disabled && !subtreeMatches(item)) return;
                        if (q && disabled) return;
                        const kids = disabled ? [] : (item.items || []).filter(i => i.type === 'group');
                        const expanded = q ? true : gp.expanded.has(item.id);
                        frag.appendChild(gpRowHTML({
                            id: item.id, name: item.name, depth, hasKids: kids.length > 0, expanded,
                            color: item.color, count: (item.items || []).length, disabled
                        }));
                        shown++;
                        if (kids.length > 0 && expanded) walk(kids, depth + 1);
                    });
                })(data, 0);

                gp.listEl.innerHTML = '';
                if (q && shown === 0) {
                    const e = document.createElement('div'); e.className = 'gp-empty'; e.textContent = 'Ningún grupo coincide con la búsqueda.';
                    gp.listEl.appendChild(e);
                } else if (!q && shown === 0) {
                    gp.listEl.appendChild(frag);
                    const e = document.createElement('div'); e.className = 'gp-empty'; e.textContent = 'Todavía no hay grupos. Crea uno desde el botón de carpeta.';
                    gp.listEl.appendChild(e);
                } else {
                    gp.listEl.appendChild(frag);
                }
            }

            function initGroupPicker(selectElement, currentParentId, excludedIds = []) {
                gp.select = selectElement;
                gp.current = currentParentId || '';
                gp.selected = gp.current;
                gp.excluded = excludedIds;
                gp.query = '';
                gp.expanded = new Set();
                if (gp.current) {
                    const det = findParentDetails(gp.current, data);
                    if (det) det.path.forEach(id => gp.expanded.add(id));
                }

                groupPickerEl.innerHTML = '';
                gp.summaryEl = document.createElement('div');
                groupPickerEl.appendChild(gp.summaryEl);

                let groupCount = 0;
                (function count(items) { items.forEach(i => { if (i.type === 'group') { groupCount++; if (i.items) count(i.items); } }); })(data);
                gp.searchEl = null;
                if (groupCount > 6) {
                    const wrap = document.createElement('div');
                    wrap.className = 'gp-search-wrap';
                    wrap.innerHTML = '<i class="fas fa-search"></i><input type="search" class="gp-search" placeholder="Buscar grupo..." autocomplete="off">';
                    gp.searchEl = wrap.querySelector('input');
                    gp.searchEl.addEventListener('input', () => { gp.query = gp.searchEl.value; gpRender(); });
                    groupPickerEl.appendChild(wrap);
                }

                gp.listEl = document.createElement('div');
                gp.listEl.className = 'gp-list';
                gp.listEl.setAttribute('role', 'tree');
                gp.listEl.addEventListener('keydown', (e) => {
                    const row = e.target.closest('.gp-row');
                    if (!row) return;
                    const rows = Array.from(gp.listEl.querySelectorAll('.gp-row:not(.disabled)'));
                    const i = rows.indexOf(row);
                    if (e.key === 'ArrowDown') { e.preventDefault(); if (rows[i + 1]) rows[i + 1].focus(); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); if (rows[i - 1]) rows[i - 1].focus(); }
                    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gpSelect(row.dataset.id); const again = gp.listEl.querySelector('.gp-row[data-id="' + row.dataset.id + '"]'); if (again) again.focus(); }
                    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && row.dataset.id) {
                        const open = e.key === 'ArrowRight';
                        if (open) gp.expanded.add(row.dataset.id); else gp.expanded.delete(row.dataset.id);
                        gpRender();
                        const again = gp.listEl.querySelector('.gp-row[data-id="' + row.dataset.id + '"]'); if (again) again.focus();
                    }
                });
                groupPickerEl.appendChild(gp.listEl);

                gpRender();
                // llevar la ubicación actual a la vista
                requestAnimationFrame(() => {
                    const sel = gp.listEl && gp.listEl.querySelector('.gp-row.selected');
                    if (sel) gp.listEl.scrollTop = Math.max(0, sel.offsetTop - 60);
                });
            }

            function populateGroupSelector(selectElement, currentParentIdOfItem, excludedIds = []) {
                selectElement.innerHTML = ''; 
                const rootOption = document.createElement('option');
                rootOption.value = ''; 
                rootOption.textContent = 'Inicio (Raíz)'; 
                if (currentParentIdOfItem === null || currentParentIdOfItem === '') {
                    rootOption.selected = true;
                }
                selectElement.appendChild(rootOption);
                const indentUnit = '\u00A0\u00A0\u00A0'; 
                function addGroupOptionsRecursive(groupsToScan, indentLevel) {
                    groupsToScan.forEach(item => {
                        if (item.type === 'group') {
                            const option = document.createElement('option');
                            option.value = item.id;
                            option.textContent = indentUnit.repeat(indentLevel) + item.name; 
                            if (indentLevel === 0) { option.style.fontWeight = 'bold'; } 
                            else { option.style.fontWeight = 'normal'; }
                            if (item.id === currentParentIdOfItem) { option.selected = true; }
                            if (excludedIds.includes(item.id)) { option.disabled = true; }
                            selectElement.appendChild(option);
                            if (item.items && item.items.length > 0 && !excludedIds.includes(item.id)) {
                                addGroupOptionsRecursive(item.items, indentLevel + 1);
                            }
                        }
                    });
                }
                addGroupOptionsRecursive(data, 0); 
                initGroupPicker(selectElement, currentParentIdOfItem, excludedIds);
            }

            function openModal(type, id = null, explicitParentId = null, forceModal = false) {
                if (type === 'note' && !forceModal) { openNotePanel(id, explicitParentId); return; }
                mainMenuDropdown.classList.remove('show'); 
                modalItemType.value = type;
                modalItemId.value = id || '';
                
                const actualParentId = explicitParentId !== null ? explicitParentId : getCurrentParentId();
                modalParentIdInput.value = actualParentId || '';

                modalUrlContainer.style.display = 'none';
                modalDescriptionContainer.style.display = 'none';
                modalMoveToGroupContainer.style.display = 'none'; 
                
                // Reset labels
                modalNameLabel.textContent = "Nombre:";
                modalDescriptionLabel.textContent = "Descripción:";

                if (id) { // Editing an existing item
                    const result = findItemRecursive(id);
                    if (!result) return;
                    
                    modalItemName.value = result.item.name;

                    if (type === 'link') {
                        modalTitle.textContent = "Editar Enlace";
                        modalItemUrl.value = result.item.url;
                        modalItemDescription.value = result.item.description || '';
                        modalUrlContainer.style.display = 'block';
                        modalDescriptionContainer.style.display = 'block';
                        
                        modalMoveToGroupContainer.style.display = 'block';

                const isLight = document.documentElement.classList.contains('light-mode');

                return isLight ? colorDef.defaultLight : colorDef.defaultDark;

            function applyCustomColorsToDOM(colors) {
                if (!colors) return;
                customizableColorVariables.forEach(config => {
                    if (colors[config.varName]) {
                        document.documentElement.style.setProperty(config.varName, colors[config.varName]);
                    } else {
                        document.documentElement.style.removeProperty(config.varName);
                    }
                });
                updateRootVarRgbEquivalents(); 
            }

            function loadAndApplyCustomColors() {
                const storedColors = localStorage.getItem(CUSTOM_COLORS_STORAGE_KEY);
                const parsedColors = storedColors ? JSON.parse(storedColors) : null;
                
                customizableColorVariables.forEach(config => {
                    document.documentElement.style.removeProperty(config.varName);
                });
                
                if (parsedColors) {
                    applyCustomColorsToDOM(parsedColors);
                }
                updateRootVarRgbEquivalents(); 
                return parsedColors;
            }

                    input.value = currentCustomColors[config.varName] || getThemeDefaultColor(config.varName);

            function hideContextMenu() { if (customContextMenuEl) customContextMenuEl.style.display = 'none'; }
            function assignNewIdsRecursive(itemsToProcess) { 
                return itemsToProcess.map(originalItem => {
                    const newItem = { ...originalItem, id: generateId(), createdAt: Date.now() }; 
                    if (originalItem.isPinned === undefined) newItem.isPinned = false; 
                    if (newItem.type === 'group' && newItem.items && newItem.items.length > 0) {
                        newItem.items = assignNewIdsRecursive(newItem.items);
                    }
                    return newItem;
                });
            }
