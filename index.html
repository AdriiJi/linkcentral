                const action = targetLi.dataset.action;
                const itemId = targetLi.dataset.itemId;
                hideContextMenu();

                if (action === 'toggle-pin') togglePinItem(itemId); 
                else if (action === 'edit-link') openModal('link', itemId);
                else if (action === 'edit-note') openModal('note', itemId);
                else if (action === 'edit-image') { openModal('image', itemId); }
                else if (action === 'open-image') {
                    const list = lightboxListFromGrid();
                    openLightbox(list, Math.max(0, list.findIndex(x => x.cardId === itemId)));
                }
                else if (action === 'download-image') {
                    const r = findItemRecursive(itemId);
                    if (r) downloadImageById(r.item.imageId, r.item.name);
                }
                else if (action === 'delete-image') { if (confirm('¿Estás seguro de que quieres eliminar esta imagen?')) deleteItem(itemId); }
                else if (action === 'copy-link-url') copyText(targetLi.dataset.url || '', 'URL copiada');
                else if (action === 'copy-note-text') copyText(targetLi.dataset.description || '', 'Texto copiado');
                else if (action === 'delete-link') if (confirm('¿Estás seguro de que quieres eliminar este enlace?')) deleteItem(itemId);
                else if (action === 'delete-note') if (confirm('¿Estás seguro de que quieres eliminar esta nota?')) deleteItem(itemId);
                else if (action === 'copy-item') {
                    const itemTypeToCopy = targetLi.dataset.itemType; 
                    if (['link', 'group', 'note'].includes(itemTypeToCopy)) {
                        const result = findItemRecursive(itemId);
                        if (result) { copiedItemData = JSON.parse(JSON.stringify(result.item)); copiedItemType = itemTypeToCopy; }
                    }
                } else if (action === 'paste-item' || action === 'paste-item-into-group') { 
                    if (!copiedItemData || !['link', 'group', 'note'].includes(copiedItemType)) return;
                    
                    const itemToPaste = JSON.parse(JSON.stringify(copiedItemData)); 
                    const [pastedItemWithNewIds] = assignNewIdsRecursive([itemToPaste]); 
                    
                    let actualPasteParentId;
                    if (action === 'paste-item-into-group') {
                        actualPasteParentId = targetLi.dataset.targetGroupId;
                    } else { 
                        actualPasteParentId = getCurrentParentId(); 
                    }
                    addItem(

                        (pastedItemWithNewIds.type === 'link' || pastedItemWithNewIds.type === 'note') ? pastedItemWithNewIds.description : null,
                        pastedItemWithNewIds.color
                    );
                } else if (action === 'edit-group') openModal('group', itemId);
                else if (action === 'delete-group') if (confirm('¿Estás seguro de que quieres eliminar este grupo y todo su contenido?')) deleteItem(itemId);
                else if (action === 'go-up-level') {

            async function exportAllData() {
                mainMenuDropdown.classList.remove('show'); hideContextMenu();
                const currentTheme = localStorage.getItem('linkCentralTheme') || 'dark';
                const customColors = JSON.parse(localStorage.getItem(CUSTOM_COLORS_STORAGE_KEY) || '{}');
                const sortPref = currentSortPreference; 
                const exportObject = {
                    version: "2.2.0-images", 
                    linkData: data,
                    theme: currentTheme, 
                    customColors: customColors,
                    sortPreference: sortPref 
                };
                // Las imágenes (guardadas aparte, en IndexedDB) viajan dentro de la copia de seguridad
                const images = {};
                for (const id of collectReferencedImageIds()) {
                    const rec = await imgGet(id);
                    if (rec && rec.blob) images[id] = { name: rec.name, type: rec.type, w: rec.w, h: rec.h, dataUrl: await blobToDataURL(rec.blob) };
                }
                if (Object.keys(images).length) exportObject.images = images;
                const dataStr = JSON.stringify(exportObject, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                let linkElement = document.createElement('a');
                linkElement.setAttribute('href', url); linkElement.setAttribute('download', 'copia_seguridad_linkcentral.json');
                document.body.appendChild(linkElement); linkElement.click(); linkElement.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                alert('¡Datos exportados!' + (Object.keys(images).length ? ' (incluye ' + Object.keys(images).length + ' imagen' + (Object.keys(images).length === 1 ? '' : 'es') + ')' : ''));
            }
            function importAllData(event) {
                mainMenuDropdown.classList.remove('show'); hideContextMenu();
                const file = event.target.files[0]; if (!file) return;
                if (!confirm('Importar datos sobrescribirá TODOS los datos y configuraciones actuales de enlaces/grupos. ¿Estás seguro?')) {
                    event.target.value = null; return;
                }
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!imported || typeof imported.linkData === 'undefined') { 
                            alert('Error: Formato de archivo no válido o faltan linkData.'); return;
                        }
                        if (imported.images) await restoreImportedImages(imported.images);
                        data = imported.linkData || [];
                        ensureItemProperties(data); 
                        saveData();
                        
                        const themeToApply = imported.theme === 'light' ? 'light' : 'dark';
                        localStorage.setItem('linkCentralTheme', themeToApply);
                        if (imported.customColors && Object.keys(imported.customColors).length > 0) {
                            localStorage.setItem(CUSTOM_COLORS_STORAGE_KEY, JSON.stringify(imported.customColors));
                        } else { localStorage.removeItem(CUSTOM_COLORS_STORAGE_KEY); }
                        
                        if (imported.sortPreference) {
                            currentSortPreference = imported.sortPreference;
                            localStorage.setItem(SORT_PREF_KEY, currentSortPreference);
                            sortOptionsEl.value = currentSortPreference;
                        } else { 
                             currentSortPreference = 'default'; 
                             localStorage.setItem(SORT_PREF_KEY, currentSortPreference);
                             sortOptionsEl.value = currentSortPreference;
                        }

                        currentViewStack = []; 
                        searchInputEl.value = ''; currentSearchTerm = ''; 
                        currentApplyInitialThemeFn(); 
                        render(); 
                        alert('¡Datos importados correctamente!');
                    } catch (error) {
                        console.error("Error al importar datos:", error);
                        alert('Error al importar datos: ' + error.message);
                    } finally { event.target.value = null; } 
                };
                reader.onerror = function() { alert('Error al leer el archivo.'); event.target.value = null; };
                reader.readAsText(file);
            }
            
            document.getElementById('showAddLinkModalBtn').onclick = () => openModal('link', null, getCurrentParentId()); 
            document.getElementById('showAddNoteModalBtn').onclick = () => toggleNotesRail();
            document.getElementById('closeNotesRailBtn').onclick = () => setNotesRailOpen(false);
            document.getElementById('addNoteBtn').onclick = () => openNotePanel(null, getCurrentParentId());
            const toggleEmptyGroupsBtn = document.getElementById('toggleEmptyGroupsBtn');
            const syncEmptyGroupsBtn = () => {
                toggleEmptyGroupsBtn.setAttribute('aria-pressed', String(showEmptyNoteGroups));
                toggleEmptyGroupsBtn.title = showEmptyNoteGroups ? 'Ocultar los grupos sin notas' : 'Mostrar todos los grupos (para organizar)';
            };
            syncEmptyGroupsBtn();
            toggleEmptyGroupsBtn.onclick = () => {
                showEmptyNoteGroups = !showEmptyNoteGroups;
                try { localStorage.setItem('linkcentral_notes_all_groups', showEmptyNoteGroups ? '1' : '0'); } catch (e) {}
                syncEmptyGroupsBtn();
                animateNotesRail = true;
                render();
            };
            document.getElementById('showAddGroupModalBtn').onclick = () => openModal('group', null, getCurrentParentId()); 
            if (exportDataBtn) exportDataBtn.onclick = exportAllData;
            if (importFileEl) importFileEl.onchange = importAllData; 

            searchInputEl.addEventListener('input', (e) => {
                currentSearchTerm = e.target.value;
                render();
            });
            searchInputEl.addEventListener('search', (e) => { 
                if (!e.target.value) {
                    currentSearchTerm = '';
                    render();
                }
            });

            sortOptionsEl.addEventListener('change', (e) => {
                currentSortPreference = e.target.value;
                localStorage.setItem(SORT_PREF_KEY, currentSortPreference);
                render();
            });
            
            [itemModal, colorCustomizationModal].forEach(modalInstance => {
                if (modalInstance) {
                    modalInstance.addEventListener('click', (event) => {
                        let dismissSelector = '[data-dismiss="modal"]';
                        if (event.target === modalInstance || (dismissSelector && event.target.closest(dismissSelector))) {
                            if (modalInstance === itemModal) closeModal();
                            else if (modalInstance === colorCustomizationModal) closeColorCustomizationModal();
                        }
                    });
                }
            });
            document.addEventListener('keydown', (event) => { 
                if (event.key === 'Escape') {
                    if (customContextMenuEl.style.display === 'block') hideContextMenu();
                    else if (mainMenuDropdown.classList.contains('show')) mainMenuDropdown.classList.remove('show');
                    else if (itemModal.style.display === 'block') closeModal();
                    else if (noteState) closeNotePanel();
                    else if (colorCustomizationModal && colorCustomizationModal.style.display === 'block') closeColorCustomizationModal();
                    else if (currentSearchTerm && document.activeElement !== searchInputEl) { 
                        searchInputEl.value = '';
                        currentSearchTerm = '';
                        render();
                        searchInputEl.blur(); 
                    }
                    else if (currentViewStack.length > 0 && !backToParentBtn.classList.contains('hidden') && !dnd.active) { 
                        backToParentBtn.click();
                    }
                }
            });

            // Efecto onda al pulsar una tarjeta
            linkOrganizerEl.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;
                const wrapper = e.target.closest('.item-content-wrapper');
                const card = wrapper && wrapper.closest('.item');
                if (!card) return;
                const rect = card.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 2;
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                card.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            });

            buildColorSwatches();
            currentApplyInitialThemeFn(); 
            loadData(); 
        });
    </script>
</body>
</html>
