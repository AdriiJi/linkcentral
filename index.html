            transition: background-color .2s, transform .25s var(--ease-spring);
        }
        .link-item.desc-more .desc-toggle { display: inline-flex; align-items: center; gap: 6px; }
        .desc-toggle:hover, .desc-toggle:focus-visible { background: var(--accent-primary-transparent); transform: translateY(-1px); }
        .desc-toggle:active { transform: scale(.94); }
        .desc-toggle i { font-size: .8em; transition: transform .35s var(--ease-spring); }
        .link-item.desc-open .desc-toggle i { transform: rotate(180deg); }
        .desc-toggle .dt-less { display: none; }
        .link-item.desc-open .desc-toggle .dt-more { display: none; }
        .link-item.desc-open .desc-toggle .dt-less { display: inline; }

        /* =====================================================
           IMÁGENES: tarjetas, notas, visor
           ===================================================== */
        /* --- Tarjeta de imagen suelta --- */
        .image-item { min-height: 150px; }
        .image-item .image-wrapper {
            position: absolute; inset: 0; padding: 0;
            background: var(--bg-primary); overflow: hidden; cursor: zoom-in;
        }
        .image-item .image-ph {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 2em; color: var(--text-secondary); opacity: .35;
        }
        .image-item-img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0;
            transition: opacity .4s, transform .6s var(--ease-out);
        }
        .image-item-img.loaded { opacity: 1; }
        .image-item:hover .image-item-img { transform: scale(1.07); }
        .image-item-caption {
            position: absolute; left: 0; right: 0; bottom: 0;
            padding: 30px 12px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,.78));
            color: #fff; font-weight: 600; font-size: .9em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            pointer-events: none;
        }
        .image-item .item-actions-container { background-color: rgba(0,0,0,.55); z-index: 3; }
        .image-item .item-actions-container button { color: #fff; }
        .image-item .drag-handle { z-index: 3; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }

        /* --- Imágenes dentro de las notas --- */
        .note-img-block { margin: 6px 0; }
        .note-img {
            display: block; max-width: 100%; max-height: 360px; object-fit: contain;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: rgba(127,127,127,.1); cursor: zoom-in;
            opacity: 0; transition: opacity .3s, transform .3s var(--ease-spring);
        }
        .note-img:hover { transform: scale(1.01); }
        .note-preview .note-img { max-height: 96px; }
        .note-inline-img { height: 1.5em; vertical-align: middle; border-radius: 4px; cursor: zoom-in; opacity: 0; transition: opacity .3s; }
        .note-img.loaded, .note-inline-img.loaded { opacity: 1; }
        .img-missing {
            opacity: 1 !important; min-width: 70px; min-height: 44px;
            background: repeating-linear-gradient(45deg, rgba(127,127,127,.18), rgba(127,127,127,.18) 6px, transparent 6px, transparent 12px);
        }

        /* Miniaturas de las imágenes de la nota (modo Editar) */
        .note-img-strip { display: flex; flex-wrap: wrap; gap: 10px; padding: 2px 0 4px; }
        .note-img-strip[hidden] { display: none; }
        .note-panel.mode-view .note-img-strip { display: none; }
        .nis-item { position: relative; }
        .nis-item img {
            display: block; width: 64px; height: 64px; object-fit: cover;
            border-radius: 8px; border: 1px solid var(--border-color); cursor: zoom-in;
            opacity: 0; transition: opacity .3s, transform .25s var(--ease-spring);
        }
        .nis-item img.loaded { opacity: 1; }
        .nis-item img:hover { transform: scale(1.06); }
        .nis-remove {
            position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; padding: 0;
            border: 0; border-radius: 50%; background: var(--danger); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: .65em; cursor: pointer;
            opacity: 0; transform: scale(.6);
            transition: opacity .2s, transform .25s var(--ease-spring);
        }
        .nis-item:hover .nis-remove, .nis-remove:focus-visible { opacity: 1; transform: scale(1); }

        /* --- Aviso al arrastrar archivos desde el escritorio --- */
        body.is-dropping-files::before {
            content: 'Suelta las imágenes para añadirlas';
            position: fixed; inset: 14px; z-index: 3500;
            display: flex; align-items: center; justify-content: center;
            border: 3px dashed var(--accent-primary); border-radius: 18px;
            background: rgba(24,27,40,.82); color: var(--text-primary);
            font-size: 1.3em; font-weight: 600;
            pointer-events: none; animation: fadeIn .2s;
        }

        /* --- Visor a pantalla completa --- */
        .lightbox {
            position: fixed; inset: 0; z-index: 4000;
            display: flex; align-items: center; justify-content: center;
            visibility: hidden; opacity: 0;
            transition: opacity .25s, visibility 0s .25s;
        }
        .lightbox.open { visibility: visible; opacity: 1; transition: opacity .25s; }
        .lb-backdrop { position: absolute; inset: 0; background: rgba(8,10,16,.9); backdrop-filter: blur(6px); }
        .lb-figure {
            position: relative; margin: 0; max-width: 92vw; max-height: 92vh;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            transform: scale(.92); transition: transform .4s var(--ease-spring);
        }
        .lightbox.open .lb-figure { transform: none; }
        #lbImg {
            display: block; max-width: 92vw; max-height: calc(100vh - 160px); object-fit: contain;
            border-radius: 8px; box-shadow: 0 24px 70px rgba(0,0,0,.65);
            opacity: 0; transition: opacity .25s;
        }
        #lbImg.loaded { opacity: 1; }
        .lb-caption { max-width: 80vw; text-align: center; color: #e8e9ef; font-size: .95em; min-height: 1.2em; }
        .lb-btn {
            position: absolute; z-index: 2; width: 44px; height: 44px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            border: 0; border-radius: 50%;
            background: rgba(255,255,255,.12); color: #fff; font-size: 1.05em;
            cursor: pointer; text-decoration: none;
            transition: background-color .2s, transform .25s var(--ease-spring);
        }
        .lb-btn:hover { background: rgba(255,255,255,.26); transform: scale(1.1); }
        .lb-close { top: 18px; right: 18px; }
        .lb-download { top: 18px; right: 72px; }
        .lb-prev { left: 18px; top: 50%; margin-top: -22px; }
        .lb-next { right: 18px; top: 50%; margin-top: -22px; }
        .lightbox.lb-single .lb-prev, .lightbox.lb-single .lb-next { display: none; }
        .lb-counter { position: absolute; z-index: 2; top: 30px; left: 24px; color: #cfd2dd; font-size: .85em; }
        body.lb-open { overflow: hidden; }

    </style>
</head>

            const toastEl = document.getElementById('toast');


            const STORAGE_KEY = 'linkCentralData_v2'; 
            const SORT_PREF_KEY = 'linkCentralSortPref_v1'; 
            let data = [];
            let currentViewStack = []; 
            let sortableInstances = []; 
            let currentSearchTerm = ''; 
            // Estado para animar solo lo que cambia (no todo en cada pulsación)
            let lastViewKey = null;
            let lastViewDepth = 0;
            let renderedIds = new Set();
            let currentSortPreference = localStorage.getItem(SORT_PREF_KEY) || 'default'; 
            let notesRailOpen = false;
            // Notas agrupadas: estado del riel
            let notesCollapsed = new Set();
            try { notesCollapsed = new Set(JSON.parse(localStorage.getItem('linkcentral_notes_collapsed') || '[]')); } catch (e) {}
            let showEmptyNoteGroups = false;
            try { showEmptyNoteGroups = localStorage.getItem('linkcentral_notes_all_groups') === '1'; } catch (e) {}
            let notesSortables = [];
            let renderedNoteIds = new Set();
            let animateNotesRail = false;      // true al abrir el riel: anima grupos y notas
            let flashNoteId = null;            // nota que acaba de moverse: destello

            const customContextMenuEl = document.getElementById('customContextMenu');
            let copiedItemData = null; 
            let copiedItemType = null;  
            let contextMenuMouseX = 0;
            let contextMenuMouseY = 0;

            let flashGroupId = null;           // tarjeta que acaba de moverse o recibir algo: destello
            const expandedDescIds = new Set(); // enlaces cuya descripción está desplegada
            
            function getCurrentParentId() {
                return currentViewStack.length > 0 ? currentViewStack[currentViewStack.length - 1] : null;
            }
            
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }

            function updateRootVarRgbEquivalents() {
                 const bgSecondaryHex = getComputedStyle(document.documentElement).getPropertyValue('--bg-secondary').trim();
                 const rgb = hexToRgb(bgSecondaryHex);
                 if (rgb) {
                    document.documentElement.style.setProperty('--bg-secondary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
                 }
            }

            function generateId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 7); }
            function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
            function loadData() {
                const stored = localStorage.getItem(STORAGE_KEY);
                data = stored ? JSON.parse(stored) : [];
                ensureItemProperties(data); 
                currentViewStack = []; 
                sortOptionsEl.value = currentSortPreference; 
                render();
            }

            function ensureItemProperties(itemsArray) {
                itemsArray.forEach(item => {
                    if (typeof item.createdAt === 'undefined') {
                        item.createdAt = Date.now() - Math.floor(Math.random() * 1000 * 60 * 60 * 24 * 30); 
                    }
                    if (typeof item.isPinned === 'undefined') {
                        item.isPinned = false;
                    }
                    if ((item.type === 'link' || item.type === 'note') && typeof item.description === 'undefined') {
                        item.description = '';
                    }
                    if (item.type === 'group') {
                        if (item.items) {
                            ensureItemProperties(item.items);
                        } else {
                            item.items = []; 
                        }
                    }
                });
            }


            function findItemRecursive(itemId, itemsArrayToSearchIn = data) {
                for (let i = 0; i < itemsArrayToSearchIn.length; i++) {
                    const item = itemsArrayToSearchIn[i];
                    if (item.id === itemId) return { item, parentArray: itemsArrayToSearchIn, index: i };
                    if (item.type === 'group' && item.items) {
                        const found = findItemRecursive(itemId, item.items);
                        if (found) return found;
                    }
                }
                return null;
            }

            function findParentDetails(itemId, currentDataToSearch = data, parentId = null, path = []) {
                for (let item of currentDataToSearch) {
                    if (item.id === itemId) {
                        return { parentId: parentId, itemData: item, path: [...path] }; 
                    }
                    if (item.type === 'group' && item.items) {
                        const found = findParentDetails(itemId, item.items, item.id, [...path, item.id]);
                        if (found) return found;
                    }
                }
                return null; 
            }

            function getDescendantIds(parentId) {
                let descendantIds = [];
                const parentResult = findItemRecursive(parentId); 
                
                if (parentResult && parentResult.item && parentResult.item.type === 'group' && parentResult.item.items) {
                    function recurse(currentItems) {
                        for (const item of currentItems) {
                            descendantIds.push(item.id);
                            if (item.type === 'group' && item.items) {
                                recurse(item.items);
                            }
                        }
                    }
                    recurse(parentResult.item.items);
                }
                return descendantIds;
            }


            function addItem(type, name, url, parentId, customId = null, isCollapsed = undefined, itemsArray = null, description = null, color = null) {
                const newItem = { 
                    id: customId || generateId(), 
                    type, 
                    name, 
                    isCollapsed: type === 'group' ? (isCollapsed === undefined ? false : isCollapsed) : undefined,
                    createdAt: Date.now(), 
                    isPinned: false
                };
                if (color) newItem.color = String(color).toLowerCase();
                if (type === 'link') {
                    newItem.url = (url && !url.startsWith('http://') && !url.startsWith('https://')) ? `http://${url}` : url;
                    newItem.description = description || '';
                } else if (type === 'note') {
                    // Notes don't need URL, but they use description
                    newItem.description = description || '';
                    newItem.updatedAt = Date.now();
                } else { 
                    newItem.items = itemsArray || []; 
                }

                if (parentId) {
                    const parentResult = findItemRecursive(parentId);
                    if (parentResult && parentResult.item.type === 'group') {
                        if (!parentResult.item.items) parentResult.item.items = []; 
                        parentResult.item.items.push(newItem);
                    } else { 
                        console.warn("addItem: Padre no encontrado o no es un grupo, añadiendo a la raíz. ParentID:", parentId);
                        data.push(newItem); 
                    }
                } else {
                    data.push(newItem);
                }
                saveData();
                render(); 
                mainMenuDropdown.classList.remove('show'); 
            }

            function editItem(id, newName, newUrl, newDescription, newParentIdForItem = undefined, newColor = undefined) {
                const result = findItemRecursive(id);
                if (!result) {
                    console.error("editItem: Elemento no encontrado", id);
                    return;
                }

                const itemToEdit = result.item;
                const oldParentArray = result.parentArray;
                const oldIndex = result.index;

                itemToEdit.name = newName; 
                if (newColor !== undefined) {
                    if (newColor) itemToEdit.color = String(newColor).toLowerCase();
                    else delete itemToEdit.color;
                }

                if (itemToEdit.type === 'link') {
                    itemToEdit.url = (newUrl && !newUrl.startsWith('http://') && !newUrl.startsWith('https://')) ? `http://${newUrl}` : newUrl;
                    itemToEdit.description = newDescription || '';
                } else if (itemToEdit.type === 'note') {
                    if ((newDescription || '') !== (itemToEdit.description || '')) itemToEdit.updatedAt = Date.now();
                    itemToEdit.description = newDescription || '';
                } else if (itemToEdit.type === 'image') {
                    itemToEdit.description = newDescription || '';
                }

                const currentParentDetails = findParentDetails(id, data); 
                const currentParentId = currentParentDetails ? currentParentDetails.parentId : null;
                const effectiveNewParentId = (newParentIdForItem === '') ? null : newParentIdForItem;

                if (newParentIdForItem !== undefined && effectiveNewParentId !== currentParentId) {
                    if (itemToEdit.type === 'group') {
                        if (effectiveNewParentId === itemToEdit.id) {
                            alert("Un grupo no puede ser movido dentro de sí mismo.");
                            return; 
                        }
                        if (effectiveNewParentId) { 
                            const descendantsOfThisGroup = getDescendantIds(itemToEdit.id);
                            if (descendantsOfThisGroup.includes(effectiveNewParentId)) {
                                alert("Un grupo no puede ser movido dentro de uno de sus propios subgrupos.");
                                return; 
                            }
                        }
                    }
                    
                    oldParentArray.splice(oldIndex, 1);

                    if (effectiveNewParentId === null) { 
                        data.push(itemToEdit);
                    } else {
                        const newParentResult = findItemRecursive(effectiveNewParentId);
                        if (newParentResult && newParentResult.item.type === 'group') {
                            if (!newParentResult.item.items) newParentResult.item.items = [];
                            newParentResult.item.items.push(itemToEdit);
                        } else {
                            console.warn("editItem (mover): Nuevo padre no encontrado o no es un grupo. Moviendo a la raíz como alternativa.", effectiveNewParentId);
                            data.push(itemToEdit); 
                        }
                    }
                }
                if (itemToEdit.type === 'note' && newParentIdForItem !== undefined && effectiveNewParentId !== currentParentId) flashNote(itemToEdit.id);
                saveData();
                render();
            }


            function deleteItem(itemId) {
                function removeItem(id, arr) {
                    for (let i = 0; i < arr.length; i++) {
                        if (arr[i].id === id) { arr.splice(i, 1); return true; }
                        if (arr[i].type === 'group' && arr[i].items && removeItem(id, arr[i].items)) return true;
                    }
                    return false;
                }
                removeItem(itemId, data);
                saveData();
                render();
                closeNotePanelIfGone();
            }

            function togglePinItem(itemId) {
                const result = findItemRecursive(itemId);
                if (result && result.item) {
                    result.item.isPinned = !result.item.isPinned;
                    saveData();
                    render();
                }
            }

            function openAllLinksInGroup(groupId) {
                const groupResult = findItemRecursive(groupId);
                if (groupResult && groupResult.item.type === 'group' && groupResult.item.items) {
                    const linksToOpen = groupResult.item.items.filter(item => item.type === 'link' && item.url);
                    if (linksToOpen.length === 0) {
                        alert("Este grupo no contiene enlaces para abrir.");
                        return;
                    }
                    if (linksToOpen.length > 5) { 
                        if (!confirm(`Esto abrirá ${linksToOpen.length} enlaces en nuevas pestañas. ¿Continuar?`)) {
                            return;
                        }
                    }
                    linksToOpen.forEach(link => {
                        window.open(link.url, '_blank', 'noopener,noreferrer');
                    });
                }
            }


            // =====================================================
            //  ARRASTRAR Y SOLTAR
            //  Las tarjetas NO se mueven mientras arrastras: solo una copia sigue al puntero,
            //  el destino se resalta y, al ordenar, una línea marca dónde caerá.
            // =====================================================
            const dnd = {
                pending: null, active: false, itemId: '', sourceEl: null,
                ghost: null, indicator: null, hlEl: null,
                offX: 0, offY: 0, x: 0, y: 0, raf: 0, suppressClick: false
            };

            function canDropInto(itemId, targetParentId) {
                const it = findItemRecursive(itemId);
                if (!it) return false;
                if (!targetParentId) return true;                              // Inicio
                const tg = findItemRecursive(targetParentId);
                if (!tg || tg.item.type !== 'group') return false;
                if (itemId === targetParentId) return false;
                if (it.item.type === 'group' && getDescendantIds(itemId).includes(targetParentId)) return false;
                return true;
            }

            // Zonas: el centro de un grupo = "meter dentro"; bordes y tarjetas normales = ordenar (antes / después)
            function pickGridTarget(cards, x, y, draggedId) {
                if (!cards.length) return null;
                const hit = cards.find(c => x >= c.rect.left && x <= c.rect.right && y >= c.rect.top && y <= c.rect.bottom);
                let ref = hit;
                if (hit) {
                    if (hit.id === draggedId) return { kind: 'none' };
                    if (hit.isGroup) {
                        const fx = (x - hit.rect.left) / hit.rect.width, fy = (y - hit.rect.top) / hit.rect.height;
                        if (fx > 0.12 && fx < 0.88 && fy > 0.12 && fy < 0.88) return { kind: 'group', id: hit.id };
                    }
                } else {
                    // En un hueco entre tarjetas: se toma la más cercana
                    let best = Infinity;
                    cards.forEach(c => {
                        const dx = Math.max(c.rect.left - x, 0, x - c.rect.right);
                        const dy = Math.max(c.rect.top - y, 0, y - c.rect.bottom);
                        const d = dx * dx + dy * dy;
                        if (d < best) { best = d; ref = c; }
                    });
                }
                if (!ref || ref.id === draggedId) return { kind: 'none' };
                return { kind: 'reorder', refId: ref.id, after: x > ref.rect.left + ref.rect.width / 2 };
            }

            function computeDndTarget(x, y) {
                const hit = document.elementFromPoint(x, y);   // la copia y la línea tienen pointer-events:none
                if (hit) {
                    const crumb = hit.closest('#breadcrumbs-container [data-drop-parent]');
                    if (crumb) {
                        const pid = crumb.dataset.dropParent || '';
                        return canDropInto(dnd.itemId, pid) ? { kind: 'crumb', id: pid, el: crumb } : { kind: 'none' };
                    }
                    const back = hit.closest('#backToParentBtn');
                    if (back && !back.classList.contains('hidden') && currentViewStack.length > 0) {
                        const pid = currentViewStack.length > 1 ? currentViewStack[currentViewStack.length - 2] : '';
                        return canDropInto(dnd.itemId, pid) ? { kind: 'back', id: pid, el: back } : { kind: 'none' };
                    }
                }
                const grid = mainItemsEl.getBoundingClientRect(), m = 24;
                if (x < grid.left - m || x > grid.right + m || y < grid.top - m || y > grid.bottom + m) return { kind: 'none' };
                const cards = Array.from(mainItemsEl.children)
                    .filter(c => c.classList && c.classList.contains('item') && c.dataset.id)
                    .map(c => ({ id: c.dataset.id, isGroup: c.classList.contains('group-item'), rect: c.getBoundingClientRect(), el: c }));
                const t = pickGridTarget(cards, x, y, dnd.itemId);
                if (!t) return { kind: 'none' };
                if (t.kind === 'group') {
                    if (!canDropInto(dnd.itemId, t.id)) return { kind: 'none' };
                    t.el = cards.find(c => c.id === t.id).el;
                } else if (t.kind === 'reorder') {
                    t.rect = cards.find(c => c.id === t.refId).rect;
                }
                return t;
            }

            function setHighlight(el, label) {
                if (dnd.hlEl !== el) {
                    clearHighlight();
                    if (el) el.classList.add('drop-into');
                    dnd.hlEl = el || null;
                }
                if (el && label) el.dataset.dropLabel = label;
            }
            function clearHighlight() {
                if (dnd.hlEl) { dnd.hlEl.classList.remove('drop-into'); delete dnd.hlEl.dataset.dropLabel; }
                dnd.hlEl = null;
            }
            function showIndicator(rect, after) {
                const ind = dnd.indicator;
                if (!ind) return;
                ind.style.height = rect.height + 'px';
                ind.style.left = ((after ? rect.right + 3.5 : rect.left - 3.5) - 2.5) + 'px';
                ind.style.top = rect.top + 'px';
                ind.classList.add('show');
            }
            function hideIndicator() { if (dnd.indicator) dnd.indicator.classList.remove('show'); }

            function updateDndTarget(x, y) {
                const t = computeDndTarget(x, y);
                dnd.target = t;
                if (t.kind === 'group') {
                    const g = findItemRecursive(t.id);
                    setHighlight(t.el, 'Soltar en «' + (g ? g.item.name : 'grupo') + '»');
                    hideIndicator();
                } else if (t.kind === 'crumb' || t.kind === 'back') {
                    setHighlight(t.el, '');
                    hideIndicator();
                } else if (t.kind === 'reorder') {
                    clearHighlight();
                    showIndicator(t.rect, t.after);
                } else {
                    clearHighlight();
                    hideIndicator();
                }
            }

            function startDnd(e) {
                const pend = dnd.pending;
                const card = pend && pend.card;
                if (!card || !card.isConnected) { dnd.pending = null; return; }
                const rect = card.getBoundingClientRect();
                dnd.active = true;
                dnd.itemId = pend.id;
                dnd.sourceEl = card;
                dnd.offX = pend.startX - rect.left;
                dnd.offY = pend.startY - rect.top;
                dnd.x = e.clientX; dnd.y = e.clientY;
                dnd.target = null;

                // La "copia" que sigue al puntero es una píldora pequeña: así nunca tapa el grupo de destino
                const found = findItemRecursive(pend.id);
                const it = found ? found.item : null;
                const ghost = document.createElement('div');
                ghost.className = 'dnd-ghost';
                const gi = document.createElement('i');
                gi.className = 'fas ' + (it && it.type === 'group' ? 'fa-folder' : it && it.type === 'note' ? 'fa-sticky-note' : it && it.type === 'image' ? 'fa-image' : 'fa-link');
                const gt = document.createElement('span');
                gt.textContent = it ? it.name : '';
                ghost.appendChild(gi);
                ghost.appendChild(gt);
                if (it && it.color) ghost.style.setProperty('--ghost-color', it.color);
                document.body.appendChild(ghost);
                dnd.ghost = ghost;

                const ind = document.createElement('div');
                ind.className = 'dnd-indicator';
                document.body.appendChild(ind);
                dnd.indicator = ind;

                card.classList.add('dnd-source');
                document.body.classList.add('is-dragging-item');
                try { card.setPointerCapture(pend.pointerId); } catch (err) {}
                if (window.getSelection) window.getSelection().removeAllRanges();
                dnd.raf = requestAnimationFrame(dndTick);
            }

            function positionGhost(x, y) {
                if (dnd.ghost) dnd.ghost.style.transform = 'translate(' + (x + 16) + 'px,' + Math.max(6, y - 48) + 'px) rotate(-2deg)';
            }

            // Auto-scroll al acercarte al borde de la ventana
            function dndTick() {
                if (!dnd.active) return;
                const edge = 70, max = 22;
                let dy = 0;
                if (dnd.y < edge) dy = -Math.ceil((edge - dnd.y) / edge * max);
                else if (dnd.y > window.innerHeight - edge) dy = Math.ceil((dnd.y - (window.innerHeight - edge)) / edge * max);
                if (dy) {
                    const before = window.scrollY;
                    window.scrollBy(0, dy);
                    if (window.scrollY !== before) updateDndTarget(dnd.x, dnd.y);
                }
                dnd.raf = requestAnimationFrame(dndTick);
            }

            function cleanupDnd() {
                cancelAnimationFrame(dnd.raf);
                if (dnd.ghost) dnd.ghost.remove();
                if (dnd.indicator) dnd.indicator.remove();
                clearHighlight();
                if (dnd.sourceEl) dnd.sourceEl.classList.remove('dnd-source');
                document.body.classList.remove('is-dragging-item');
                dnd.ghost = null; dnd.indicator = null; dnd.sourceEl = null;
                dnd.active = false; dnd.pending = null;
            }
            function cancelDnd() {
                if (!dnd.active) { dnd.pending = null; return; }
                dnd.suppressClick = true;
                setTimeout(() => { dnd.suppressClick = false; }, 80);
                cleanupDnd();
            }

            function onDndPointerDown(e) {
                if (e.button !== 0 || isFiltering() || dnd.active) return;
                const card = e.target.closest('#main-items > .item');
                if (!card || !card.dataset.id) return;
                const onHandle = !!e.target.closest('.drag-handle');
                if (!onHandle) {
                    if (e.pointerType === 'touch') return;                    // en táctil solo desde el asa (para poder hacer scroll)
                    if (e.target.closest('.item-actions-container, button, input, textarea, select')) return;
                }
                dnd.pending = { card, id: card.dataset.id, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, onHandle };
                if (onHandle) e.preventDefault();                              // evita seleccionar texto
            }
            function onDndPointerMove(e) {
                if (dnd.pending && !dnd.active) {
                    const dist = Math.hypot(e.clientX - dnd.pending.startX, e.clientY - dnd.pending.startY);
                    if (dist < (dnd.pending.onHandle ? 4 : 8)) return;
                    startDnd(e);
                }
                if (!dnd.active) return;
                e.preventDefault();
                dnd.x = e.clientX; dnd.y = e.clientY;
                positionGhost(dnd.x, dnd.y);
                updateDndTarget(dnd.x, dnd.y);
            }
            function onDndPointerUp(e) {
                if (!dnd.active) { dnd.pending = null; return; }
                const itemId = dnd.itemId, srcEl = dnd.sourceEl;
                const target = computeDndTarget(e.clientX, e.clientY);
                dnd.suppressClick = true;
                setTimeout(() => { dnd.suppressClick = false; }, 80);
                cleanupDnd();
                performDrop(itemId, srcEl, target);
            }
            mainItemsEl.addEventListener('pointerdown', onDndPointerDown);
            mainItemsEl.addEventListener('dragstart', (e) => e.preventDefault());      // enlaces: sin arrastre nativo
            document.addEventListener('pointermove', onDndPointerMove, { passive: false });
            document.addEventListener('pointerup', onDndPointerUp);
            document.addEventListener('pointercancel', cancelDnd);
            window.addEventListener('blur', cancelDnd);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && dnd.active) { e.preventDefault(); e.stopPropagation(); cancelDnd(); }
            }, true);
            document.addEventListener('click', (e) => {                                   // el clic que sigue a un arrastre no abre nada
                if (dnd.suppressClick) { e.preventDefault(); e.stopPropagation(); dnd.suppressClick = false; }
            }, true);

            function performDrop(itemId, srcEl, target) {
                if (!target || target.kind === 'none') return;
                if (target.kind === 'reorder') reorderMainItem(itemId, target.refId, target.after);
                else handleDropIntoTarget(srcEl, itemId, target);
            }

            // Reordenar: solo cambia la posición de lo que se ve; lo demás (p. ej. las notas) no se toca
            function reorderMainItem(itemId, refId, after) {
                if (itemId === refId) return;
                const parentId = getCurrentParentId();
                let arr = data;
                if (parentId) {
                    const pr = findItemRecursive(parentId);
                    if (!pr || !pr.item.items) { render(); return; }
                    arr = pr.item.items;
                }
                const domIds = Array.from(mainItemsEl.children).map(c => c.dataset && c.dataset.id).filter(Boolean);
                const without = domIds.filter(id => id !== itemId);
                let idx = without.indexOf(refId);
                if (idx === -1 || !domIds.includes(itemId)) return;
                if (after) idx++;
                const newOrder = [...without.slice(0, idx), itemId, ...without.slice(idx)];
                if (newOrder.join('|') === domIds.join('|')) return;                      // quedaría igual
                const byId = new Map(arr.map(i => [i.id, i]));
                const ordered = newOrder.map(id => byId.get(id)).filter(Boolean);
                const inView = new Set(newOrder);
                let c = 0;
                for (let i = 0; i < arr.length; i++) {
                    if (inView.has(arr[i].id) && ordered[c]) arr[i] = ordered[c++];
                }
                // Animación suave: cada tarjeta se desliza desde su sitio anterior al nuevo
                const before = new Map();
                Array.from(mainItemsEl.children).forEach(el => { if (el.dataset && el.dataset.id) before.set(el.dataset.id, el.getBoundingClientRect()); });
                flashGroupId = itemId;
                saveData();
                render();
                Array.from(mainItemsEl.children).forEach(el => {
                    const b = before.get(el.dataset && el.dataset.id);
                    if (!b || !el.animate) return;
                    const a = el.getBoundingClientRect();
                    const dx = b.left - a.left, dy = b.top - a.top;
                    if (dx || dy) el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: 340, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
                });
            }

            // Mueve un elemento a un grupo (parentId '' = Inicio) y devuelve lo necesario para deshacerlo
            function moveItemToParent(itemId, parentId) {
                const res = findItemRecursive(itemId);
                if (!res) return null;
                const fromDet = findParentDetails(itemId, data);
                const info = { itemId, fromParentId: (fromDet && fromDet.parentId) || '', fromIndex: res.index, toParentId: parentId || '' };
                res.parentArray.splice(res.index, 1);
                let dest = data;
                if (parentId) {
                    const pr = findItemRecursive(parentId);
                    if (pr && pr.item.type === 'group') {

            function timeAgo(ts) {
                const mins = Math.floor((Date.now() - ts) / 60000);

                const hours = Math.floor(mins / 60);
                if (hours < 24) return `hace ${hours} h`;
                const days = Math.floor(hours / 24);
                if (days === 1) return 'ayer';

            // ---- Notas: texto enriquecido sencillo ----
            function escapeHTML(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function inlineMd(str) {
                let t = escapeHTML(str);
                // Se protegen el código y las URLs para que el formato no las rompa
                const stash = [];
                const hold = (html) => { stash.push(html); return '\u0001' + (stash.length - 1) + '\u0002'; };
                t = t.replace(/!\[([^\]]*)\]\(img:([\w-]+)\)/g, (m, alt, id) => hold('<img class="note-inline-img" data-img-id="' + id + '" alt="' + alt + '">'));
                t = t.replace(/`([^`]+)`/g, (m, c) => hold('<code>' + c + '</code>'));
                t = t.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, (m, u) => hold('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'));
                t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
                t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
                t = t.replace(/==([^=]+)==/g, '<mark class="note-hl">$1</mark>');
                return t.replace(/\u0001(\d+)\u0002/g, (m, i) => stash[+i]);
            }
            function renderNoteHTML(text) {
                let out = '';
                text.split('\n').forEach((line, i) => {
                    const indent = line.match(/^[ \t]*/)[0].replace(/\t/g, '  ').length;
                    const lvl = Math.min(6, Math.floor(indent / 2));
                    const st = lvl ? ` style="--lvl:${lvl}"` : '';
                    let m;
                    if ((m = line.match(/^\s*!\[([^\]]*)\]\(img:([\w-]+)\)\s*$/))) {
                        out += `<div class="note-line note-img-block"><img class="note-img" data-img-id="${m[2]}" data-line="${i}" alt="${escapeHTML(m[1])}"></div>`;
                    } else if ((m = line.match(/^\s*- \[([ xX])\] ?(.*)$/))) {
                        const done = m[1].toLowerCase() === 'x';
                        out += `<div class="note-line note-check${done ? ' is-done' : ''}"${st}><input type="checkbox" data-line="${i}"${done ? ' checked' : ''}><span class="nc-text">${inlineMd(m[2])}</span></div>`;
                    } else if ((m = line.match(/^\s*[-*] (.*)$/))) {
                        out += `<div class="note-line note-li"${st}>${inlineMd(m[1])}</div>`;
                    } else if ((m = line.match(/^\s*(\d+)\. (.*)$/))) {
                        out += `<div class="note-line"${st}><strong>${m[1]}.</strong> ${inlineMd(m[2])}</div>`;
                    } else if ((m = line.match(/^#{1,3} (.*)$/))) {
                        out += `<div class="note-line note-h">${inlineMd(m[1])}</div>`;
                    } else if ((m = line.match(/^\s*> ?(.*)$/))) {
                        out += `<div class="note-line note-quote">${inlineMd(m[1])}</div>`;
                    } else if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
                        out += '<hr class="note-hr">';
                    } else if (line.trim() === '') {
                        out += '<div class="note-gap"></div>';
                    } else {
                        out += `<div class="note-line"${st}>${inlineMd(line)}</div>`;
                    }
                });
                return out;
            }
            function checklistProgress(text) {
                const total = (text.match(/^\s*- \[[ xX]\]/gm) || []).length;
                const done = (text.match(/^\s*- \[[xX]\]/gm) || []).length;
                return { total, done };
            }
            // Marca / desmarca la tarea de una línea y devuelve el texto nuevo (o null si no es una tarea)
            function toggleChecklistInText(text, lineIndex) {
                const lines = text.split('\n');
                if (typeof lines[lineIndex] === 'undefined') return null;
                const next = lines[lineIndex].replace(/^(\s*- \[)([ xX])(\])/, (m, a, b, c) => a + (b === ' ' ? 'x' : ' ') + c);
                if (next === lines[lineIndex]) return null;
                lines[lineIndex] = next;
                return lines.join('\n');
            }
            function removeCompletedTasks(text) {
                const lines = text.split('\n');
                const kept = lines.filter(l => !/^\s*- \[[xX]\]/.test(l));
                return { text: kept.join('\n'), removed: lines.length - kept.length };
            }

            function toggleChecklistLine(itemId, lineIndex) {
                if (noteState && noteState.id === itemId) flushNoteSave();
                const r = findItemRecursive(itemId);

            // ---- Notas: editor del modal ----
            function updateNoteStats() {
                const t = modalItemDescription.value;
                const words = t.trim() ? t.trim().split(/\s+/).length : 0;
                noteStatsEl.textContent = `${words} palabras · ${t.length} caracteres · Ctrl+Intro para guardar`;

            function autoGrowNote() {
                if (!modalContentEl.classList.contains('note-mode')) return;
                modalItemDescription.style.height = 'auto';
                modalItemDescription.style.height = Math.min(modalItemDescription.scrollHeight + 2, window.innerHeight * 0.5) + 'px';
            }
            // Reemplaza texto de un textarea conservando el historial de deshacer (Ctrl+Z)
            function replaceText(ta, start, end, text) {
                if (start === end && text === '') return;
                ta.focus();
                ta.setSelectionRange(start, end);
                let fired = false;
                const mark = () => { fired = true; };
                ta.addEventListener('input', mark, { once: true });
                let ok = false;
                try {
                    ok = (text === '') ? document.execCommand('delete') : document.execCommand('insertText', false, text);
                } catch (err) { ok = false; }
                ta.removeEventListener('input', mark);
                if (!ok) { ta.setRangeText(text, start, end, 'end'); fired = false; }
                if (!fired) ta.dispatchEvent(new Event('input'));
            }

            const NOTE_WRAP_MARKS = { bold: '**', italic: '*', strike: '~~', highlight: '==', code: '`' };
            const NOTE_LINE_PREFIX = { check: '- [ ] ', bullet: '- ', number: '1. ', heading: '# ', quote: '> ' };
            const NOTE_LINE_STRIP = /^(\s*)(- \[[ xX]\] ?|[-*] |\d+\. |#{1,3} |> ?)/;

            // ¿El texto ya está envuelto por la marca? (** negrita, * cursiva, ~~ tachado...)
            function isWrapped(str, mark) {
                const L = mark.length;
                if (str.length < 2 * L + 1 || !str.startsWith(mark) || !str.endsWith(mark)) return false;
                if (mark === '*') {
                    const lead = str.match(/^\*+/)[0].length, trail = str.match(/\*+$/)[0].length;
                    return lead % 2 === 1 && trail % 2 === 1;   // 1 ó 3 asteriscos = cursiva; 2 = negrita
                }
                return true;
            }

            function applyNoteAction(action, ta = modalItemDescription) {
                ta.focus();
                const val = ta.value;
                const start = ta.selectionStart, end = ta.selectionEnd;
                const lineStartOf = (pos) => pos === 0 ? 0 : val.lastIndexOf('\n', pos - 1) + 1;
                const lineEndOf = (pos) => { const i = val.indexOf('\n', pos); return i === -1 ? val.length : i; };
                const effEnd = (end > start && val[end - 1] === '\n') ? end - 1 : end;

                if (NOTE_LINE_PREFIX[action]) {
                    // Tareas, listas, título y cita: se aplican (o se quitan) en todas las líneas seleccionadas
                    const ls = lineStartOf(start), le = lineEndOf(effEnd);
                    const lines = val.slice(ls, le).split('\n');
                    const has = {
                        check: l => /^\s*- \[[ xX]\] /.test(l),
                        bullet: l => /^\s*[-*] /.test(l) && !/^\s*- \[[ xX]\] /.test(l),
                        number: l => /^\s*\d+\. /.test(l),
                        heading: l => /^#{1,3} /.test(l),
                        quote: l => /^\s*>/.test(l)
                    }[action];
                    const filled = lines.filter(l => l.trim() !== '');
                    const allHave = filled.length > 0 && filled.every(has);
                    let n = 1;
                    const out = lines.map(l => {
                        if (l.trim() === '' && lines.length > 1) return l;
                        const m = l.match(NOTE_LINE_STRIP);
                        const indent = m ? m[1] : l.match(/^\s*/)[0];
                        const body = m ? l.slice(m[0].length) : l.slice(indent.length);
                        if (allHave) return indent + body;
                        return indent + (action === 'number' ? (n++) + '. ' : NOTE_LINE_PREFIX[action]) + body;
                    });
                    replaceText(ta, ls, le, out.join('\n'));

                } else if (NOTE_WRAP_MARKS[action]) {
                    // Negrita, cursiva, tachado, resaltado y código
                    const mark = NOTE_WRAP_MARKS[action], L = mark.length;
                    if (start !== end) {
                        const sel = val.slice(start, end);
                        const outside = val.slice(start - L, start) === mark && val.slice(end, end + L) === mark &&
                            (mark !== '*' || (val[start - 2] !== '*' && val[end + 1] !== '*'));
                        if (isWrapped(sel, mark)) {                       // quitar la marca (dentro de la selección)
                            const inner = sel.slice(L, sel.length - L);
                            replaceText(ta, start, end, inner);
                            ta.setSelectionRange(start, start + inner.length);
                        } else if (outside) {                              // quitar la marca (rodeando la selección)
                            replaceText(ta, start - L, end + L, sel);
                            ta.setSelectionRange(start - L, start - L + sel.length);
                        } else {                                           // poner la marca
                            replaceText(ta, start, end, mark + sel + mark);
                            ta.setSelectionRange(start + L, end + L);
                        }
                    } else if (action === 'strike') {
                        // Sin selección: tacha (o destacha) toda la línea, respetando el marcador de lista
                        const ls = lineStartOf(start), le = lineEndOf(start);
                        const m = val.slice(ls, le).match(/^(\s*(?:- \[[ xX]\] ?|[-*] |\d+\. |#{1,3} |> ?)?)([\s\S]*)$/);
                        const head = m[1], body = m[2];
                        if (body.trim() === '') {
                            replaceText(ta, start, start, mark + mark);
                            ta.setSelectionRange(start + L, start + L);
                        } else {
                            const trimmed = body.trimEnd();
                            const tail = body.slice(trimmed.length);
                            const nb = isWrapped(trimmed, mark) ? trimmed.slice(L, trimmed.length - L) : mark + trimmed + mark;
                            replaceText(ta, ls + head.length, le, nb + tail);
                            const pos = ls + head.length + nb.length;
                            ta.setSelectionRange(pos, pos);
                        }
                    } else {
                        replaceText(ta, start, start, mark + mark);
                        ta.setSelectionRange(start + L, start + L);
                    }

                } else if (action === 'indent' || action === 'outdent') {
                    const ls = lineStartOf(start), le = lineEndOf(effEnd);
                    const lines = val.slice(ls, le).split('\n');
                    let first = 0, total = 0;
                    const out = lines.map((l, i) => {
                        if (action === 'indent') {
                            if (l.trim() === '' && lines.length > 1) return l;
                            if (i === 0) first = 2;
                            total += 2;
                            return '  ' + l;
                        }
                        const m = l.match(/^(\t| {1,2})/);
                        const cut = m ? m[0].length : 0;
                        if (i === 0) first = -cut;
                        total -= cut;
                        return l.slice(cut);
                    });
                    if (total === 0) return;
                    replaceText(ta, ls, le, out.join('\n'));
                    const ns = Math.max(ls, start + first);
                    ta.setSelectionRange(ns, Math.max(ns, end + total));

                } else if (action === 'image') {
                    pickImagesForTextarea(ta);

                } else if (action === 'date') {
                    const stamp = new Date().toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    replaceText(ta, start, end, stamp);

                } else if (action === 'clean') {
                    const res = removeCompletedTasks(val);
                    if (!res.removed) { showToast('No hay tareas completadas'); return; }
                    replaceText(ta, 0, val.length, res.text);
                    showToast(res.removed + (res.removed === 1 ? ' tarea completada quitada' : ' tareas completadas quitadas') + (ta.offsetParent !== null ? ' · Ctrl+Z para deshacer' : ''));
                }
            }
            noteToolbarEl.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
            noteToolbarEl.addEventListener('click', e => {
                const btn = e.target.closest('button[data-note-action]');
                if (btn) applyNoteAction(btn.dataset.noteAction);
            });

            // "Tareas" siempre empieza apagado (estado neutro) al abrir una nota
            function resetNoteToolbarState() {
                document.querySelectorAll('.note-toolbar button[data-note-action="check"]').forEach(btn => {
                    btn.classList.remove('active');

            modalItemDescription.addEventListener('input', () => {
